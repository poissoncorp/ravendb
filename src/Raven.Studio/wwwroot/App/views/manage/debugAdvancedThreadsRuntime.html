<div class="flex-window stretch debug-advanced">
    <div class="flex-window-head">
        <div class="clearfix padding padding-sm">
            <div class="flex-header flex-horizontal flex-shrink-0 margin-bottom justify-content-between">
                <div class="flex-header flex-horizontal flex-shrink-0">
                    <div>
                        <div class="btn-group">
                            <button class="btn btn-primary" data-bind="click: pause, visible: liveClient">
                                <i class="icon-pause"></i> <span data-bind="i18n: 'debugAdvancedThreadsRuntime:pause'"></span>
                            </button>
                            <button class="btn btn-primary" data-bind="click: resume, visible: !liveClient()">
                                <i class="icon-play"></i> <span data-bind="i18n: 'debugAdvancedThreadsRuntime:resume'"></span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <input class="form-control"
                            data-bind="textInput: filter, i18nAttr: { placeholder: 'debugAdvancedThreadsRuntime:filterPlaceholder' }" />
                    </div>
                    <div class="btn-group">
                        <select id="visibleColumnsSelector" size="5" multiple="multiple"
                            data-bind="options: allColumnHeaders, optionsText: columnLabel, selectedOptions: visibleColumnHeaders"></select>
                    </div>
                    <div>
                        <div class="text-muted info-block">
                            <div class="text-center"><small data-bind="i18n: 'debugAdvancedThreadsRuntime:ravenDbCpuUsage'"></small></div>
                            <div class="text-center">
                                <small><strong data-bind="text: serverCpuUsage().toFixed(0) + ' %'"></strong></small>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="text-muted info-block">
                            <div class="text-center"><small data-bind="i18n: 'debugAdvancedThreadsRuntime:machineCpuUsage'"></small></div>
                            <div class="text-center">
                                <small><strong data-bind="text: machineCpuUsage().toFixed(0) + ' %'"></strong></small>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="text-muted info-block">
                            <div class="text-center"><small data-bind="i18n: 'debugAdvancedThreadsRuntime:threadsCount'"></small></div>
                            <div class="text-center">
                                <small><strong data-bind="text: threadsCount"></strong></small>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="text-muted info-block">
                            <div class="text-center"><small data-bind="i18n: 'debugAdvancedThreadsRuntime:dedicatedThreadsCount'"></small></div>
                            <div class="text-center">
                                <small><strong data-bind="text: dedicatedThreadsCount"></strong></small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="toggle">
                    <input id="io-totals-since-creation" type="checkbox"
                        data-bind="checked: showTotalsSinceThreadCreation">
                    <label for="io-totals-since-creation" class="properties-label" data-bind="i18n: 'debugAdvancedThreadsRuntime:ioTotalsSinceCreation'"></label>
                    <div class="js-io-totals-info">
                        <i class="icon-info text-info"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-grow">
        <div class="results-error" data-bind="visible: !isConnectedToWebSocket()">
            <div class="help-block bg-warning text-warning">
                <span data-bind="visible: isPause"><i class="icon-warning"></i><span data-bind="i18n: 'debugAdvancedThreadsRuntime:liveUpdatePaused'"></span></span>
                <span data-bind="visible: !isPause()"><i class="btn-spinner"></i><span class="margin-left" data-bind="i18n: 'debugAdvancedThreadsRuntime:tryingToConnect'"></span></span>
            </div>
        </div>
        <div class="scroll-stretch">
            <div class="panel">
                <virtual-grid class="resizable documents-grid"
                    params="controller: gridController, emptyTemplate: 'empty-threads-info-template'"></virtual-grid>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="empty-threads-info-template">
    <span data-bind="i18n: 'debugAdvancedThreadsRuntime:noEntries'"></span>
</script>

<div class="tooltip json-preview lg js-threads-runtime-tooltip" style="opacity: 0">
</div>
