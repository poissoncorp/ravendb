<div class="flex-window stretch">
    <div class="flex-window-head">

        <div class="clearfix padding padding-sm">

            <div class="flex-header flex-horizontal margin-bottom">
                <div class="btn-group">
                    <button type="button" class="btn btn-primary"
                            data-bind="click: refresh, enable: !spinners.refresh(), css: { 'btn-spinner': spinners.refresh() }">
                        <i class="icon-refresh"></i>
                        <span data-bind="i18n: 'common:refresh'"></span>
                    </button>
                </div>
                <div>
                    <input class="form-control" data-bind="textInput: filter, i18nAttr: { placeholder: 'debugAdvancedObserverLog:filterPlaceholder' }">
                </div>
                <div data-bind="visible: !noLeader(), i18n: { key: 'debugAdvancedObserverLog:term', options: { term: topology().currentTerm().toLocaleString() } }"></div>
                <div class="flex-separator"></div>
                <div>
                    <button class="btn btn-default" data-bind="click: exportToFile">
                        <i class="icon-export"></i><span data-bind="i18n: 'debugAdvancedObserverLog:export'"></span>
                    </button>
                </div>
                <div data-bind="visible: !noLeader()">
                    <button class="btn btn-default"
                            data-bind="click: suspendObserver, visible: !$root.observerSuspended(), enable: !spinners.toggleObserver(), css: { 'btn-spinner': spinners.toggleObserver() }, i18nAttr: { title: 'debugAdvancedObserverLog:suspendTitle' }">
                        <i class="icon-pause"></i>
                        <span data-bind="i18n: 'debugAdvancedObserverLog:suspend'"></span>
                    </button>
                    <button class="btn btn-success"
                            data-bind="click: resumeObserver, visible: $root.observerSuspended(), enable: !spinners.toggleObserver(), css: { 'btn-spinner': spinners.toggleObserver() }, i18nAttr: { title: 'debugAdvancedObserverLog:resume' }">
                        <i class="icon-play"></i>
                        <span data-bind="i18n: 'debugAdvancedObserverLog:resume'"></span>
                    </button>
                </div>
            </div>
        </div>

    </div>
    <div class="flex-window-scroll">
        <div class="scroll-stretch">
            <div class="panel-body">
                <virtual-grid class="resizable documents-grid" params="controller: gridController, emptyTemplate: 'empty-cluster-log-template'"></virtual-grid>
            </div>
        </div>
    </div>
    <div class="has-error" data-bind="visible: termChanged()">
        <div class="help-block">
            <i class="icon-danger"></i><span><span data-bind="i18n: 'debugAdvancedObserverLog:termChanged'"></span> <a href="#" data-bind="click: refresh, i18n: 'debugAdvancedObserverLog:termChangedRefresh'"></a></span>
        </div>
    </div>
</div>
<script type="text/html" id="empty-cluster-log-template">
    <div class="text-danger" data-bind="visible: $root.noLeader, html: $root.leaderOnlyHtml"></div>
    <div data-bind="visible: !$root.noLeader(), i18n: 'debugAdvancedObserverLog:noEntries'"></div>
</script>
<div class="tooltip json-preview lg js-observer-log-tooltip" style="opacity: 0">
</div>
