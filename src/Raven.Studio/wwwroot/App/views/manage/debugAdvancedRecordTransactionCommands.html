<div class="padding">
    <form class="flex-form" data-bind="submit: startRecording" autocomplete="off">
        <h3 data-bind="i18n: 'debugAdvancedRecordTransactionCommands:title'"></h3>
        <div class="bg-warning inline-block padding padding-xs small"><i class="icon-warning"></i>&nbsp;
            <span data-bind="html: $root.warningHtml"></span>
        </div>
        <div class="row margin-top">
            <div class="col-lg-6 col-sm-8">
                <div class="form-group" data-bind="validationElement: databaseName">
                    <label class="control-label" data-bind="i18n: 'debugAdvancedRecordTransactionCommands:databaseName'"></label>
                    <div class="flex-grow">
                        <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                            <span data-bind="text: databaseName"></span><span data-bind="i18n: databaseName() ? null : 'debugAdvancedRecordTransactionCommands:selectDatabase'"></span>
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu" data-bind="foreach: databaseNames">
                            <li><a href="#" data-bind="text: $data, click: _.partial($root.databaseName, $data)"></a></li>
                        </ul>
                        <span class="help-block" data-bind="validationMessage: databaseName"></span>
                    </div>
                </div>
                <div class="form-group" data-bind="validationElement: outputFile">
                    <label class="control-label"><span data-bind="i18n: 'debugAdvancedRecordTransactionCommands:outputFilePath'"></span><br /></label>
                    <div class="flex-grow" data-bind="validationOptions: { insertMessages: false }">
                        <div class="dropdown btn-block">
                            <input type="text" class="form-control dropdown-toggle" data-toggle="dropdown" id="outputFilePath"
                                   data-bind="textInput: outputFile, hasFocus: outputFilePathHasFocus, i18nAttr: { placeholder: 'debugAdvancedRecordTransactionCommands:outputFilePathPlaceholder' }" />
                            <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
                            <ul class="dropdown-menu max-height" data-bind="foreach: outputFilePathOptions, autoComplete: '#outputFilePath'">
                                <li data-bind="click: $parent.outputFilePathChanged">
                                    <a href="#" data-bind="text: $data"></a>
                                </li>
                            </ul>
                        </div>
                        <span class="help-block" data-bind="validationMessage: outputFile"></span>
                    </div>
                </div>
            </div>
        </div>
        <hr />
        <button type="submit" class="btn btn-primary">
            <i class="icon-transaction-record"></i>
            <span data-bind="i18n: 'debugAdvancedRecordTransactionCommands:startRecording'"></span>
        </button>
        <div class="margin-top" data-bind="if: runningTasks().length, visible: runningTasks().length">
            <h3 data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.title'"></h3>
            <div class="row">
                <div class="col-lg-6 col-sm-8">
                    <table class="table table-striped table-condensed table-bordered">
                        <thead>
                            <tr>
                                <th data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.status'"></th>
                                <th data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.database'"></th>
                                <th data-bind="i18n: 'debugAdvancedRecordTransactionCommands:outputFilePath'"></th>
                            </tr>
                        </thead>
                        <tbody data-bind="foreach: runningTasks">
                            <tr data-bind="css: { 'blink-style': highlight }">
                                <td>
                                    <div class="text-success" data-bind="visible: !inProgress()">
                                        <i class="icon-check"></i>
                                        <span data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.completed'"></span>
                                    </div>
                                    <div class="flex-horizontal" data-bind="visible: inProgress()">
                                        <span class="btn-spinner margin-left margin-left-sm">
                                            <i class=""></i> <span data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.running'"></span>
                                        </span>
                                        <div class="flex-separator"></div>
                                        <button class="btn btn-danger btn-sm" data-bind="click: _.partial($root.stopRecording, databaseName)">
                                            <i class="icon-stop"></i>
                                            <span data-bind="i18n: 'debugAdvancedRecordTransactionCommands:recordings.stop'"></span>
                                        </button>
                                    </div>
                                </td>
                                <td data-bind="text: databaseName"></td>
                                <td data-bind="text: filePath"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </form>
</div>
