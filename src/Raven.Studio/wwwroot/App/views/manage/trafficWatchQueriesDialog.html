<div class="modal-dialog modal-lg queries-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: cancel, i18nAttr: { title: 'trafficWatch:queriesDialog.cancelTitle' }" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="i18n: 'trafficWatch:queriesDialog.title'"></h4>
        </div>
        <div class="modal-body">
            <h4 class="margin-top" data-bind="i18n: 'trafficWatch:queriesDialog.selectQuery'"></h4>
            <div class="padding">
                <div data-bind="foreach: queryList" class="margin-top margin-bottom scroll queries-list">
                    <div class="flex-horizontal margin-right margin-bottom-sm">
                        <div class="flex-grow margin-right-xs">
                            <pre class="bg-info"><code data-bind="text: $data"></code></pre>
                        </div>
                        <div>
                            <button class="btn btn-primary" data-bind="click: $parent.executeQuery.bind($parent, $data), i18nAttr: { title: 'trafficWatch:queriesDialog.runTitle' }">
                                <i class="icon-play2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel', i18nAttr: { title: 'trafficWatch:queriesDialog.cancelTitle' }"></button>
        </div>
    </div>
</div>
