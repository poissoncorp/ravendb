<div class="content-margin">
    <div class="row flex-row absolute-fill">
        <form class="col-xs-12 col-lg-6 flex-vertical">
            <div class="flex-header">
                <button class="btn btn-primary" data-bind="i18nAttr: { title: 'addClusterNode:addTitle' }, click: save, disable: spinners.save, css: { 'btn-spinner': spinners.save }">
                    <i class="icon-plus"></i> <span data-bind="i18n: 'addClusterNode:add'"></span>
                </button>
                <button class="btn btn-default" data-bind="i18nAttr: { title: 'common:cancel' }, click: cancelOperation"><i class="icon-cancel"></i> <span data-bind="i18n: 'common:cancel'"></span></button>
            </div>
            <div class="panel">
                <div class="flex-form">
                    <div class="panel-body" data-bind="with: model">
                        <div class="form-group">
                            <label for="url" class="control-label">URL</label>
                            <div class="flex-grow">
                                <div data-bind="validationElement: serverUrl">
                                    <input autocomplete="off" type="text" class="form-control" data-bind="textInput: serverUrl, i18nAttr: { placeholder: 'addClusterNode:form.urlPlaceholder' }" id="url">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="tag" class="control-label" data-bind="i18n: 'addClusterNode:form.tag'"></label>
                            <div class="flex-grow">
                                <div data-bind="validationElement: nodeTag">
                                    <input autocomplete="off" type="text" class="form-control" data-bind="textInput: nodeTag, i18nAttr: { placeholder: 'addClusterNode:form.tagPlaceholder' }" id="tag" maxlength="4">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label"></label>
                            <div class="flex-grow">
                                <div class="toggle">
                                    <input id="toggleWatcher" type="checkbox" data-bind="checked: addAsWatcher" />
                                    <label for="toggleWatcher"><small><span data-bind="i18n: 'addClusterNode:form.addAsWatcher'"></span> <i class="icon-info text-info js-watcher-info"></i></small></label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label"></label>
                            <div class="flex-grow">
                                <div class="toggle">
                                    <input id="toggleAutoAssign" type="checkbox" data-bind="checked: useAvailableCores" />
                                    <label for="toggleAutoAssign"><small data-bind="i18n: 'addClusterNode:form.useAvailableCores'"></small></label>
                                </div>
                            </div>
                        </div>
                        <div data-bind="collapse: !useAvailableCores()">
                            <div class="form-group">
                                <label for="max-utilized-cores" class="control-label" data-bind="i18n: 'addClusterNode:form.maxCores'"></label>
                                <div class="flex-grow">
                                    <div data-bind="validationElement: maxUtilizedCores">
                                        <input autocomplete="off" type="number" class="form-control" min="1"
                                               data-bind="numericInput: maxUtilizedCores, disable: useAvailableCores, i18nAttr: { placeholder: 'addClusterNode:form.maxCoresPlaceholder' }" id="max-utilized-cores">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex-horizontal">
                            <div class="flex-grow">
                            </div>
                            <div>
                                <button type="submit" class="btn btn-default"
                                        data-bind="i18nAttr: { title: 'addClusterNode:test.title' }, click: $root.testConnection, disable: $root.spinners.test, css: { 'btn-spinner': $root.spinners.test }">
                                    <i class="icon-rocket"></i>
                                    <span data-bind="i18n: 'addClusterNode:test.button'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="panel-addon" data-bind="with: $root.testConnectionResult">
                    <div class="padding bg-success small" data-bind="visible: Success">
                        <div data-bind="i18n: 'addClusterNode:test.success'"></div>
                    </div>
                    <div data-bind="if: !Success">
                        <div class="padding bg-danger small">
                            <h2 data-bind="i18n: 'addClusterNode:test.failed'"></h2>
                            <span data-bind="text: $root.fullErrorDetailsVisible() ? Error : $root.shortErrorText()"></span>
                            <div>
                                <a href="#" data-bind="click: $root.fullErrorDetailsVisible.toggle.bind($root.fullErrorDetailsVisible), i18n: $root.fullErrorDetailsVisible() ? 'addClusterNode:test.hideDetails' : 'addClusterNode:test.showDetails'"></a>
                            </div>
                        </div>
                        <div class="padding bg-info small">
                            <h2 data-bind="i18n: 'addClusterNode:about.title'"></h2>
                            <div data-bind="i18n: 'addClusterNode:about.endpoints'"></div>
                            <div data-bind="i18n: 'addClusterNode:about.tcpAfterHttp'"></div>
                            <div data-bind="visible: HTTPSuccess, i18n: 'addClusterNode:about.tcpFailed'"></div>
                            <div data-bind="visible: !HTTPSuccess, i18n: 'addClusterNode:about.httpFailed'"></div>
                            <div>
                                <span data-bind="i18n: 'addClusterNode:about.verify'"></span>
                                <ul>
                                    <li data-bind="i18n: 'addClusterNode:about.urlCorrect'"></li>
                                    <li data-bind="i18n: 'addClusterNode:about.upAndRunning'"></li>
                                    <li data-bind="i18n: 'addClusterNode:about.noFirewall'"></li>
                                    <li data-bind="i18n: 'addClusterNode:about.noNetworkConfig'"></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
