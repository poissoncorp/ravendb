<div class="flex-vertical absolute-fill content-margin traffic-watch">
    <div class="flex-horizontal flex-wrap nospacing flex-shrink-0">
        <div class="flex-horizontal flex-wrap margin-bottom margin-sm">
            <div>
                <button class="btn btn-primary" data-bind="click: pause, visible: liveClient">
                    <i class="icon-pause"></i> <span data-bind="i18n: 'trafficWatch:pause'"></span>
                </button>
                <button class="btn btn-primary" data-bind="click: resume, visible: !liveClient()">
                    <i class="icon-play"></i> <span data-bind="i18n: 'trafficWatch:resume'"></span>
                </button>
                <button class="btn btn-default" data-bind="click: exportToFile">
                    <i class="icon-export"></i><span data-bind="i18n: 'trafficWatch:export'"></span>
                </button>
            </div>
            <div class="btn-group-label" data-label="HTTP">
                <div class="btn-group">
                    <select id="visibleTypesSelectorHttp" multiple="multiple"
                            data-bind="options: filteredTypeDataHttp, selectedOptions: selectedTypeNamesHttp, optionsText: 'propertyName', optionsValue: 'propertyName'"></select>
                </div>
            </div>
            <div class="btn-group-label" data-label="TCP">
                <div class="btn-group">
                    <select id="visibleTypesSelectorTcp" multiple="multiple"
                            data-bind="options: filteredTypeDataTcp, selectedOptions: selectedTypeNamesTcp, optionsText: 'propertyName', optionsValue: 'propertyName'"></select>
                </div>
            </div>
            <div class="btn-group-label" data-bind="i18nAttr: { 'data-label': 'trafficWatch:sizeFilter.requestSize' }">
                <div class="dropdown" data-placement="top">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <span data-bind="text: requestSizeSummary"></span>
                        <span class="caret"></span>
                    </button>
                    <div class="dropdown-menu size-filter-dropdown padding padding-sm" data-bind="dropdownPanel: true">
                        <div class="size-filter-form-group">
                            <label data-bind="i18n: 'trafficWatch:sizeFilter.minLabel'"></label>
                            <input class="form-control" type="number" min="0" data-bind="textInput: requestSizeMin, i18nAttr: { placeholder: 'trafficWatch:sizeFilter.minPlaceholder' }">
                        </div>
                        <div class="size-filter-form-group">
                            <label data-bind="i18n: 'trafficWatch:sizeFilter.maxLabel'"></label>
                            <input class="form-control" type="number" min="0" data-bind="textInput: requestSizeMax, i18nAttr: { placeholder: 'trafficWatch:sizeFilter.maxPlaceholder' }">
                        </div>
                    </div>
                </div>
            </div>
            <div class="btn-group-label" data-bind="i18nAttr: { 'data-label': 'trafficWatch:sizeFilter.responseSize' }">
                <div class="dropdown" data-placement="top">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <span data-bind="text: responseSizeSummary"></span>
                        <span class="caret"></span>
                    </button>
                    <div class="dropdown-menu size-filter-dropdown padding padding-sm" data-bind="dropdownPanel: true">
                        <div class="size-filter-form-group">
                            <label data-bind="i18n: 'trafficWatch:sizeFilter.minLabel'"></label>
                            <input class="form-control" type="number" min="0" data-bind="textInput: responseSizeMin, i18nAttr: { placeholder: 'trafficWatch:sizeFilter.minPlaceholder' }">
                        </div>
                        <div class="size-filter-form-group">
                            <label data-bind="i18n: 'trafficWatch:sizeFilter.maxLabel'"></label>
                            <input class="form-control" type="number" min="0" data-bind="textInput: responseSizeMax, i18nAttr: { placeholder: 'trafficWatch:sizeFilter.maxPlaceholder' }">
                        </div>
                    </div>
                </div>
            </div>
            <div id="trafficFilter">
                <input class="form-control" data-bind="textInput: filter, i18nAttr: { placeholder: 'trafficWatch:filterPlaceholder' }">
            </div>
            <div class="checkbox">
                <input class="styled" id="onlyErrors" type="checkbox" data-bind="checked: onlyErrors">
                <label for="onlyErrors" data-bind="i18n: 'trafficWatch:showErrorsOnly'"></label>
            </div>
        </div>
        <div class="flex-grow"></div>
        <div>
            <i class="icon-info"></i>
            <small data-bind="html: adminLogsInfoHtml"></small>
        </div>
    </div>
    <div class="flex-horizontal">
        <div class="flex-separator"></div>
        <div class="btn-group">
            <div class="btn-group btn-group-sm" role="group">
                <div class="dropdown pull-right">
                    <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
                        <i class="icon-stats"></i><span data-bind="i18n: 'trafficWatch:stats.button'"></span>
                        <span class="caret"></span>
                    </button>
                    <div class="dropdown-menu stats-menu" data-bind="dropdownPanel: true, template: { name: 'stats-template' }">
                    </div>
                </div>
            </div>
            <button class="btn btn-sm btn-info btn-checkable" data-bind="click: toggleTail, css: { active: tailEnabled }">
                <i class="icon-logs"></i><span data-bind="i18n: 'trafficWatch:monitoring'"></span>
            </button>
            <button class="btn btn-sm btn-danger" data-bind="click: clear">
                <i class="icon-cancel"></i><span data-bind="i18n: 'trafficWatch:clear'"></span>
            </button>
        </div>
    </div>
    <div class="flex-grow">
        <virtual-grid class="resizable" params="controller: gridController, emptyTemplate: 'empty-traffic-watch-template'"></virtual-grid>
    </div>

    <div class="help-block bg-warning text-warning" data-bind="visible: !isConnectedToWebSocket()">
        <span data-bind="visible: isPauseLogs"><i class="icon-warning"></i><span data-bind="i18n: 'trafficWatch:paused'"></span></span>
        <span data-bind="visible: !isPauseLogs()"><i class="btn-spinner"></i><span class="margin-left" data-bind="i18n: 'trafficWatch:connecting'"></span></span>
    </div>
    <div class="has-error" data-bind="visible: isBufferFull">
        <div class="help-block">
            <i class="icon-danger"></i><span> <span data-bind="i18n: 'trafficWatch:bufferFull'"></span> <a href="#" data-bind="click: clear, i18n: 'trafficWatch:clearAllEntries'"></a></span>
        </div>
    </div>

</div>

<script type="text/html" id="empty-traffic-watch-template">
    <span data-bind="i18n: 'trafficWatch:empty'"></span>
</script>

<script type="text/html" id="stats-template">
    <div class="panel margin-left margin-left-sm margin-right margin-right-sm">
        <div class="padding padding-lg margin-top margin-top-sm">
            <div class="row margin-top">
                <div class="properties-container stats-container flex-horizontal padding padding-sm" data-bind="i18nAttr: { 'data-label': 'trafficWatch:stats.general' }">
                    <div class="property">
                        <h5><i class="icon-client"></i><span data-bind="i18n: 'trafficWatch:stats.sourceIps'"></span></h5>
                        <strong data-bind="text: stats.sourceIpsCount" class="stats-property"></strong>
                    </div>
                    <div class="property" data-toggle="tooltip" data-bind="i18nAttr: { title: 'trafficWatch:stats.httpRequestsTitle' }" data-placement="top">
                        <h5><i class="icon-running-tasks"></i><span data-bind="i18n: 'trafficWatch:stats.httpRequests'"></span></h5>
                        <strong data-bind="text: stats.httpRequestCount" class="stats-property"></strong>
                    </div>
                    <div class="property">
                        <h5><i class="icon-running-tasks"></i><span data-bind="i18n: 'trafficWatch:stats.tcpOperations'"></span></h5>
                        <strong data-bind="text: stats.tcpOperationCount" class="stats-property"></strong>
                    </div>
                </div>
            </div>
            <div class="row margin-top">
                <div class="properties-container stats-container flex-horizontal padding padding-sm"
                     data-toggle="tooltip" data-bind="i18nAttr: { 'data-label': 'trafficWatch:stats.requestDuration', title: 'trafficWatch:stats.requestDurationTitle' }" data-placement="top">
                    <div class="property right-border">
                        <h5><i class="icon-average"></i><span data-bind="i18n: 'trafficWatch:stats.average'"></span></h5>
                        <strong data-bind="text: stats.requestDuration().avg" class="stats-property"></strong>
                    </div>
                    <div class="property">
                        <h5><i class="icon-arrow-filled-down"></i><span data-bind="i18n: 'trafficWatch:stats.minimum'"></span></h5>
                        <strong data-bind="text: stats.requestDuration().min" class="stats-property"></strong>
                    </div>
                    <div class="property">
                        <h5>90%</h5>
                        <strong data-bind="text: stats.requestDuration().percentile_90"></strong>
                    </div>
                    <div class="property">
                        <h5>99%</h5>
                        <strong data-bind="text: stats.requestDuration().percentile_99"></strong>
                    </div>
                    <div class="property">
                        <h5>99.9%</h5>
                        <strong data-bind="text: stats.requestDuration().percentile_99_9"></strong>
                    </div>
                    <div class="property">
                        <h5><i class="icon-arrow-filled-up"></i><span data-bind="i18n: 'trafficWatch:stats.maximum'"></span></h5>
                        <strong data-bind="text: stats.requestDuration().max" class="stats-property"></strong>
                    </div>
                </div>
            </div>

            <div class="row margin-top">
                <div class="properties-container stats-container flex-horizontal padding padding-sm"
                     data-toggle="tooltip" data-bind="i18nAttr: { 'data-label': 'trafficWatch:stats.responseSize', title: 'trafficWatch:stats.responseSizeTitle' }" data-placement="top">
                    <div class="property right-border">
                        <h5><i class="icon-average"></i><span data-bind="i18n: 'trafficWatch:stats.average'"></span></h5>
                        <strong data-bind="text: stats.responseSize().avg" class="stats-property"></strong>
                    </div>
                    <div class="property">
                        <h5><i class="icon-arrow-filled-down"></i><span data-bind="i18n: 'trafficWatch:stats.minimum'"></span></h5>
                        <strong data-bind="text: stats.responseSize().min" class="stats-property"></strong>
                    </div>
                    <div class="property">
                        <h5>90%</h5>
                        <strong data-bind="text: stats.responseSize().percentile_90"></strong>
                    </div>
                    <div class="property">
                        <h5>99%</h5>
                        <strong data-bind="text: stats.responseSize().percentile_99"></strong>
                    </div>
                    <div class="property">
                        <h5>99.9%</h5>
                        <strong data-bind="text: stats.responseSize().percentile_99_9"></strong>
                    </div>
                    <div class="property">
                        <h5><i class="icon-arrow-filled-up"></i><span data-bind="i18n: 'trafficWatch:stats.maximum'"></span></h5>
                        <strong data-bind="text: stats.responseSize().max"></strong>
                    </div>
                </div>
            </div>
            
            <div class="row" data-bind="visible: isDataFiltered">
                <div class="properties-container pull-right">
                    <small class="text-warning bg-warning padding padding-xs">
                        <i class="icon-warning"></i><span data-bind="i18n: 'trafficWatch:stats.filteredData'"></span>
                    </small>
                </div>
            </div>
        </div>
    </div>
</script>

<div class="tooltip json-preview lg js-traffic-watch-tooltip" style="opacity: 0">
</div>
