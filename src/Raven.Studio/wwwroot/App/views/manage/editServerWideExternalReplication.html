<div class="content-margin edit-server-wide-replication edit-ongoing-task">
    <form class="flex-form" data-bind="submit: saveServerWideExternalReplication" autocomplete="off">
        <div class="align-items-center justify-content-between d-flex gap-2 margin-bottom-md padding-top-xs">
            <div class="flex-horizontal gap-2">
                <i class="icon-server-wide-replication"></i>
                <h2 data-bind="i18n: { key: 'editServerWideExternalReplication:heading', options: { context: $root.isAddingNewExternalReplicationTask() ? 'new' : 'edit' } }" class="mb-0"></h2>
                <span class="badge license-restricted-badge professional" data-bind="if: !$root.hasServerWideExternalReplications">Professional +</span>
            </div>
            <div class="flex-end margin-right-xs" data-bind="react: $root.infoHubView"></div>
        </div>
        <div class="row flex-row">
            <div class="col-xs-12 col-lg-6 flex-vertical">
                <div class="flex-header">
                    <span data-placement="right" data-toggle="tooltip" data-html="true" data-animation="true"
                        data-bind="tooltipText: $root.hasServerWideExternalReplications ? null : $root.licenseRestrictedTooltip">
                        <button type="submit" class="btn btn-primary" data-bind="disable: spinners.save() || !dirtyFlag().isDirty(), css: { 'btn-spinner': spinners.save }">
                            <i class="icon-save"></i><span data-bind="i18n: 'common:save'"></span>
                        </button>
                    </span>
                    <button data-bind="click: cancelOperation, i18nAttr: { title: 'editServerWideExternalReplication:cancelTitle' }" class="btn btn-default">
                        <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                    </button>
                </div>
                <div class="panel" data-bind="css: { 'pe-none item-disabled': !$root.hasServerWideExternalReplications }">
                    <div class="panel-body" data-bind="with: editedTask">
                        <div class="form-group margin-top" data-bind="validationElement: taskName">
                            <label for="taskName" class="control-label" data-bind="i18n: 'editServerWideExternalReplication:taskName'"></label>
                            <div class="flex-grow">
                                <input type="text" class="form-control" data-bind="textInput: taskName, i18nAttr: { placeholder: 'editServerWideExternalReplication:taskNamePlaceholder' }" id="taskName">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label" data-bind="i18n: 'editServerWideExternalReplication:taskState'"></label>
                            <div class="flex-grow">
                                <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                                    <span data-bind="text: stateText()"></span>
                                    <span class="caret"></span>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Enabled')"><span data-bind="i18n: 'editServerWideExternalReplication:stateEnabled'"></span></a></li>
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Disabled')"><span data-bind="i18n: 'editServerWideExternalReplication:stateDisabled'"></span></a></li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group margin-top">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editServerWideExternalReplication:delayTimeTitle' }" data-animation="true">
                                <input id="setDelayTime" type="checkbox" data-bind="checked: showDelayTime">
                                <label for="setDelayTime" data-bind="i18n: 'editServerWideExternalReplication:setDelayTime'"></label>
                            </div>
                        </div>
                        <div data-bind="validationElement: delayTime, collapse: showDelayTime">
                            <div class="form-group">
                                <div>
                                    <label class="control-label" data-bind="i18n: 'editServerWideExternalReplication:delayTime'"></label>
                                </div>
                                <div class="flex-grow" data-bind="validationElement: delayTime">
                                    <input type="text" class="form-control" data-bind="durationPicker: delayTime, durationPickerOptions: { showDays: true, showSeconds: true }" />
                                    <div class="help-block" data-bind="validationMessage: delayTime"></div>
                                </div>
                            </div>
                        </div>
                        <div data-bind="collapse: humaneDelayDescription">
                            <div class="form-group margin-bottom">
                                <label class="control-label">&nbsp;</label>
                                <div class="bg-info padding padding-sm small flex-horizontal">
                                    <div><i class="icon-info"></i></div>
                                    <div data-bind="html: humaneDelayDescription"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editServerWideExternalReplication:responsibleNodeTitle' }" data-animation="true">
                                <input id="responsibleNode" type="checkbox" data-bind="checked: manualChooseMentor, disable: $root.possibleMentors().length === 0">
                                <label for="responsibleNode" data-bind="i18n: 'editServerWideExternalReplication:setResponsibleNode'"></label>
                            </div>
                        </div>
                        <div data-bind="compose: $root.taskResponsibleNodeSectionView"></div>
                        <div data-bind="with: excludeInfo" class="margin-bottom">
                            <div class="form-group">
                                <label class="control-label">&nbsp;</label>
                                <div class="toggle">
                                    <div data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editServerWideExternalReplication:excludeDatabases.title' }" data-animation="true">
                                        <input id="excludeDatabase" type="checkbox" data-bind="checked: exclude">
                                        <label for="excludeDatabase" data-bind="i18n: 'editServerWideExternalReplication:excludeDatabases.label'"></label>
                                    </div>
                                </div>
                            </div>
                            <div data-bind="collapse: exclude">
                                <div class="form-group">
                                    <label class="control-label">&nbsp;</label>
                                    <div class="flex-grow">
                                        <div class="flex-horizontal">
                                            <div class="flex-grow">
                                                <div class="dropdown btn-block" data-bind="validationElement: databasesToExclude">
                                                    <input class="form-control dropdown-toggle" data-toggle="dropdown" autocomplete="off"
                                                           data-bind="textInput: inputDatabaseToExclude, attr: { id: 'databaseNameInput' }, i18nAttr: { placeholder: 'editServerWideExternalReplication:excludeDatabases.placeholder' }" />
                                                    <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
                                                    <ul class="dropdown-menu" role="menu" style="display: none;"
                                                        data-bind="autoComplete: '#databaseNameInput', foreach: createDatabaseNameAutocompleter()">
                                                        <li role="presentation" data-bind="click: $parent.addWithBlink.bind($parent, $data)">
                                                            <a role="menuitem" tabindex="-1" href="#">
                                                                <span class="text" data-bind="text: $data"></span>
                                                            </a>
                                                        </li>
                                                    </ul>
                                                    <span class="help-block" data-bind="validationMessage: databasesToExclude"></span>
                                                </div>
                                            </div>
                                            <div>
                                                <button class="btn btn-info" data-bind="click: addDatabase, enable: inputDatabaseToExclude() && canAddDatabase()">
                                                    <i class="icon-plus"></i><span data-bind="i18n: 'editServerWideExternalReplication:excludeDatabases.add'"></span>
                                                </button>
                                            </div>
                                        </div>
                                        <div data-bind="visible: databasesToExclude() && databasesToExclude().length" class="margin-top">
                                            <label><strong data-bind="i18n: 'editServerWideExternalReplication:excludeDatabases.excludedHeading'"></strong></label>
                                            <ul class="well collection-list" data-bind="foreach: databasesToExclude">
                                                <li>
                                                    <div class="name" data-bind="text: $data"></div>
                                                    <a href="#" data-bind="click: $parent.removeDatabase.bind($parent, $data), i18nAttr: { title: 'editServerWideExternalReplication:excludeDatabases.removeTitle' }"><i class="icon-trash"></i></a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group margin-top">
                            <label for="connStrInfo" class="control-label" data-bind="i18n: 'editServerWideExternalReplication:connectionString.label'"></label>
                            <div id="connStrInfo" class="flex-grow">
                                <div class="text-info bg-info padding padding-xs small">
                                    <span data-bind="i18n: 'editServerWideExternalReplication:connectionString.createdPerDatabase'"></span><br>
                                    <span data-bind="i18n: 'editServerWideExternalReplication:connectionString.sourceNameAsDestination'"></span>
                                </div>
                            </div>
                        </div>
                        <div data-bind="with: connectionString">
                            <div class="form-group" data-bind="validationElement: inputUrl().discoveryUrlName">
                                <label class="control-label" data-bind="i18n: 'editServerWideExternalReplication:connectionString.discoveryUrls'"></label>
                                <div class="flex-grow">
                                    <input class="form-control" data-bind="textInput: inputUrl().discoveryUrlName, i18nAttr: { placeholder: 'editServerWideExternalReplication:connectionString.discoveryUrlPlaceholder' }" />
                                </div>
                                <button class="btn btn-info"
                                        data-bind="click: addDiscoveryUrlWithBlink, enable: inputUrl().discoveryUrlName() && inputUrl().validationGroup.isValid()">
                                    <i class="icon-plus"></i><span data-bind="i18n: 'editServerWideExternalReplication:connectionString.addUrl'"></span>
                                </button>
                            </div>
                            <div class="form-group" data-bind="visible: topologyDiscoveryUrls().length">
                                <label class="control-label">&nbsp;</label>
                                <div class="flex-grow">
                                    <ul class="well collection-list" data-bind="foreach: topologyDiscoveryUrls">
                                        <li>
                                            <div class="name" data-bind="text: $data.discoveryUrlName"></div>
                                            <div class="text-warning margin-top margin-top-xs" data-bind="if: hasTestError, i18nAttr: { title: 'editServerWideExternalReplication:testConnection.failed' }">
                                                <i class="icon-warning"></i>
                                            </div>
                                            <a href="#"
                                               data-bind="click: $parent.removeDiscoveryUrl.bind($parent, $data), i18nAttr: { title: 'editServerWideExternalReplication:connectionString.removeUrlTitle' }">
                                                <i class="icon-trash"></i>
                                            </a>
                                            <a class="btn btn-default" href="#"
                                               data-bind="click: _.partial($root.onTestConnection, $data), disable: $root.spinners.test, i18nAttr: { title: 'editServerWideExternalReplication:connectionString.testUrlTitle' },
                                                          css: { 'btn-spinner': $root.spinners.test() && $root.connectionStringForTest().selectedUrlToTest() === $data.discoveryUrlName() }">
                                                <i class="icon-rocket"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="form-group" data-bind="if: !topologyDiscoveryUrls.isValid()">
                                <label class="control-label">&nbsp;</label>
                                <span data-bind="validationElement: topologyDiscoveryUrls">
                                    <span class="help-block" data-bind="validationMessage: topologyDiscoveryUrls"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="panel-addon" data-bind="visible: usingHttps">
                        <div data-bind="compose: $root.certificateUploadInfoForOngoingTasks"></div>
                    </div>
                    <div class="panel-addon" data-bind="with: testConnectionResult">
                        <div class="padding bg-success small" data-bind="visible: Success">
                            <div data-bind="i18n: 'editServerWideExternalReplication:testConnection.success'"></div>
                        </div>
                        <div data-bind="if: !Success">
                            <div class="padding bg-danger small">
                                <h2 data-bind="i18n: 'editServerWideExternalReplication:testConnection.failed'"></h2>
                                <span data-bind="text: $root.fullErrorDetailsVisible() ? Error : $root.shortErrorText()"></span>
                                <div>
                                    <a href="#" data-bind="click: $root.fullErrorDetailsVisible.toggle.bind($root.fullErrorDetailsVisible), i18n: { key: 'editServerWideExternalReplication:testConnection.details', options: { context: $root.fullErrorDetailsVisible() ? 'hide' : 'show' } }"></a>
                                </div>
                            </div>
                            <div class="padding bg-info small">
                                <h2 data-bind="i18n: 'editServerWideExternalReplication:testConnection.aboutError'"></h2>
                                <div data-bind="i18n: 'editServerWideExternalReplication:testConnection.endpoints'"></div>
                                <div data-bind="i18n: 'editServerWideExternalReplication:testConnection.tcpAfterHttp'"></div>
                                <div data-bind="visible: HTTPSuccess, i18n: 'editServerWideExternalReplication:testConnection.httpSucceeded'"></div>
                                <div data-bind="visible: !HTTPSuccess, i18n: 'editServerWideExternalReplication:testConnection.httpFailed'"></div>
                                <div>
                                    <span data-bind="i18n: 'editServerWideExternalReplication:testConnection.pleaseVerify'"></span>
                                    <ul>
                                        <li data-bind="i18n: 'editServerWideExternalReplication:testConnection.urlCorrect'"></li>
                                        <li data-bind="i18n: 'editServerWideExternalReplication:testConnection.machinesRunning'"></li>
                                        <li data-bind="i18n: 'editServerWideExternalReplication:testConnection.noFirewall'"></li>
                                        <li data-bind="i18n: 'editServerWideExternalReplication:testConnection.noNetworkConfig'"></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
