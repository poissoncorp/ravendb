<div class="corner-popup">
    <img src="../../Content/img/analytics-img.png" />
    <div class="text-center padding">
        <h3 class="text-success"><strong data-bind="i18n: 'usageStats:title'"></strong></h3>
        <p class="small" data-bind="i18n: 'usageStats:question'"></p>
        <a data-bind="click: collectUsageData, i18n: 'usageStats:allow'" class="btn btn-success"></a><br />
        <a data-bind="click: doNotCollectUsageData, i18n: 'usageStats:deny'" class="btn btn-xs text-muted"></a>
    </div>
</div>
