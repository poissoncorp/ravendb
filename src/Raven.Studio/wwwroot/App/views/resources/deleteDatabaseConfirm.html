<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" data-bind="i18n: { key: 'deleteDatabaseConfirm:title', options: { count: databasesToDelete.length } }"></h5>
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
        </div>
        <div class="padding">
            <div style="max-height: 290px; overflow-y: auto;">
                <ul class="databases-list" data-bind="foreach: databasesToDelete">
                    <li class="force-text-wrap"><i class="icon-database text-primary"></i>
                        <small data-bind="visible: isEncrypted, i18nAttr: { title: 'deleteDatabaseConfirm:encrypted' }"><i class="icon-encryption text-success"></i></small>
                        <small data-bind="visible: !isEncrypted, i18nAttr: { title: 'deleteDatabaseConfirm:notEncrypted' }"><i class="icon-unlock text-muted"></i></small>
                        <strong data-bind="text: name"></strong>
                    </li>
                </ul>
            </div>
            <span data-bind="i18n: 'deleteDatabaseConfirm:selectOption'"></span><br>
            <span data-bind="visible: databasesToDelete.length > 1, i18n: 'deleteDatabaseConfirm:appliesToAll'"></span>
        </div>
        <div class="padding margin margin-sm mt-0 border-radius-xs alert alert-warning">
            <h3 data-bind="i18n: 'deleteDatabaseConfirm:keepFiles.title'"></h3>
            <p class="small">
                <span data-bind="i18n: 'deleteDatabaseConfirm:deletedFromAllNodes'"></span><br />
                <span data-bind="i18n: 'deleteDatabaseConfirm:keepFiles.filesUntouched'"></span>
            </p>
            <div class="flex-horizontal margin-top-sm">
                <div class="flex-start text-warning">
                    <i class="icon-warning"></i>
                </div>
                <div data-bind="html: dataNotRecoveredHtml"></div>
            </div>
            <div class="flex-horizontal" data-bind="if: encryptedCount > 0">
                <div class="flex-start text-warning">
                    <i class="icon-warning"></i>
                </div>
                <div data-bind="html: secretKeyDeletedHtml"></div>
            </div>
            <div class="text-right margin-top-sm">
                <button type="button" class="btn btn-info"
                        data-bind="visible: databasesToDelete.length === 1, click: exportDatabase, i18nAttr: { title: 'deleteDatabaseConfirm:keepFiles.exportButtonTitle' }">
                    <i class="icon-export-database"></i><span data-bind="i18n: 'deleteDatabaseConfirm:keepFiles.exportButton'"></span>
                </button>
                <button type="button" class="btn btn-warning margin-left-xs"
                        data-bind="click: keepFiles, i18nAttr: { title: 'deleteDatabaseConfirm:keepFiles.keepFilesButtonTitle' }">
                    <i class="icon-trash"></i><span data-bind="i18n: 'deleteDatabaseConfirm:keepFiles.keepFilesButton'"></span>
                </button>
            </div>
        </div>
        <div class="padding margin margin-sm mb-0 border-radius-xs alert alert-danger">
            <h3 data-bind="i18n: 'deleteDatabaseConfirm:deleteAll.title'"></h3>
            <p class="small">
                <span data-bind="i18n: 'deleteDatabaseConfirm:deletedFromAllNodes'"></span><br/>
                <span data-bind="i18n: 'deleteDatabaseConfirm:deleteAll.filesDeleted'"></span>
            </p>
            <div class="flex-horizontal margin-top-sm">
                <div class="flex-start text-danger">
                    <i class="icon-danger"></i>
                </div>
                <div data-bind="i18n: 'deleteDatabaseConfirm:deleteAll.cannotBeUndone'"></div>
            </div>
            <div class="text-right margin-top-sm">
                <button type="button" class="btn btn-danger margin-left-xs" data-bind="click: deleteEverything, i18nAttr: { title: 'deleteDatabaseConfirm:deleteAll.buttonTitle' }">
                    <i class="icon-force"></i><span data-bind="i18n: 'deleteDatabaseConfirm:deleteAll.button'"></span>
                </button>
            </div>
        </div>
        <div class="padding">
            <span data-bind="visible: databasesToDelete.length === 1">
                <span data-bind="i18n: 'deleteDatabaseConfirm:manageGroup.singleNodeHint'"></span><br />
                <a href="#" data-bind="click: goToManageDbGroup, i18n: 'deleteDatabaseConfirm:manageGroup.link', i18nAttr: { title: 'deleteDatabaseConfirm:manageGroup.linkTitle' }"></a>
            </span>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18nAttr: { title: 'deleteDatabaseConfirm:cancelTitle' }">
                <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
            </button>
        </div>
    </div>
</div>
