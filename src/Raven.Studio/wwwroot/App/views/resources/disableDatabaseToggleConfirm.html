<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" data-bind="i18n: 'databases:toggleDatabaseConfirm.title'"></h5>
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
        </div>
        <div class="modal-body">
            <div data-bind="visible: databases.length === 1">
                <span data-bind="text: deletionText"></span>
                <ul class="databases-list margin-top-xs">
                    <li class="force-text-wrap" data-bind="with: databases[0]"><i class="icon-database text-primary"></i>
                        <small data-bind="visible: isEncrypted, i18nAttr: { title: 'databases:encryptedTitle' }"><i class="icon-encryption text-success"></i></small>
                        <small data-bind="visible: !isEncrypted, i18nAttr: { title: 'databases:notEncryptedTitle' }"><i class="icon-unlock text-muted"></i></small>
                        <strong data-bind="text: name"></strong>
                    </li>
                </ul>
            </div>
            <div data-bind="visible: databases.length > 1">
                <span data-bind="html: multipleDatabasesHtml"></span>
                <br />
                <div style="max-height: 290px; overflow-y: auto;">
                    <ul class="databases-list margin-top-xs" data-bind="foreach: databases">
                        <li class="force-text-wrap"><i class="icon-database text-primary"></i>
                            <small data-bind="visible: isEncrypted, i18nAttr: { title: 'databases:encryptedTitle' }"><i class="icon-encryption text-success"></i></small>
                            <small data-bind="visible: !isEncrypted, i18nAttr: { title: 'databases:notEncryptedTitle' }"><i class="icon-unlock text-muted"></i></small>
                            <strong data-bind="text: name"></strong>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
            <button type="button" class="btn btn-primary" data-bind="click: confirm, text: confirmDeletionText"></button>
        </div>
    </div>
</div>
