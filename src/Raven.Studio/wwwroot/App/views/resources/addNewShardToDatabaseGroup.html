<div class="modal-dialog add-new-node-to-db-group" role="document">
    <div class="modal-content neo-modal" tabindex="-1">
        <div class="modal-header">
            <div class="d-flex align-items-center">
                <img src="../../../Content/img/sharding/shard.svg" data-bind="i18nAttr: { alt: 'manageDatabaseGroup:addShardDialog.imageAlt' }" class="img-responsive margin-center" style="width:24px;"/>
                <h3 class="flex-grow margin-none margin-left-xxs" data-bind="i18n: 'manageDatabaseGroup:addShardDialog.title'"></h3>
            </div>
        </div>
        <div class="modal-body">
            <h4><span data-bind="i18n: 'manageDatabaseGroup:addShardDialog.replicationConfiguration'"></span> <i class="icon-info" data-bind="i18nAttr: { title: 'manageDatabaseGroup:addShardDialog.replicationFactorTooltip' }"></i></h4>
            <!-- TODO: Add context -->
            <div class="form-group">
                <div class="input-group" data-bind="validationElement: replicationFactor, i18nAttr: { title: 'manageDatabaseGroup:addShardDialog.replicationFactorTooltip' }">
                    <span class="input-group-addon" data-bind="i18n: 'manageDatabaseGroup:addShardDialog.replicationFactor'"></span>
                    <input class="form-control" type="number" min="1"
                           data-bind="numericInput: replicationFactor, disable: manualMode, i18nAttr: { title: 'manageDatabaseGroup:addShardDialog.replicationFactorTooltip', placeholder: 'manageDatabaseGroup:addShardDialog.replicationFactorPlaceholder' }">
                </div>
            </div>

            <div>
                <div>
                    <div class="toggle">
                        <input class="styled" type="checkbox" id="manual_mode" data-bind="checked: manualMode">
                        <label for="manual_mode" data-bind="i18n: 'manageDatabaseGroup:addShardDialog.manualMode'"></label>
                    </div>
                    <small class="toggle-caption" data-bind="i18n: 'manageDatabaseGroup:addShardDialog.manualModeDescription'"></small>
                </div>
                <div>
                    <div class="bg-info padding no-margin" data-bind="visible: manualMode()">
                        <h3 data-bind="i18n: 'manageDatabaseGroup:addShardDialog.availableNodes'"></h3>
                        <div class="checkbox checkbox-info margin-bottom-xxs">
                            <input type="checkbox" id="toggle_all_in_cluster" class="styled" data-bind="checkboxTriple: selectionState, event: { change: toggleSelectAll }">
                            <label for="toggle_all_in_cluster"><i class="icon-cluster"></i><span data-bind="i18n: 'manageDatabaseGroup:addShardDialog.allClusterNodes'"></span></label>
                        </div>
                        <div data-bind="foreach: clusterNodes">
                            <div class="checkbox checkbox-success padding-left-md" data-bind="validationOptions: { errorsAsTitle: false, insertMessages: false }">
                                <input class="styled" type="checkbox" data-bind="attr: { id: 'cluster_node_' + $index() }, checked: $parent.nodes, checkedValue: $data">
                                <label class="text-success" data-bind="attr: { for: 'cluster_node_' + $index() }">
                                    <i class="icon-cluster-node"></i><span data-bind="text: tag()"></span> &nbsp; <small data-bind="text: serverUrl()"></small>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div data-bind="validationElement: nodes">
                        <div class="help-block" data-bind="validationMessage: nodes"></div>
                    </div>
                </div>
                
            </div>
        </div>
        <div class="modal-footer">
            <div class="text-right">
                <button type="button" class="btn btn-default" data-bind="click: close"><i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span></button>
                <button data-bind="click: addShard, disable: spinners.addShard, css: { 'btn-spinner': spinners.addShard }" type="button" class="btn btn-primary">
                    <i class="icon-plus"></i><span data-bind="i18n: 'manageDatabaseGroup:addShardDialog.addButton'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
