<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" data-bind="i18n: 'databases:toggleIndexingConfirm.title'"></h5>
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
        </div>
        <div class="modal-body">
            <div data-bind="text: text"></div>
            <div class="margin-top flex-horizontal alert alert-warning border-radius-xs">
                <div class="flex-start"><i class="icon-warning"></i></div>
                <div class="margin-left-xs" data-bind="html: reloadWarningHtml"></div>
            </div>
            <div class="margin-top-sm mb-0 alert alert-info border-radius-xs">
                <h4 data-bind="i18n: 'databases:toggleIndexingConfirm.reloadWaysHeading'"></h4>
                    <ul>
                        <li>
                            <small data-bind="html: reloadByTogglingHtml"></small>
                        </li>
                        <li class="margin-top-xs">
                            <small data-bind="html: reloadByRestartingHtml"></small>
                        </li>
                    </ul>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
            <button type="button" class="btn btn-primary" data-bind="click: confirm, text: confirmText"></button>
        </div>
    </div>
</div>
