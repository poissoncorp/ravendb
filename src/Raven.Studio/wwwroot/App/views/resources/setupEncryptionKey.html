<div class="margin-bottom" data-bind="validationElement: key">
    <label class="control-label" data-bind="html: keyLabelHtml"></label>
    <div class="input-group">
        <input type="text" class="form-control" autocomplete="off"
               data-bind="textInput: key, enable: canProvideOwnKey, i18nAttr: { placeholder: 'setupEncryptionKey:keyPlaceholder' }">
        <span class="input-group-btn" data-bind="visible: canProvideOwnKey, i18nAttr: { title: 'setupEncryptionKey:generateKeyTitle' }">
            <button class="btn" type="button" data-bind="click: generateEncryptionKey">
                <i class="icon-reset"></i>
            </button>
        </span>
    </div>
</div>
<p data-bind="i18n: 'setupEncryptionKey:qrCode'"></p>
<div class="text-center">
    <div id="encryption_qrcode">
    </div>
</div>
<div class="text-center" id="savingKeyData">
    <span class="has-disable-reason" data-bind="i18nAttr: { 'data-original-title': disableSavingKeyData() ? 'setupEncryptionKey:validateFirst' : null }">
        <button type="button" class="btn btn-sm btn-primary" data-bind="click: downloadEncryptionKey, disable: disableSavingKeyData">
            <i class="icon-export"></i> <span data-bind="i18n: 'setupEncryptionKey:download'"></span>
        </button>
    </span>
    <span  class="has-disable-reason" data-bind="i18nAttr: { 'data-original-title': disableSavingKeyData() ? 'setupEncryptionKey:validateFirst' : null }">
        <button type="button" class="btn btn-sm btn-info" data-bind="click: copyEncryptionKeyToClipboard, disable: disableSavingKeyData">
            <i class="icon-copy"></i> <span data-bind="i18n: 'setupEncryptionKey:copyToClipboard'"></span>
        </button>
    </span>
    <span class="has-disable-reason" data-bind="i18nAttr: { 'data-original-title': disableSavingKeyData() ? 'setupEncryptionKey:validateFirst' : null }">
        <button type="button" class="btn btn-sm" data-bind="click: printEncryptionKey, disable: disableSavingKeyData">
            <i class="icon-print"></i><span data-bind="i18n: 'setupEncryptionKey:print'"></span>
        </button>
    </span>
</div>
<div class="row margin-bottom margin-bottom-sm">
    <div class="col-sm-12">
        <div class="checkbox" data-bind="validationOptions: { insertMessages: false }">
            <input class="styled" type="checkbox" id="saved_key_confirm" data-bind="checked: keyConfirmation">
            <label for="saved_key_confirm" data-bind="i18n: 'setupEncryptionKey:savedConfirmation'"></label>
        </div>
        <div data-bind="validationElement: keyConfirmation">
            <div class="help-block" data-bind="validationMessage: keyConfirmation"></div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="bg-info padding padding-sm small flex-horizontal">
            <div>
                <i class="icon-warning"></i>
            </div>
            <div>
                <span>
                    <span data-bind="i18n: { key: 'setupEncryptionKey:warning.saveSafely', options: { context: isKeyAvailableAgain() ? 'availableAgain' : 'notAvailableAgain' } }"></span><br/>
                    <span data-bind="i18n: 'setupEncryptionKey:warning.loseAccess'"></span>
                </span>
            </div>
        </div>
    </div>
</div>
