<div class="modal-dialog add-new-node-to-db-group" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <div class="flex-horizontal">
                <div class="flex-grow">
                    <h3 data-bind="i18n: 'addNewNodeToShard:title'"></h3>
                </div>
                <div>
                    <button type="button" class="close" data-bind="click: $root.close" aria-hidden="true">
                        <i class="icon-cancel"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="modal-body">
            <div class="flex-form">
                <div class="form-group" data-bind="validationElement: nodeTag">
                    <div>
                        <label class="control-label" data-bind="i18n: 'addNewNodeToShard:nodeTag'"></label>
                    </div>
                    <div class="flex-grow">
                        <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                            <span data-bind="i18n: nodeTag() ? { key: 'addNewNodeToShard:node', options: { nodeTag: nodeTag() } } : 'addNewNodeToShard:selectClusterNode'"></span>
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu" data-bind="foreach: nodesCanBeAdded">
                            <li><a href="#" data-bind="i18n: { key: 'addNewNodeToShard:node', options: { nodeTag: $data } }, click: $root.selectedClusterNode"></a></li>
                        </ul>
                        <span class="help-block" data-bind="validationMessage: nodeTag"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label">&nbsp;</label>
                    <div class="toggle">
                        <div data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'addNewNodeToShard:mentorTooltip' }" data-animation="true">
                            <input id="manualMentorNode" type="checkbox" data-bind="checked: manualChooseMentor">
                            <label for="manualMentorNode" data-bind="i18n: 'addNewNodeToShard:setPreferredMentor'"></label>
                        </div>
                    </div>
                </div>
                <div data-bind="validationElement: mentorNode, collapse: manualChooseMentor">
                    <div class="form-group">
                        <div>
                            <label class="control-label" data-bind="i18n: 'addNewNodeToShard:preferredMentor'"></label>
                        </div>
                        <div class="flex-grow">
                            <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                                <span data-bind="i18n: mentorNode() ? { key: 'addNewNodeToShard:node', options: { nodeTag: mentorNode() } } : 'addNewNodeToShard:selectPreferredMentor'"></span>
                                <span class="caret"></span>
                            </button>
                            <ul class="dropdown-menu" data-bind="foreach: $root.possibleMentors">
                                <li><a href="#" data-bind="i18n: { key: 'addNewNodeToShard:node', options: { nodeTag: $data } }, click: $parent.mentorNode.bind($parent.mentorNode, $data)"></a></li>
                            </ul>
                            <span class="help-block" data-bind="validationMessage: mentorNode"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div data-bind="with: encryptionSection">
                <h3 data-bind="i18n: 'addNewNodeToShard:encryptionConfiguration'"></h3>
                <div data-bind="compose: $root.setupEncryptionKeyView"></div>
            </div>
        </div>
        <div class="modal-footer">
            <div class="text-right">
                <button type="button" class=" btn btn-default" data-bind="click: close"><i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span></button>
                <button data-bind="click: addNode, disable: spinners.addNode, css: { 'btn-spinner': spinners.addNode }" type="button" class="btn btn-primary">
                    <i class="icon-plus"></i><span data-bind="i18n: 'addNewNodeToShard:addNode'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
