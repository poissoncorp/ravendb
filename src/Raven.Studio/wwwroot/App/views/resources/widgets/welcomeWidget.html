<div>
    <div class="cluster-dashboard-item-header">
        <h3> <i class="icon-coffee"></i> <span data-bind="i18n: 'clusterDashboard:welcome.title'"></span></h3>
        <button class="btn btn-warning btn-sm" data-bind="click: remove, visible: bootstrapped, i18nAttr: { title: 'clusterDashboard:widget.remove' }">
            <i class="icon-trash"></i>
        </button>
        <button class="btn btn-default btn-sm" data-bind="click: toggleFullscreen">
            <i data-bind="css: { 'icon-fullscreen': !fullscreen(), 'icon-exit-fullscreen': fullscreen },
                          i18nAttr: { title: fullscreen() ? 'clusterDashboard:widget.minimize' : 'clusterDashboard:widget.maximize' }"></i>
        </button>
    </div>
    <div class="property-container padding padding-lg">
        <p class="lead text-center">
            <span data-bind="i18n: 'clusterDashboard:welcome.intro.welcome'"></span><br/><span data-bind="i18n: 'clusterDashboard:welcome.intro.overview'"></span> <br /><span data-bind="i18n: 'clusterDashboard:welcome.intro.getStarted'"></span>

        </p>
        <div class="row">
            <div class="col-sm-6 margin-top">
                <div class="text-center">
                    <img src="../../../../Content/img/new-database.svg" width="150px" data-bind="i18nAttr: { alt: 'clusterDashboard:welcome.createDatabaseAlt' }" /><br/>
                    <div><span data-bind="i18n: 'clusterDashboard:welcome.create'"></span> <a href="#" data-bind="click: () => isCreateDatabaseViewOpen(true), i18n: 'clusterDashboard:welcome.newDatabase'"></a></div>
                    <div data-bind="if: isCreateDatabaseViewOpen()">
                        <div data-bind="react: $root.createDatabaseView"></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 margin-top">
                <div class="text-center">
                    <img src="../../../../Content/img/setup-cluster.svg" width="150px" data-bind="i18nAttr: { alt: 'clusterDashboard:welcome.setupClusterAlt' }" /><br/>
                    <a data-bind="attr: { href: clusterViewUrl }, i18n: 'clusterDashboard:welcome.setupCluster'"></a>
                </div>
            </div>
            <div class="row">
            </div>
            <div class="col-sm-6 margin-top">
                <div class="text-center">
                    <img src="../../../../Content/img/connect.svg" width="150px" data-bind="i18nAttr: { alt: 'clusterDashboard:welcome.connectAlt' }" />
                    <div><span data-bind="i18n: 'clusterDashboard:welcome.learnHowTo'"></span> <a data-bind="attr: { href: connectingToDatabaseUrl }" target="_blank"><span data-bind="i18n: 'clusterDashboard:welcome.connectClient'"></span> <i class="icon-newtab"></i></a></div>
                </div>
            </div>
            <div class="col-sm-6 margin-top">
                <div class="text-center">
                    <img src="../../../../Content/img/search-index.svg" width="150px" data-bind="i18nAttr: { alt: 'clusterDashboard:welcome.searchIndexAlt' }" />
                    <div>
                        <span data-bind="i18n: 'clusterDashboard:welcome.learnMoreAbout'"></span> <a data-bind="attr: { href: queryingUrl }" target="_blank"><span data-bind="i18n: 'clusterDashboard:welcome.querying'"></span> <i class="icon-newtab"></i></a> 
                        <span data-bind="i18n: 'clusterDashboard:welcome.and'"></span> 
                        <a data-bind="attr: { href: indexesUrl }" target="_blank"><span data-bind="i18n: 'clusterDashboard:welcome.indexes'"></span> <i class="icon-newtab"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center margin-top" data-bind="visible: bootstrapped">
            <button class="btn btn-default btn-sm" data-bind="click: remove">
                <i class="icon-cancel"></i>
                <span data-bind="i18n: 'clusterDashboard:welcome.hide'"></span>
            </button>
        </div>
    </div>
</div>
