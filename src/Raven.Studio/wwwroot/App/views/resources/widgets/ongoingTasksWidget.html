<div>
    <div class="cluster-dashboard-item-header">
        <h3><i class="icon-tasks"></i><span data-bind="i18n: 'clusterDashboard:ongoingTasks.title'"></span></h3>
        <button class="btn btn-warning btn-sm" data-bind="click: remove, i18nAttr: { title: 'clusterDashboard:widget.remove' }">
            <i class="icon-trash"></i>
        </button>
        <button class="btn btn-default btn-sm" data-bind="click: toggleFullscreen">
            <i data-bind="css: { 'icon-fullscreen': !fullscreen(), 'icon-exit-fullscreen': fullscreen },
                          i18nAttr: { title: fullscreen() ? 'clusterDashboard:widget.minimize' : 'clusterDashboard:widget.maximize' }"></i>
        </button>
    </div>
    <div class="databases-list" style="position: relative;">
        <div class="list-container">
            <div class="tasks-list">
                <virtual-grid class="resizable no-margin"
                              params="controller: gridController, condensed: true"></virtual-grid>
                <div class="absolute-center loading" data-bind="visible: $root.spinners.loading">
                    <div class="global-spinner"></div>
                </div>
                </div>
            </div>
        </div>
    </div>
