<div style="z-index: 1;">
    <div class="cluster-dashboard-item-header">
        <h3><i class="icon-database"></i><span data-bind="i18n: 'clusterDashboard:databaseNotifications.title'"></span></h3>
        <button class="btn btn-warning btn-sm" data-bind="click: remove, i18nAttr: { title: 'clusterDashboard:widget.remove' }">
            <i class="icon-trash"></i>
        </button>
        <button class="btn btn-default btn-sm" data-bind="click: toggleFullscreen">
            <i
                data-bind="css: { 'icon-fullscreen': !fullscreen(), 'icon-exit-fullscreen': fullscreen },
                          i18nAttr: { title: fullscreen() ? 'clusterDashboard:widget.minimize' : 'clusterDashboard:widget.maximize' }"
            ></i>
        </button>
    </div>
    <div data-bind="react: widgetBodyComponent" class="bs5"></div>
</div>
