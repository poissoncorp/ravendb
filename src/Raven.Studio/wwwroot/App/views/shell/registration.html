<div class="modal-dialog prevent-close registration-modal" role="document" id="licenseModal">
    <form class="form-horizontal" autocomplete="off" data-bind="submit: submit">
        <div class="modal-content neo-modal">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel">
                    <span data-bind="visible: licenseType() === 'None', i18n: 'registration:title.register'"></span>
                    <span data-bind="visible: !licenseExpired() && licenseType() !== 'None' && !renewWhenNotExpired(), i18n: 'registration:title.replace'"></span>
                    <span data-bind="visible: licenseExpired() && licenseType() !== 'None', i18n: 'registration:title.expired'"></span>
                    <span data-bind="visible: renewWhenNotExpired, i18n: 'registration:title.renew'"></span>
                    <button type="button" data-bind="visible: dismissVisible() || canBeClosed(), i18nAttr: { 'aria-label': 'registration:close' }" class="close rounded-pill" data-dismiss="modal"><span aria-hidden="true">&times;</span></button>
                </h4>
            </div>
            <div class="modal-body pt-0 d-flex align-items-center flex-vertical">
                <div class="d-flex flex-horizontal gap-3">
                    <img src="../../../Content/img/license.svg" class="img-responsive licenseModalImg" width="140"/>
                    <div data-bind="visible: licenseType() !== 'None'" class="d-flex flex-vertical">
                        <h2 data-bind="i18n: 'registration:currentLicenseId'"></h2><strong data-bind="text: licenseId()"></strong>
                    </div>
                </div>
                <div class="d-flex flex-vertical text-center lead">
                    <span data-bind="if: dismissVisible">
                        <span data-bind="html: daysToRegisterHtml"></span>
                    </span>
                    <span data-bind="if: error">
                        <strong class="text-warning" data-bind="html: error"></strong>
                    </span>
                    <span data-bind="visible: licenseExpired, i18n: 'registration:selectOption'"></span>
                </div>
            </div>
            <div class="modal-footer">
                <div class="text-left padding padding-sm" id="renewLicense" data-bind="visible: renewWhenExpired() || renewWhenNotExpired()">
                    <h3 data-bind="i18n: 'registration:renew.title'"></h3>
                    <small data-bind="visible: !renewMessage(), html: renewDescriptionHtml"></small>
                    <small class="text-info" data-bind="visible: renewMessage, html: renewMessage"></small>
                    <span data-bind="visible: renewError"><br><small class="text-danger" data-bind="text: renewError"></small></span>
                    <div class="margin-bottom">
                        <button type="button" class="btn btn-info pull-right rounded-pill"
                                data-bind="click: renewLicense, disable: spinners.renewLicense() || spinners.activateLicense() || renewMessage(),
                                           css: { 'btn-spinner': spinners.renewLicense },
                                           i18nAttr: { title: { key: 'registration:renew.buttonTitle', options: { context: renewMessage() ? 'sent' : 'notSent' } } }">
                            <i class="icon-reset"></i>
                            <span data-bind="i18n: 'registration:renew.button'"></span>
                        </button>
                    </div>
                </div>
                <div class="text-left padding padding-sm" id="forceUpdate" data-bind="visible: forceUpdateWhenExpired">
                    <div><strong data-bind="i18n: 'registration:forceUpdate.title'"></strong></div>
                    <small data-bind="i18n: 'registration:forceUpdate.description'"></small>
                    <div class="margin-bottom">
                        <button type="button" class="btn btn-info pull-right rounded-pill"
                                data-bind="click: forceLicenseUpdate, disable: spinners.forceLicenseUpdate() || spinners.activateLicense(),
                                           css: { 'btn-spinner': spinners.forceLicenseUpdate },
                                           i18nAttr: { title: 'registration:forceUpdate.buttonTitle' }">
                            <i class="icon-force"></i>
                            <span data-bind="i18n: 'registration:forceUpdate.button'"></span>
                        </button>
                    </div>
                </div>
                <hr data-bind="visible: licenseExpired() || renewWhenNotExpired()"/>
                <div class="padding padding-sm text-left" id="enterLicenseKey">
                    <h3 data-bind="i18n: 'registration:submitLicense.title'"></h3>
                    <small class="text-info" data-bind="visible: renewMessage, i18n: 'registration:submitLicense.pasteRenewedKey'"></small>
                    <small data-bind="visible: !renewMessage() && !renewWhenNotExpired(), html: obtainNewLicenseHtml"></small>
                    <small data-bind="visible: !renewMessage() && renewWhenNotExpired(), i18n: 'registration:submitLicense.pasteKeyAfterRenew'"></small>
                    <div class="form-horizontal margin-top">
                        <div class="form-group" data-bind="validationElement: licenseKeyModel().key">
                            <div class="col-sm-12">
                                <textarea rows="9" class="form-control border-radius-xs resize-none" id="inputLicenseKey" data-bind="textInput: licenseKeyModel().key, attr: { placeholder: licenseKeyPlaceholder }"></textarea>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="content text-left">
                            <small data-bind="i18n: 'registration:connectionToLicenseServer'"></small>
                            <span class="connected" data-bind="visible: connectedToLicenseServer"><i class="icon-check connection-status"></i></span>
                            <span class="not-connected" data-bind="visible: !connectedToLicenseServer()"><i class="icon-cancel connection-status"></i></span>

                            <i class="check-connection icon-refresh"
                               data-bind="click: checkConnectionToLicenseServer, css: { 'btn-spinner margin-left margin-left-sm': spinners.checkConnectionToLicenseServer() }, i18nAttr: { title: 'registration:checkConnectionTitle' }">
                            </i>
                        </div>
                    </div>

                    <div class="clearfix">
                    <button type="submit"
                            data-bind="disable: spinners.activateLicense() || spinners.forceLicenseUpdate(), css: { 'btn-spinner': spinners.activateLicense }, i18nAttr: { title: 'registration:submitTitle' }"
                            class="btn btn-primary pull-right rounded-pill">
                        <i class="icon-check"></i>
                        <span data-bind="i18n: 'registration:submit'"></span>
                    </button>
                    <div data-bind="visible: dismissVisible()">
                        <button class="btn btn-default pull-left rounded-pill" data-bind="click: $root.dismiss.bind($root, 1)">
                            <i class="icon-recent"></i>
                            <span data-bind="i18n: 'registration:dismissForOneDay'"></span>
                        </button>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
