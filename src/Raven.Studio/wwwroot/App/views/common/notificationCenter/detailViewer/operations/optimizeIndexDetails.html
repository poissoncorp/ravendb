<div class="modal-dialog modal-lg optimizeIndexDetails" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <div class="flex-horizontal">
                <div class="flex-grow">
                    <h3 id="myModalLabel" data-bind="text: op.title, attr:{ class: 'modal-title ' + op.headerClass() }"></h3>
                </div>
                <div class="flex-grow text-right margin-right margin-right-sm">
                    <span class="text-muted" data-bind="i18n: 'optimizeIndexDetails:timeElapsed'"></span> <span data-bind="text: op.duration"></span>
                </div>
                <div>
                    <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                        <i class="icon-cancel"></i>
                    </button>
                </div>
            </div>
            <div class="notification-time" data-bind="text: op.displayDate().format('LLL')"></div>
        </div>
        <div class="modal-body word-break">
            <p data-bind="html: op.message"></p>
            <div data-bind="if: operationFailed">
                <h3 class="text-danger text-center" data-bind="i18n: 'optimizeIndexDetails:operationFailed'"></h3>
                <div class="d-flex margin-top">
                    <div class="flex-grow"></div>
                    <button type="button" class="btn btn-default btn-sm" data-bind="click: copyErrorDetails"><i class="icon-copy-to-clipboard"></i><span data-bind="i18n: 'optimizeIndexDetails:copyErrorMessage'"></span></button>
                </div>
                <pre class="error-messages"><code data-bind="foreach: errorMessages"><span data-bind="text: $data"></span>
</code></pre>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: close, i18nAttr: { title: 'optimizeIndexDetails:closeTitle' }">
                <i class="icon-cancel"></i><span data-bind="i18n: 'optimizeIndexDetails:close'"></span>
            </button>
        </div>
    </div>
</div>
