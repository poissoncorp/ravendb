<button type="button" class="btn btn-default" data-bind="click: close, i18nAttr: { title: 'abstractOperationDetails:closeTitle' }">
    <i class="icon-cancel"></i><span data-bind="i18n: 'abstractOperationDetails:close'"></span>
</button>
<button type="button" class="btn btn-danger"
        data-bind="i18nAttr: { title: 'abstractOperationDetails:abortTitle' }, click: killOperation, visible: killable, css: { 'btn-spinner': spinners.kill }, disable: spinners.kill">
    <i class="icon-stop"></i><span data-bind="i18n: 'abstractOperationDetails:abort'"></span>
</button>
