<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="i18n: 'deleteDocuments:title'"></h4>
        </div>
        <div class="modal-body">
            <p data-bind="visible: documentIds().length === 1, html: deletingDocumentHtml"></p>
            <div data-bind="visible: documentIds().length > 1">
                <span data-bind="html: deletingDocumentsHtml"></span>
                <br />
                <ul data-bind="foreach: documentIds" style="max-height: 100px; overflow-y: auto;">
                    <li data-bind="text: $data"></li>
                </ul>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
            <button type="button" class="btn btn-primary" data-bind="click: deleteDocs, i18n: 'common:delete'"></button>
        </div>
    </div>
</div>
