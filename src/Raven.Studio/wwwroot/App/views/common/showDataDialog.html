<div class="modal-dialog modal-lg" role="document" id="showDataDialog">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="text: title"></h4>
        </div>
        <div class="modal-body">
            <div>
                <pre style="max-height: 500px" data-bind="html: inputDataFormatted"></pre>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bind="click: close, i18n: 'showDataDialog:close'"></button>
            <button type="button" class="btn btn-default" data-bind="click: copyToClipboard, i18nAttr: { title: 'showDataDialog:copyTitle' }">
                <span class="icon-copy"></span>
                <span data-bind="i18n: 'showDataDialog:copyToClipboard'"></span>
            </button>
        </div>
    </div>
</div>
