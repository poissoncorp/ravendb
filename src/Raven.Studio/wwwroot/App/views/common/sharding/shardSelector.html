<div class="scoped-modal" style="display:block">
    <div class="modal-dialog" role="document">
    <div class="modal-content neo-modal">
        <div class="modal-body text-center overflow-y-inherit">
            <button type="button" class="close" data-bind="click: closeClicked, visible: canClose, i18nAttr: { 'aria-label': 'shardingContext:selector.close' }" data-dismiss="modal"><i class="icon-cancel"></i></button>
            
            <img src="../../../../Content/img/sharding/shard.png" data-bind="i18nAttr: { alt: 'shardingContext:selector.imageAlt' }" class="img-responsive margin-center" style="width: 70px" />
            <h2 class="text-capitalize margin-top" data-bind="i18n: 'shardingContext:selector.title'"></h2>
            <p>
                <span data-bind="i18n: 'shardingContext:selector.singleShardOnly'"></span><br>
                <span data-bind="i18n: 'shardingContext:selector.selectShard'"></span>
            </p>
            <div class="flex-horizontal flex-content-center margin-top">
                <div data-bind="with: $root.selector">
                    <div data-bind="compose: { model: $root.selector }"></div>
                </div>
                <div>
                    <button class="btn btn-info" data-bind="click: shardSelected">
                        <span data-bind="i18n: 'shardingContext:selector.view'"></span> <i class="icon-arrow-thin-right margin-left-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
