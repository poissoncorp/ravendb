<div class="modal-dialog" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h3 class="modal-title" data-bind="i18n: 'latestBuildReminder:title'"></h3>
        </div>
        <div class="modal-body" style="font-size: 1.3em">
            <!-- ko if: !latestServerBuildResult.Exception -->
            <div>
                <span data-bind="i18n: { key: 'latestBuildReminder:newBuildAvailable', options: { build: latestServerBuildResult.LatestBuild } }"></span> <a href="http://ravendb.net/download" target="_blank" data-bind="i18n: 'latestBuildReminder:download'"></a>.
            </div>
            <!-- /ko -->
            <!-- ko if: !!latestServerBuildResult.Exception -->
            <div class="label label-danger" data-bind="i18n: 'latestBuildReminder:error'"></div>
            <div data-bind="text: latestServerBuildResult.Exception"></div>
            <!-- /ko -->

            <div class="checkbox">
                <input type="checkbox" class="styled" id="mute"
                       data-bind="checked: mute">
                <label for="mute" data-bind="i18n: 'latestBuildReminder:mute'"></label>
            </div>
        </div>
    </div>
</div>
