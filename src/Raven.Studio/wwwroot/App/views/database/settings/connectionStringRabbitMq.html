<div class="form-group" data-bind="validationElement: connectionStringName">
    <label class="control-label"><span data-bind="i18n: 'connectionStringRabbitMq:nameLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: connectionStringName, enable: isNew, i18nAttr: { title: isNew() ? 'connectionStringRabbitMq:nameTitle' : null, placeholder: 'connectionStringRabbitMq:namePlaceholder' }" />
    </div>
</div>
<div class="form-group" data-bind="validationElement: rabbitMqConnectionString">
    <label class="control-label"><span data-bind="i18n: 'connectionStringRabbitMq:connectionStringLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <textarea class="form-control" rows="2" data-bind="textInput: rabbitMqConnectionString, i18nAttr: { placeholder: 'connectionStringRabbitMq:connectionStringPlaceholder' }"></textarea>
    </div>
</div>
