<div class="form-group" data-bind="validationElement: connectionStringName">
    <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.nameLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: connectionStringName, enable: isNew, i18nAttr: { title: isNew() ? 'editElasticSearchEtlTask:connectionString.nameTitle' : null, placeholder: 'editElasticSearchEtlTask:connectionString.namePlaceholder' }" />
    </div>
</div>
<div class="form-group" data-bind="validationElement: inputUrl().discoveryUrlName"> 
    <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.nodesUrlsLabel'"></span><i class="required"></i></label>
    <div class="flex-grow"> 
        <input class="form-control" data-bind="textInput: inputUrl().discoveryUrlName, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.nodeUrlPlaceholder' }" />
    </div>
    <button class="btn btn-info" 
            data-bind="click: addDiscoveryUrlWithBlink, enable: inputUrl().discoveryUrlName() && inputUrl().validationGroup.isValid()">
        <i class="icon-plus"></i><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.addUrl'"></span>
    </button> 
</div>
<div class="form-group" data-bind="visible: nodesUrls().length">
    <label class="control-label">&nbsp;</label>
    <div class="flex-grow">
        <ul class="well collection-list" data-bind="foreach: nodesUrls">
            <li>
                <div class="name" data-bind="text: $data.discoveryUrlName"></div>
                <div class="text-warning margin-top margin-top-xs" data-bind="if: hasTestError, i18nAttr: { title: 'editElasticSearchEtlTask:testConnection.failed' }">
                    <i class="icon-warning"></i>
                </div>
                <a href="#"
                   data-bind="click: $parent.removeDiscoveryUrl.bind($parent, $data), i18nAttr: { title: 'editElasticSearchEtlTask:connectionString.removeUrlTitle' }">
                    <i class="icon-trash"></i>
                </a>
                <a class="btn btn-default" href="#"
                   data-bind="click: _.partial($root.onTestConnectionElasticSearch, $data), disable: $root.spinners.test,
                              css: { 'btn-spinner': $root.spinners.test() && $parent.selectedUrlToTest() === $data.discoveryUrlName() }, i18nAttr: { title: 'editElasticSearchEtlTask:connectionString.testUrlTitle' }">
                    <i class="icon-rocket"></i>
                </a>
            </li>
        </ul>
    </div>
</div>
<div data-bind="with: authentication">
    <div class="form-group">
        <label class="control-label" data-bind="i18n: 'editElasticSearchEtlTask:connectionString.authenticationLabel'"></label>
        <div class="flex-grow">
            <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                <span data-bind="text: labelFor(authMethodUsed())"></span> <span class="caret"></span>
            </button>
            <ul class="dropdown-menu" data-bind="foreach: $data.constructor.authProviders">
                <li><a href="#" data-bind="text: label, click: _.partial($parent.authMethodUsed, value)"></a></li>
            </ul>
        </div>
    </div>
    <div data-bind="collapse: authMethodUsed() === 'basic'">
        <div class="form-group" data-bind="validationElement: username">
            <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.usernameLabel'"></span> <i class="required"></i></label>
            <div class="flex-grow">
                <input class="form-control" data-bind="textInput: username, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.usernamePlaceholder' }" />
            </div>
        </div>
        <div class="form-group" data-bind="validationElement: password">
            <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.passwordLabel'"></span> <i class="required"></i></label>
            <div class="flex-grow">
                <input class="form-control" data-bind="textInput: password, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.passwordPlaceholder' }" />
            </div>
        </div>
    </div>
    <div data-bind="collapse: authMethodUsed() === 'apiKey'">
        <div class="form-group" data-bind="validationElement: apiKeyId">
            <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.apiKeyIdLabel'"></span> <i class="required"></i></label>
            <div class="flex-grow">
                <input class="form-control" data-bind="textInput: apiKeyId, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.apiKeyIdPlaceholder' }" />
            </div>
        </div>
        <div class="form-group" data-bind="validationElement: apiKey">
            <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.apiKeyLabel'"></span> <i class="required"></i></label>
            <div class="flex-grow">
                <input class="form-control" data-bind="textInput: apiKey, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.apiKeyPlaceholder' }" />
            </div>
        </div>
    </div>
    <div data-bind="collapse: authMethodUsed() === 'encodedApiKey'">
        <div class="form-group" data-bind="validationElement: encodedApiKey">
            <label class="control-label"><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.encodedApiKeyLabel'"></span> <i class="required"></i></label>
            <div class="flex-grow">
                <input class="form-control" data-bind="textInput: encodedApiKey, i18nAttr: { placeholder: 'editElasticSearchEtlTask:connectionString.encodedApiKeyPlaceholder' }" />
            </div>
        </div>
    </div>
    <div data-bind="collapse: authMethodUsed() === 'certificate'">
        <div class="input-group file-input">
            <input type="file" id="elasticCertificateFilePicker" data-bind="event: { change: _.partial(uploadElasticCertificate, $element) }" />
        </div>
        <div class="form-group" data-bind="if: certificates().length === 0">
            <label class="control-label">&nbsp</label>
            <div class="flex-grow">
                <label for="elasticCertificateFilePicker" class="btn btn-default">
                    <i class="icon-import"></i><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.uploadCertificate'"></span>
                </label>
            </div>
        </div>
        <div data-bind="foreach: certificates, validationElement: certificates">
            <div class="form-group">
                <label class="control-label" data-bind="i18n: 'editElasticSearchEtlTask:connectionString.certificateLabel'"></label>
                <div class="flex-grow">
                    <div data-bind="if: $data">
                        <div class="panel certificate-item margin-top margin-top-xs">
                            <div class="padding padding-sm flex-horizontal">
                                <div data-bind="i18nAttr: { title: 'editElasticSearchEtlTask:connectionString.thumbprintTitle' }">
                                    <i class="icon-certificate"></i>
                                    <span data-bind="text: $data.thumbprint()"></span>
                                </div>
                                <div class="flex-separator"></div>
                                <button class="btn btn-sm btn-primary pull-right"
                                        data-bind="click: $parent.removeCertificate.bind($parent, $data), i18nAttr: { title: 'editElasticSearchEtlTask:connectionString.removeCertificateTitle' }">
                                    <i class="icon-trash"></i>
                                </button>
                            </div>
                            <div class="panel-addon padding padding-sm">
                                <div class="flex-horizontal">
                                    <span class="notBefore">
                                        <span class="margin-right margin-right-sm"><i class="icon-clock"></i><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.validFrom'"></span></span>
                                        <strong data-bind="text: $data.validFromText()"></strong>
                                    </span>
                                    <span class="expiration margin-left">
                                        <span class="margin-right margin-right-sm"><i data-bind="attr: { class: $data.expirationIcon }"></i><span data-bind="i18n: 'editElasticSearchEtlTask:connectionString.expiration'"></span></span>
                                        <strong data-bind="attr: { class: $data.expirationClass }, text: $data.expirationText"></strong>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div data-bind="if: !nodesUrls.isValid()">
    <div class="form-group">
        <label class="control-label">&nbsp;</label>
        <span data-bind="validationElement: nodesUrls">
            <span class="help-block" data-bind="validationMessage: nodesUrls"></span>
        </span>
    </div>
</div>
<div data-bind="with: authentication">
    <div data-bind="if: !certificates.isValid()">
        <div class="form-group">
            <label class="control-label">&nbsp;</label>
            <span data-bind="validationElement: certificates">
                <span class="help-block" data-bind="validationMessage: certificates"></span>
            </span>
        </div>
    </div>
</div>
