<div class="form-group" data-bind="validationElement: connectionStringName">
    <label class="control-label"><span data-bind="i18n: 'connectionStringKafka:nameLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: connectionStringName, enable: isNew, i18nAttr: { title: isNew() ? 'connectionStringKafka:nameTitle' : null, placeholder: 'connectionStringKafka:namePlaceholder' }" />
    </div>
</div>
<div class="form-group" data-bind="validationElement: bootstrapServers">
    <label class="control-label"><span data-bind="i18n: 'connectionStringKafka:bootstrapServersLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: bootstrapServers, i18nAttr: { placeholder: 'connectionStringKafka:bootstrapServersPlaceholder' }" />
    </div>
</div>
<div class="form-group" data-bind="visible: isSecureServer">
    <label class="control-label">&nbsp;</label>
    <div class="toggle">
        <input id="useRavenCert" type="checkbox" data-bind="checked: useRavenCertificate">
        <label for="useRavenCert">
            <span data-bind="i18n: 'connectionStringKafka:useRavenCertificate'"></span>
            <small><i class="text-info icon-info use-server-certificate margin-left-xs"></i></small>
        </label>
    </div>
</div>
<div class="form-group">
    <label class="control-label" data-bind="i18n: 'connectionStringKafka:connectionOptions.label'"></label>
    <div class="flex-grow">
        <div data-bind="foreach: connectionOptions">
            <div class="flex-horizontal margin-bottom-xs">
                <input class="form-control margin-right-sm" data-bind="textInput: key, i18nAttr: { placeholder: 'connectionStringKafka:connectionOptions.keyPlaceholder' }" />
                <input class="form-control margin-right-sm" data-bind="textInput: value, visible: !multiLine(), i18nAttr: { placeholder: 'connectionStringKafka:connectionOptions.valuePlaceholder' }" />
                <textarea class="form-control margin-right-sm" data-bind="textInput: value, visible: multiLine, i18nAttr: { placeholder: 'connectionStringKafka:connectionOptions.valuePlaceholder' }">
                </textarea>
                <a href="#" class="btn" data-bind="click: $parent.removeConnectionOption.bind($parent, $data), i18nAttr: { title: 'connectionStringKafka:connectionOptions.removeTitle' }">
                    <i class="icon-trash"></i>
                </a>
            </div>
            <div data-bind="validationElement: isValidKeyValue">
                <div class="help-block margin-bottom-sm" data-bind="validationMessage: isValidKeyValue"></div>
            </div>
        </div>
        <div class="margin-top-sm">
            <button class="btn btn-default" data-bind="click: addNewConnectionOption">
                <i class="icon-plus"></i><span data-bind="i18n: 'connectionStringKafka:connectionOptions.addButton'"></span>
            </button>
        </div>
        <div class="text-center text-muted margin-top" data-bind="visible: connectionOptions().length === 0">
            <i class="icon-lg icon-empty-set"></i>
            <h3 class="margin-top margin-top-sm" data-bind="i18n: 'connectionStringKafka:connectionOptions.empty'"></h3>
        </div>
    </div>
</div>
