<div class="form-group" data-bind="validationElement: connectionStringName">
    <label class="control-label"><span data-bind="i18n: 'editSqlEtlTask:connectionString.nameLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control"
               data-bind="textInput: connectionStringName, enable: isNew, i18nAttr: { placeholder: 'editSqlEtlTask:connectionString.namePlaceholder', title: isNew() ? 'editSqlEtlTask:connectionString.nameTitle' : null }" >
    </div>
</div>
<div class="form-group" data-bind="validationElement: factoryName">
    <label class="control-label">
        <span data-bind="i18n: 'editSqlEtlTask:connectionString.factoryLabel'"></span>
        <br />
        <br />
        <small id="js-sql-syntax" class="text-primary" data-bind="visible: factoryName">
            <span data-bind="i18n: 'editSqlEtlTask:syntax'"></span> <i class="icon-help"></i>
        </small>
    </label>
    <div class="flex-grow">
        <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
            <span data-bind="visible: fullNameFor(factoryName()), text: fullNameFor(factoryName())"></span><span data-bind="visible: !fullNameFor(factoryName()), i18n: 'editSqlEtlTask:connectionString.selectFactory'"></span> <span class="caret"></span>
        </button>
        <ul class="dropdown-menu" data-bind="foreach: $data.constructor.sqlProviders">
            <li><a href="#" data-bind="text: $parent.fullNameFor(value), click: _.partial($parent.factoryName, value)"></a></li>
        </ul>
        <span class="help-block" data-bind="validationMessage: factoryName"></span>
        <div class="has-warning" data-bind="visible: factoryName() === 'MySql.Data.MySqlClient'">
            <div class="help-block">
                <i class="icon-warning"></i>
                <span data-bind="i18n: 'editSqlEtlTask:connectionString.deprecatedMySqlConnector'"></span>
            </div>
        </div>
        <div class="has-warning" data-bind="visible: factoryName() === 'System.Data.SqlClient'">
            <div class="help-block">
                <i class="icon-warning"></i>
                <span data-bind="i18n: 'editSqlEtlTask:connectionString.deprecatedSqlClient'"></span>
            </div>
        </div>
    </div>
</div>
<div class="form-group" data-bind="validationElement: connectionString">
    <label class="control-label"><span data-bind="i18n: 'editSqlEtlTask:connectionString.connectionStringLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <textarea class="form-control" rows="3" data-bind="textInput: connectionString, attr: { placeholder: factoryPlaceHolder(factoryName) }">
        </textarea>
    </div>
</div>
