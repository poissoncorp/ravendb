<div class="form-group" data-bind="validationElement: connectionStringName">
    <label class="control-label"><span data-bind="i18n: 'connectionStringRaven:nameLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: connectionStringName, enable: isNew, i18nAttr: { title: isNew() ? 'connectionStringRaven:nameTitle' : null, placeholder: 'connectionStringRaven:namePlaceholder' }" />
    </div>
</div>
<div class="form-group" data-bind="validationElement: database">
    <label class="control-label"><span data-bind="i18n: 'connectionStringRaven:databaseLabel'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: database, enable: !isServerWide(), i18nAttr: { placeholder: 'connectionStringRaven:databasePlaceholder', title: 'connectionStringRaven:databaseTitle' }" />
    </div>
</div>
<div class="form-group" data-bind="validationElement: inputUrl().discoveryUrlName, visible: !isServerWide()">
    <label class="control-label"><span data-bind="i18n: 'connectionStringRaven:discoveryUrls.label'"></span><i class="required"></i></label>
    <div class="flex-grow">
        <input class="form-control" data-bind="textInput: inputUrl().discoveryUrlName, i18nAttr: { placeholder: 'connectionStringRaven:discoveryUrls.placeholder' }" />
    </div>
    <button class="btn btn-info"
            data-bind="click: addDiscoveryUrlWithBlink, enable: inputUrl().discoveryUrlName() && inputUrl().validationGroup.isValid()">
        <i class="icon-plus"></i><span data-bind="i18n: 'connectionStringRaven:discoveryUrls.addButton'"></span>
    </button> 
</div>
<div class="form-group" data-bind="visible: topologyDiscoveryUrls().length && !isServerWide()">
    <label class="control-label">&nbsp;</label>
    <div class="flex-grow">
        <ul class="well collection-list" data-bind="foreach: topologyDiscoveryUrls">
            <li>
                <div class="name" data-bind="text: $data.discoveryUrlName"></div>
                <div class="text-warning margin-top margin-top-xs" data-bind="if: hasTestError, i18nAttr: { title: 'connectionStringRaven:discoveryUrls.testFailedTitle' }">
                    <i class="icon-warning"></i>
                </div>
                <a href="#"
                   data-bind="click: $parent.removeDiscoveryUrl.bind($parent, $data), i18nAttr: { title: 'connectionStringRaven:discoveryUrls.removeTitle' }">
                    <i class="icon-trash"></i>
                </a>
                <a class="btn btn-default" href="#"
                   data-bind="click: _.partial($root.onTestConnectionRaven, $data), disable: $root.spinners.test,
                              css: { 'btn-spinner': $root.spinners.test() && $parent.selectedUrlToTest() === $data.discoveryUrlName() },
                              i18nAttr: { title: 'connectionStringRaven:discoveryUrls.testTitle' }">
                    <i class="icon-rocket"></i>
                </a>
            </li>
        </ul>
    </div>
</div>
<div class="form-group" data-bind="visible: topologyDiscoveryUrls().length && isServerWide()">
    <label class="control-label" data-bind="i18n: 'connectionStringRaven:discoveryUrls.label'"></label>
    <div class="flex-grow">
        <ul class="well collection-list" data-bind="foreach: topologyDiscoveryUrls">
            <li>
                <div class="name" data-bind="text: $data.discoveryUrlName"></div>
            </li>
        </ul>
    </div>
</div>
<div class="form-group" data-bind="if: !topologyDiscoveryUrls.isValid()">
    <label class="control-label">&nbsp;</label>
    <span data-bind="validationElement: topologyDiscoveryUrls">
        <span class="help-block" data-bind="validationMessage: topologyDiscoveryUrls"></span>
    </span>
</div>
