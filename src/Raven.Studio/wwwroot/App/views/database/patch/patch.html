<div class="bs3 flex-window patch content-margin position-relative" id="patchContainer">
    <div class="flex-window-head">
        <div id="patch-target" >
            <div class="clearfix toolbar">
                <div class="pull-right-sm flex-horizontal">
                    <div class="bs5" data-bind="react: infoHubView"></div>
                    <div class="input-group patch-save" data-bind="css: { active: inSaveMode }, validationOptions: { insertMessages: false }, validationElement: patchSaveName">
                        <input class="form-control" style="display: none" data-bind="textInput: patchSaveName, hasFocus: patchSaveFocus, i18nAttr: { placeholder: 'patch:save.namePlaceholder' }">
                        <span class="input-group-btn">
                            <button class="btn btn-success" data-class="active" type="button" data-bind="click: savePatch, css: { 'btn-spinner': spinners.save }, i18nAttr: { title: 'patch:save.buttonTitle' }">
                                <i class="icon-save"></i> <span data-bind="i18n: inSaveMode() ? 'common:save' : 'patch:save.buttonWithName'"></span>
                            </button>
                        </span>
                    </div>
                    <div class="dropdown dropdown-right loadpatch" data-bind="template: { name: 'saved-patches-dialog' }">
                    </div>
                </div>
            </div>
            <div class="form-horizontal">
                <div class="row">
                    <div class="col-sm-3 col-lg-2">
                        <h2 class="on-base-background" data-bind="i18n: 'patch:title'"></h2>
                    </div>
                    <div class="col-sm-9 col-lg-10 margin-bottom">
                        <div class="patch-container">
                            <div class="patch-main">
                                <div class="patch-main-toolbar">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <div class="dropdown">
                                            <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
                                                <i class="icon-settings"></i><span data-bind="i18n: 'patch:settings.button'"></span>
                                                <span class="caret"></span>
                                            </button>
                                            <div class="dropdown-menu dropdown-menu-right settings-menu" data-bind="dropdownPanel: true, template: { name: 'settings-template' }">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div data-bind="react: patchAceEditorView" class="bs5"></div>
                            </div>
                            <div class="patch-controls">
                                <div class="flex-separator"></div>
                                <span class="has-disable-reason" data-bind="i18nAttr: { title: spinners.countMatchingDocuments() ? 'patch:run.calculatingTitle' : 'patch:run.executeTitle' }">
                                    <button class="btn btn-primary btn-block btn-lg text-center"
                                            data-bind="click: runPatch, css: { 'btn-spinner': spinners.countMatchingDocuments }, disable: spinners.countMatchingDocuments">
                                        <i class="icon-play2 icon-lg"></i><br />
                                        <small class="kbd"><kbd>ctrl</kbd> <strong>+</strong> <kbd>enter</kbd></small>
                                    </button>
                                </span>
                                <button class="btn btn-default btn-block text-center margin-top-sm" data-bind="click: test.enterTestMode, i18nAttr: { title: 'patch:test.enterTitle' }">
                                    <i class="icon-rocket"></i><span data-bind="i18n: 'patch:test.button'"></span>
                                </button>
                            </div>
                            <div class="test-controls">
                                <div class="flex-separator"></div>
                                <button class="btn btn-primary btn-block btn-lg text-center" data-bind="click: test.runTest, css: { 'btn-spinner' : test.spinners.testing }, disable: test.spinners.testing, i18nAttr: { title: 'patch:test.runTitle' }">
                                    <i class="icon-rocket"></i><span data-bind="i18n: 'patch:test.button'"></span><br />
                                    <small class="kbd"><kbd>ctrl</kbd> <strong>+</strong> <kbd>enter</kbd></small>
                                </button>
                                <button class="btn btn-default btn-block text-center test-close margin-top-sm" data-bind="click: test.closeTestMode, i18nAttr: { title: 'patch:test.doneTitle' }">
                                    <i class="icon-check"></i><span data-bind="i18n: 'patch:test.done'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="test-container" data-bind="template: { name: 'test-component' }, collapse: test.testMode()"></div>
</div>
<div class="backdrop"></div>

<script type="text/html" id="test-component">
    <div class="row margin-bottom form-horizontal" data-bind="with: test">
        <label class="control-label col-sm-offset-3 col-lg-offset-2 col-sm-2 col-lg-1" data-bind="i18n: 'patch:test.documentIdLabel'"></label>
        <div class="col-sm-8 col-lg-9">
            <div class="row">
                <div class="col-sm-8">
                    <div class="input-group" data-bind="validationOptions: { insertMessages: false }, validationElement: documentId">
                        <input type="text" id="documentId" data-bind="textInput: documentId, disable: spinners.testing, i18nAttr: { placeholder: 'patch:test.documentIdPlaceholder' }"
                               class="form-control" autocomplete="off" />
                        <span class="help-block" data-bind="validationMessage: documentId"></span>
                        <ul class="documentIdAutocomplete dropdown-menu autocomplete-list" role="menu" 
                             data-bind="autoComplete: '#documentId', foreach: docsIdsAutocompleteResults">
                            <li role="presentation" data-bind="click: _.partial($parent.onAutocompleteOptionSelected, $data)">
                                <a role="menuitem" tabindex="-1" href="#">
                                    <span data-bind="text: $data"></span>
                                </a>
                            </li>
                        </ul>
                        <span class="input-group-btn" style="vertical-align:top">
                            <button class="btn" type="button"
                                    data-bind="i18nAttr: { title: 'patch:test.previewTitle' }, click: previewDocument, css: { 'btn-spinner': spinners.autocomplete() || spinners.preview() },
                                               disable: spinners.preview() || !documentId() || spinners.testing() || spinners.autocomplete()">
                                <i class="icon-preview"></i>
                            </button>
                        </span>
                        <button class="btn btn-default"
                                data-bind="i18nAttr: { title: 'patch:test.loadDocumentTitle' }, click: loadDocument, css: { 'btn-spinner': spinners.loadingDocument }, disable: spinners.loadingDocument() || !documentId() || spinners.testing()" >
                            <i class="icon-import"></i>
                            <span data-bind="i18n: 'patch:test.loadDocument'"></span>
                        </button>
                    </div>
                </div>
                <div class="col-sm-6">
                    <!-- TODO: <small class="text-info"><i class="icon-info"></i> You can also paste your own document JSON to test</small>-->
                </div>
            </div>
        </div>
    </div>
    <div class="row tabs-left form-horizontal">
        <div class="col-sm-3 col-lg-2">
            <ul class="nav nav-tabs nav-stacked" data-bind="with: test">
                <li data-bind="click: tabClicked('preview')">
                    <a href="#preview" data-toggle="tab" data-bind="i18nAttr: { title: 'patch:test.tabs.previewTitle' }">
                        <i class="icon-preview"></i>
                        <span data-bind="i18n: 'patch:test.tabs.preview'"></span>
                    </a>
                </li>
                <li data-bind="click: tabClicked('loaded')">
                    <a href="#loaded" data-toggle="tab" data-bind="i18nAttr: { title: 'patch:test.tabs.loadedTitle' }">
                        <i class="icon-import"></i>
                        <span data-bind="i18n: 'patch:test.tabs.loaded'"></span>
                        <span class="label label-primary pull-right" data-bind="text: actions.loadedCount"></span>
                    </a>
                </li>
                <li data-bind="click: tabClicked('modified')">
                    <a href="#modified" data-toggle="tab" data-bind="i18nAttr: { title: 'patch:test.tabs.modifiedTitle' }">
                        <i class="icon-export"></i>
                        <span data-bind="i18n: 'patch:test.tabs.modified'"></span>
                        <span class="label label-primary pull-right" data-bind="text: actions.modifiedCount"></span>
                    </a>
                </li>
                <li data-bind="click: tabClicked('deleted')">
                    <a href="#deleted" data-toggle="tab" data-bind="i18nAttr: { title: 'patch:test.tabs.deletedTitle' }">
                        <i class="icon-trash"></i>
                        <span data-bind="i18n: 'patch:test.tabs.deleted'"></span>
                        <span class="label label-primary pull-right" data-bind="text: actions.deletedCount"></span>
                    </a>
                </li>
                <li data-bind="click: tabClicked('output')">
                    <a href="#output" data-toggle="tab" data-bind="i18nAttr: { title: 'patch:test.tabs.outputTitle' }"> 
                        <i class="icon-administrator-js-console"></i>
                        <span data-bind="i18n: 'patch:test.tabs.output'"></span>
                        <span class="label label-primary pull-right" data-bind="text: output().length || ''"></span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="col-sm-9 col-lg-10">
            <div class="panel">
                <div data-bind="with: test">
                    <div class="tab-content scroll">
                        <div class="tab-pane fade in active" id="preview" data-bind="if: activeTestTab() === 'preview'">
                            <div class="row">
                                <div class="col-sm-6">
                                    <h3 data-bind="i18n: 'patch:test.before'"></h3>
                                    <pre id="beforeDocEditor"
                                         data-bind="aceEditor: { code: beforeDoc, fontSize:'14px', lang: 'ace/mode/raven_document', readOnly: true }"></pre>
                                </div>
                                <div class="col-sm-6">
                                    <h3 data-bind="i18n: 'patch:test.after'"></h3>
                                    <pre id="afterDocEditor"
                                         data-bind="aceEditor: { code: afterDoc, fontSize:'14px', lang: 'ace/mode/raven_document', readOnly: true }"></pre>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade margin-bottom" id="loaded" data-bind="if: activeTestTab() === 'loaded'">
                            <div data-bind="with: actions">
                                <h2 class="text-center" data-bind="i18n: 'patch:test.loadedData'"></h2>
                                <hr />
                                <div data-bind="compose: $root.patchDebugActionsLoadedView"></div>    
                            </div>
                        </div>
                        <div class="tab-pane fade margin-bottom" id="modified" data-bind="if: activeTestTab() === 'modified'">
                            <div data-bind="with: actions">
                                <h2 class="text-center" data-bind="i18n: 'patch:test.modifiedData'"></h2>
                                <hr />
                                <div data-bind="compose: $root.patchDebugActionsModifiedView"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade margin-bottom" id="deleted" data-bind="if: activeTestTab() === 'deleted'">
                            <div data-bind="with: actions">
                                <h2 class="text-center" data-bind="i18n: 'patch:test.deletedData'"></h2>
                                <hr />
                                <div data-bind="compose: $root.patchDebugActionsDeletedView"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade margin-bottom" id="output" data-bind="if: activeTestTab() === 'output'">
                            <h2 class="text-center" data-bind="i18n: 'patch:test.outputData'"></h2>
                            <hr>
                            <ul data-bind="foreach: output">
                                <li>
                                    <small data-bind="text: $data"></small>
                                </li>
                            </ul>
                            <p data-bind="if: output().length === 0"><span data-bind="i18n: 'patch:test.noOutput'"></span></p>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="saved-patches-dialog">
    <button class="btn btn-default dropdown-toggle" type="button" id="dropdownLoadPatch" data-toggle="dropdown" data-bind="enable: savedPatches.hasAnySavedPatch, click: showFirstItemInPreviewArea, i18nAttr: { title: 'patch:savedPatches.loadTitle' }">
        <i class="icon-patch"></i><span data-bind="i18n: 'patch:savedPatches.loadButton'"></span>
        <span class="caret"></span>
    </button>
    <div class="dropdown-menu slidein-style" aria-labelledby="dropdownLoadPatch" data-bind="dropdownPanel: true, with: savedPatches">
        <div class="loadpatch-dropdown flex-vertical" data-bind="css: { 'show-preview': previewItem() }">
            <div class="flex-grow loadpatch-container">
                <div class="patch-preview-container flex-vertical">
                    <div class="flex-header">
                        <h2 data-bind="i18n: 'patch:savedPatches.previewHeading'"></h2>
                    </div>
                    <div class="flex-grow flex-vertical scroll">
                        <div class="bg-info padding padding-sm">
                            <div class="row">
                                <div class="col-xs-9">
                                   <span data-bind="i18n: 'patch:savedPatches.nameLabel'"></span> &nbsp;<strong data-bind="text: previewItem() ? previewItem().Name : ''"></strong>
                                </div>
                                <div class="col-xs-3">
                                    <span class="pull-right"> 
                                        <button class="btn btn-success btn-sm close-panel" data-bind="click: usePatch , enable: previewItem(), i18n: 'patch:savedPatches.load', i18nAttr: { title: 'patch:savedPatches.loadTitle' }"></button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="pre-container">
<pre class="bg-info">
<code data-bind="text: previewCode"></code>
</pre>
                        </div>
                    </div>
                </div>
                <div class="patch-list-container flex-vertical">
                    <div class="flex-header">
                        <div class="row">
                            <div class="col-xs-6">
                                <h2 data-bind="i18n: 'patch:savedPatches.selectHeading'"></h2>
                            </div>
                            <div class="col-xs-6">
                                <input type="search" class="form-control input-sm patch-filter" data-bind="textInput: filters.searchText, i18nAttr: { placeholder: 'patch:savedPatches.filterPlaceholder', title: 'patch:savedPatches.filterTitle' }">
                            </div>
                        </div>
                    </div>
                    <div class="flex-grow scroll">
                        <ul class="patch-list" data-bind="foreach: filteredPatches">
                            <li data-bind="css: { selected: $data === $parent.previewItem() }, event: { mouseenter: $parent.previewPatch }">                             
                                <a href="#" class="patch-link close-panel" data-bind="click: $parent.usePatchItem.bind($parent, $data)">
                                    <span class="name" data-bind="text: Name"></span>
                                    <span class="modified flex-shrink-0" data-bind="text: ModificationDate"></span>
                                </a>
                                <a href="#" data-bind="click: $parent.removePatch" class="patch-remove"><i class="icon-trash"></i></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="settings-template">
    <div class="padding margin-left-sm margin-right-sm">
        <strong><h4 data-bind="i18n: 'patch:settings.staleIndexesHeading'"></h4></strong>
        <div class="radio">
            <input id="allowPatchingStaleIndex" type="radio" data-bind="checked: staleIndexBehavior" name="staleBehavior" value="patchStale">
            <label for="allowPatchingStaleIndex" data-bind="i18n: 'patch:settings.patchImmediately'"></label>
        </div>
        <div class="radio margin-bottom">
            <input id="timeToWaitForNonStale" type="radio" data-bind="checked: staleIndexBehavior" name="staleBehavior" value="timeoutDefined">
            <label for="timeToWaitForNonStale" data-bind="i18n: 'patch:settings.defineTimeout'"></label>
            <div class="margin-left" data-bind="collapse: staleIndexBehavior() === 'timeoutDefined'">
                <input type="text" class="form-control" data-bind="durationPicker: staleTimeout, durationPickerOptions: { showDays: false, showSeconds: true }" />
            </div>
            <div class="margin-left margin-top margin-top-sm" data-bind="visible: staleIndexBehavior() === 'timeoutDefined'">
                <small><i class="icon-warning"></i>  <span data-bind="i18n: 'patch:settings.timeoutWarning'"></span></small>
            </div>
        </div>
        <hr>
        <div>
            <div class="toggle">
                <input id="disableAutoIndex" type="checkbox" data-bind="checked: disableAutoIndexCreation">
                <label for="disableAutoIndex" data-bind="i18n: 'patch:settings.disableAutoIndex'"></label>
            </div>
            <div class="toggle">
                <input id="ignoreMaxStepsForScript" type="checkbox" data-bind="checked: ignoreMaxStepsForScript">
                <label for="ignoreMaxStepsForScript" data-bind="i18n: 'patch:settings.ignoreMaxSteps'"></label>
            </div>
            <div class="toggle">
                <input id="maxOperations" class="styled" type="checkbox" data-bind="checked: defineMaxOperationsPerSecond">
                <label for="maxOperations" data-bind="i18n: 'patch:settings.limitOperations'"></label>
            </div>
            <div data-bind="collapse: defineMaxOperationsPerSecond">
                <div class="input-group margin-right">
                    <input id="operationsPerSecond" type="number" min="1" class="form-control input-border" data-bind="numericInput: maxOperationsPerSecond, i18nAttr: { placeholder: 'patch:settings.maxOperationsPlaceholder' }"/>
                    <div class="input-group-addon input-border" data-bind="i18n: 'patch:settings.perSecond'"></div>
                </div>
            </div>
        </div>
    </div>
</script>
