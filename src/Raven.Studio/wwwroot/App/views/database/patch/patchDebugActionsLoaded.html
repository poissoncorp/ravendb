<div>
    <div data-bind="if: loadDocument().length">
        <h3 class="d-flex align-items-center">
            <i class="icon-document"></i>
            <span data-bind="i18n: 'patchDebugActionsLoaded:documents.title'"></span>
            <span data-bind="text: loadDocument().length" class="label label-info margin-left-xxs"></span>
        </h3>
        <ul data-bind="foreach: loadDocument" class="d-flex flex-wrap gap-1 p-0">
            <li class="d-flex flex-vertical panel-bg-1 padding-xs border-radius-xs test-result-item">
                <small class="flex-vertical">
                    <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:documents.id'"></label>
                    <span class="tab-data" data-bind="text: Id"></span>
                </small>
                <small class="flex-vertical" data-bind="visible: !Exists">
                    <span class="tab-data text-warning" data-bind="i18n: 'patchDebugActionsLoaded:documents.notFound'"></span>
                </small>
            </li>
        </ul>
    </div>
    <div data-bind="if: getCounter().length" class="margin-top">
        <h3 class="d-flex align-items-center">
            <i class="icon-new-counter"></i>
            <span data-bind="i18n: 'patchDebugActionsLoaded:counters.title'"></span>
            <span data-bind="text: getCounter().length" class="label label-info margin-left-xxs"></span>
        </h3>
        <ul data-bind="foreach: getCounter" class="d-flex flex-wrap gap-1 p-0">
            <li class="d-flex flex-vertical panel-bg-1 padding-xs border-radius-xs test-result-item">
                <small class="flex-vertical">
                    <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:counters.name'"></label>
                    <span class="tab-data" data-bind="text: Name"></span>
                </small>
                <span data-bind="visible: !Exists">
                    <small class="flex-vertical">
                        <span class="tab-data text-warning" data-bind="i18n: 'patchDebugActionsLoaded:counters.notFound'"></span>
                    </small>
                </span>
                <span data-bind="if: Exists">
                    <small class="flex-vertical">
                        <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:counters.value'"></label>
                        <span class="tab-data" data-bind="text: Value"></span>
                    </small>
                </span>
            </li>
        </ul>
    </div>
    <div data-bind="if: getTimeSeries().length" class="margin-top">
        <div class="flex-horizontal">
            <h3 class="d-flex align-items-center">
                <i class="icon-document"></i>
                <span data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.title'"></span>
                <span data-bind="text: getTimeSeries().length" class="label label-info margin-left-xxs"></span>
            </h3>
            <div class="flex-separator"></div>
            <div class="toggle toggle-inline">
                <input type="checkbox" id="showValuesInLoaded" data-bind="checked: showTimeSeriesValuesInLoaded">
                <label for="showValuesInLoaded" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.showValues'"></label>
            </div>
        </div>
        <ul data-bind="foreach: getTimeSeries" class="d-flex flex-wrap gap-1 p-0">
            <li class="d-flex flex-vertical panel-bg-1 padding-xs border-radius-xs test-result-item">
                <small class="flex-vertical">
                    <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.name'"></label>
                    <span class="tab-data" data-bind="text: Name"></span>
                </small>
                <span data-bind="visible: !Exists">
                    <small class="flex-vertical">
                        <span class="tab-data text-warning" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.noEntries'"></span>
                    </small>
                </span>
                <span data-bind="if: Exists">
                    <small class="flex-vertical">
                        <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.entryTag'"></label>
                        <span class="tab-data" data-bind="text: Tag, visible: Tag"></span>
                        <span class="tab-data" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.noTag', visible: !Tag"></span>
                    </small>
                    <small class="flex-vertical">
                        <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.timeStamp'"></label>
                        <span class="tab-data" data-bind="text: Timestamp"></span>
                    </small>
                    <small class="flex-vertical">
                        <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.values'"></label>
                        <span class="tab-data" data-bind="css: { 'hide': $parent.showTimeSeriesValuesInLoaded }">{ ... }</span>
                    </small>
                    <pre class="hide" data-bind="html: $parent.formatAsJson(Values), css: { 'show' : $parent.showTimeSeriesValuesInLoaded }"></pre>
                    <small class="flex-vertical">
                        <label class="small-label" data-bind="i18n: 'patchDebugActionsLoaded:timeSeries.type'"></label>
                        <span class="tab-data" data-bind="text: Type"></span>
                    </small>
                </span>
            </li>
        </ul>
    </div>
    <div data-bind="if: !loadedCount()">
        <div class="empty-set text-center margin-top-sm margin-bottom-sm mx-auto">
            <i class="icon-disabled icon-xl m-0"></i>
            <div class="lead">
                <span data-bind="i18n: 'patchDebugActionsLoaded:empty'"></span>
            </div>
        </div>
    </div>
</div>
