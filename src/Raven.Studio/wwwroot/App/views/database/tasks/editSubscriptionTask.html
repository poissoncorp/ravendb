    <div class="edit-subscription flex-vertical absolute-fill content-margin edit-subscription-task edit-ongoing-task">
        <div class="align-items-center justify-content-between d-flex gap-2 margin-bottom-md padding-top-xs">
            <div class="flex-horizontal gap-2">
                <i class="icon-subscription"></i>
                <h2 data-bind="i18n: { key: 'editSubscriptionTask:heading', options: { context: $root.isAddingNewSubscriptionTask() ? 'new' : 'edit' } }" class="mb-0"></h2>
            </div>
            <div class="flex-end margin-right-xs" data-bind="react: $root.infoHubView"></div>
        </div>
        <div class="row flex-row flex-grow flex-stretch-items">
            <div class="col-sm-12 col-lg-6 flex-vertical">
                <form data-bind="submit: saveSubscription">
                    <div class="flex-header">
                        <button type="submit" class="btn btn-primary" data-bind="enable: dirtyFlag().isDirty">
                            <i class="icon-save"></i>
                            <span data-bind="i18n: 'common:save'"></span>
                        </button>
                        <button
                            class="btn btn-default"
                            data-bind="
                                click: cloneSubscription,
                                visible: !isAddingNewSubscriptionTask(),
                                disable: $root.databaseLimitStatus() === 'limitReached' || $root.clusterLimitStatus() === 'limitReached',
                                attr: { title: $root.cloneButtonTitle }"
                        >
                            <i class="icon-clone"></i>
                            <span data-bind="i18n: 'editSubscriptionTask:clone'"></span>
                        </button>
                        <button class="btn btn-default" data-bind="click: cancelOperation, i18nAttr: { title: 'editSubscriptionTask:cancelTitle' }">
                            <i class="icon-cancel"></i>
                            <span data-bind="i18n: 'common:cancel'"></span>
                        </button>
                        <button class="btn btn-info pull-right" data-bind="click: toggleTestArea, visible: !enableTestArea(), i18nAttr: { title: 'editSubscriptionTask:testTitle' }">
                            <i class="icon-rocket"></i>
                            <span data-bind="i18n: 'editSubscriptionTask:testSubscription'"></span>
                        </button>
                        <button class="btn btn-info pull-right" data-bind="click: toggleTestArea, visible: enableTestArea, i18nAttr: { title: 'editSubscriptionTask:closeTestAreaTitle' }">
                            <i class="icon-rocket"></i>
                            <span data-bind="i18n: 'editSubscriptionTask:closeTestArea'"></span>
                        </button>
                    </div>
                    <div class="flex-grow" data-bind="with: editedSubscription">
                        <div class="panel padding flex-form">
                            <div data-bind="if: liveConnection() && !$root.isAddingNewSubscriptionTask()">
                                <div class="bg-warning inline-block padding padding-xs small" data-bind="i18nAttr: { title: 'editSubscriptionTask:task.liveConnectionTitle' }">
                                    <i class="icon-warning"></i>&nbsp;&nbsp;<span data-bind="i18n: 'editSubscriptionTask:task.liveConnectionWarning'"></span>
                                </div>
                            </div>
                            <div class="form-group margin-top" data-bind="validationElement: taskName">
                                <label class="control-label" data-bind="i18n: 'editSubscriptionTask:task.nameLabel'"></label>
                                <input type="text" class="form-control" id="taskName"
                                       data-bind="textInput: taskName, enable: $root.isAddingNewSubscriptionTask,
                                                  i18nAttr: { placeholder: 'editSubscriptionTask:task.namePlaceholder', title: $root.isAddingNewSubscriptionTask() ? 'editSubscriptionTask:task.nameTitle' : null }" autocomplete="off" >
                            </div>
                            <div class="form-group">
                                <label class="control-label" data-bind="i18n: 'editSubscriptionTask:task.stateLabel'"></label>
                                <div class="flex-grow">
                                    <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                                        <span data-bind="text: stateText()"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a href="#" data-bind="click: _.partial($root.setState, 'Enabled')"><span data-bind="i18n: 'editSubscriptionTask:task.stateEnabled'"></span></a></li>
                                        <li><a href="#" data-bind="click: _.partial($root.setState, 'Disabled')"><span data-bind="i18n: 'editSubscriptionTask:task.stateDisabled'"></span></a></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="margin-top d-flex justify-content-between">
                                <label data-bind="i18n: 'editSubscriptionTask:task.queryLabel'"></label>
                                <a href="#" data-bind="click: $root.syntaxHelp"><small><span data-bind="i18n: 'editSubscriptionTask:syntax'"></span> <i class="icon-help"></i></small></a>
                            </div>
                            <pre class="form-control query-source"
                                 data-bind="i18nAttr: { placeholder: 'editSubscriptionTask:task.queryPlaceholder' }, aceEditor: { code: query, lang:'ace/mode/rql', completer: $root.languageService.complete }, validationOptions: { errorsAsTitle: false }, validationElement: query" style="height: 160px;">
                            </pre>
                            <div data-bind="validationOptions: { errorsAsTitle: false }, validationElement: query">
                                <div class="help-block" data-bind="validationMessage: query"></div>
                            </div>
                            <div data-bind="if: !$root.hasRevisionsInSubscriptions" >
                                <div class="alert alert-warning alert-dismissible show margin-top-sm" role="alert">
                                    <button type="button" class="close btn-lg" data-dismiss="alert" data-bind="i18nAttr: { 'aria-label': 'editSubscriptionTask:close' }">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                    <small data-bind="html: $root.revisionsLicenseHtml"></small>
                                </div>
                            </div>
                        </div>
                        <div class="panel padding flex-form">
                            <div class="flex-horizontal">
                                <div class="form-group">
                                    <label class="control-label" data-bind="i18n: 'editSubscriptionTask:archived.label'"></label>
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-default set-size dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
                                            <span data-bind="text: $root.formatArchivedDataProcessingBehavior(archivedDataProcessingBehavior())"></span> <span class="caret"></span>
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li>
                                                <a href="#" data-bind="click: archivedDataProcessingBehavior.bind(archivedDataProcessingBehavior, null)">
                                                    <span data-bind="text: $root.formatArchivedDataProcessingBehavior(null)"></span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="#" data-bind="click: archivedDataProcessingBehavior.bind(archivedDataProcessingBehavior, 'ExcludeArchived')">
                                                    <span data-bind="text: $root.formatArchivedDataProcessingBehavior('ExcludeArchived')"></span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="#" data-bind="click: archivedDataProcessingBehavior.bind(archivedDataProcessingBehavior, 'IncludeArchived')">
                                                    <span data-bind="text: $root.formatArchivedDataProcessingBehavior('IncludeArchived')"></span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="#" data-bind="click: archivedDataProcessingBehavior.bind(archivedDataProcessingBehavior, 'ArchivedOnly')">
                                                    <span data-bind="text: $root.formatArchivedDataProcessingBehavior('ArchivedOnly')"></span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                                <div>
                                  <span><small><i class="archive-info icon-info text-info"></i></small></span>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="toggle" data-placement="right" data-toggle="tooltip" data-animation="true" data-bind="i18nAttr: { title: 'editSubscriptionTask:startingPoint.toggleTitle' }">
                                    <input id="use-starting-point" type="checkbox" data-bind="checked: setStartingPoint">
                                    <label for="use-starting-point" data-bind="i18n: 'editSubscriptionTask:startingPoint.toggle'"></label>
                                </div>
                            </div>
                            <div data-bind="collapse: setStartingPoint">
                                <div class="form-group">
                                    <label class="control-label" data-bind="i18n: 'editSubscriptionTask:startingPoint.label'"></label>
                                    <div class="flex-grow">
                                        <div data-bind="i18nAttr: { title: 'editSubscriptionTask:startingPoint.title' }">
                                            <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                                                <span data-bind="text: $root.formatStartingPointType(startingPointType())"></span>
                                                <span class="caret"></span>
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li data-bind="i18nAttr: { title: 'editSubscriptionTask:startingPoint.beginningOfTimeTitle' }">
                                                    <a href="#" data-bind="click: _.partial($root.setStartingPointType, 'Beginning of Time'), i18n: 'editSubscriptionTask:startingPoint.beginningOfTime'"></a>
                                                </li>
                                                <li data-bind="i18nAttr: { title: 'editSubscriptionTask:startingPoint.latestDocumentTitle' }">
                                                    <a href="#" data-bind="click: _.partial($root.setStartingPointType, 'Latest Document'), i18n: 'editSubscriptionTask:startingPoint.latestDocument'"></a>
                                                </li>
                                                <li data-bind="i18nAttr: { title: 'editSubscriptionTask:startingPoint.changeVectorTitle' }">
                                                    <a href="#" data-bind="click: _.partial($root.setStartingPointType, 'Change Vector'), css: { disabled: !$root.canUseChangeVectorAsStartingPoint() }">
                                                        <span data-bind="i18n: 'editSubscriptionTask:startingPoint.changeVector'"></span> <span class="text-warning" data-bind="visible: !$root.canUseChangeVectorAsStartingPoint(), i18n: 'editSubscriptionTask:startingPoint.notAvailableSharded'"></span>
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" data-bind="visible: startingPointChangeVector() && setStartingPoint(), validationElement: startingChangeVector">
                                <label class="control-label" data-bind="i18n: 'editSubscriptionTask:startingPoint.changeVectorLabel'"></label>
                                <div class="flex-grow" data-bind="validationOptions: { insertMessages: false }">
                                    <textarea rows="3" class="form-control"
                                              data-bind="textInput: startingChangeVector, enable: setStartingPoint, i18nAttr: { placeholder: 'editSubscriptionTask:startingPoint.changeVectorPlaceholder' }"></textarea>
                                    <!--<button class="btn btn-default btn-block btn-upcoming"><i class="icon-preview"></i><span>&nbsp;Show related document</span></button>--> <!-- todo: we need end point for this.. -->
                                    <span class="help-block" data-bind="validationMessage: startingChangeVector"></span>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: $root.db.isSharded() ? 'editSubscriptionTask:responsibleNode.shardedTitle' : 'editSubscriptionTask:responsibleNode.title' }"
                                     data-animation="true">
                                    <input id="responsibleNode" type="checkbox" data-bind="checked: manualChooseMentor, disable: $root.possibleMentors().length === 0 || $root.db.isSharded()">
                                    <label for="responsibleNode" data-bind="i18n: 'editSubscriptionTask:responsibleNode.toggle'"></label>
                                </div>
                            </div>
                            <div data-bind="compose: $root.taskResponsibleNodeSectionView"></div>
                        </div>
                        <div data-bind="if: changeVectorForNextBatchStartingPoint() && changeVectorForNextBatchStartingPoint() !== 'DoNotChange' && !setStartingPoint()">
                            <div class="panel padding" data-bind="i18nAttr: { title: 'editSubscriptionTask:nextBatch.title' }">
                                <label for="latest-change-vector" data-bind="i18n: 'editSubscriptionTask:nextBatch.label'"></label>
                                <textarea id="latest-change-vector" rows="2" class="form-control" disabled="disabled" data-bind="textInput: changeVectorForNextBatchStartingPoint"></textarea>
                            </div>
                        </div>

                        
                    </div>
                </form>
            </div>
            <div class="col-sm-12 col-lg-6 flex-vertical" id="subscriptionTestArea" data-bind="visible: enableTestArea">
                <div class="panel padding flex-vertical flex-grow">
                    <div class="flex-header"> 
                        <div class="flex-horizontal">
                            <div class="flex-grow"><h3 data-bind="i18n: 'editSubscriptionTask:test.heading'"></h3></div>
                            <div><button class="close" data-bind="click: toggleTestArea, i18nAttr: { title: 'editSubscriptionTask:closeTestAreaTitle' }"><i class="icon-cancel"></i></button></div>
                        </div>
                        <div class="flex-horizontal margin-bottom margin-bottom-sm">
                            <div class="flex-grow flex-vertical">
                                <div class="input-group">
                                    <div class="input-group-addon" data-bind="i18n: 'editSubscriptionTask:test.resultsLimit'"></div>
                                    <input type="number" min="1" class="form-control" data-bind="textInput: testResultsLimit, i18nAttr: { placeholder: 'editSubscriptionTask:test.resultsLimitHint', title: 'editSubscriptionTask:test.resultsLimitHint' }" />
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-info" data-bind="click: runTest, css: { 'btn-spinner': spinners.globalToggleDisable }, disable: spinners.globalToggleDisable, i18nAttr: { title: 'editSubscriptionTask:test.runTitle' }">
                                    <i class="icon-rocket"></i><span data-bind="i18n: 'editSubscriptionTask:test.run'"></span>
                                </button>
                            </div>
                        </div>
                        <div class="flex-horizontal">
                            <div class="flex-grow flex-vertical">
                                <div class="input-group">
                                    <div class="input-group-addon" data-bind="i18n: 'editSubscriptionTask:test.timeLimit'"></div>
                                    <div class="input-group flex-grow">
                                        <input type="number" min="1" class="form-control" data-bind="textInput: testTimeLimit, i18nAttr: { placeholder: 'editSubscriptionTask:test.timeLimitPlaceholder', title: 'editSubscriptionTask:test.timeLimitTitle' }" />
                                        <div class="input-group-addon" data-bind="i18n: 'editSubscriptionTask:test.seconds'"></div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="btn-group dropdown-right open">
                                    <button class="btn btn-default btn-sm dropdown-toggle" type="button" data-toggle="dropdown">
                                        <i class="icon-table"></i><span data-bind="i18n: 'editSubscriptionTask:test.display'"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <div class="dropdown-menu colselect-dropdown slidein-style" role="menu" data-bind="dropdownPanel: true">
                                        <div data-bind="compose: { model: $root.columnsSelector }"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-grow scroll">
                        <div class="objects-list-container">
                            <virtual-grid class="resizable" params="controller: gridController, emptyTemplate: 'empty-test-results-template'"></virtual-grid>
                        </div>
                    </div>
                    <div class="flex-window-head">
                        <button type="button" class="btn btn-sm" data-bind="css: { active: currentTab() === 'results' }, click: _.partial(goToTab, 'results')">
                            <span data-bind="i18n: 'editSubscriptionTask:test.results'"></span> &nbsp; <span class="label label-primary" data-bind="text: resultsCount().toLocaleString()"></span>
                        </button>
                        <!-- ko foreach: includesCache -->
                        <button type="button" class="btn btn-sm" data-bind="click: _.partial($root.goToTab, $data), css: { active: $parent.currentTab() === $data }">
                            <span data-bind="i18n: { key: 'editSubscriptionTask:test.includes', options: { name: name } }"></span> &nbsp; <span class="label label-primary" data-bind="text: total().toLocaleString()"></span>
                        </button>
                        <!-- /ko -->
                    </div>
                </div>
            </div>
        </div>
    </div>

<script type="text/html" id="empty-test-results-template">
    <span data-bind="i18n: 'editSubscriptionTask:test.noResults'"></span>
</script>

<div class="tooltip json-preview lg js-subscription-task-tooltip" style="opacity: 0">
</div>
