<div class="flex-horizontal flex-header margin-top-sm">
    <div><h3 data-bind="i18n: $data.destinationType === 'Topic' ? 'optionsPerQueueEtl:topic.title' : 'optionsPerQueueEtl:queue.title'"></h3></div>
    <div>
        <button type="button" class="btn btn-info margin-bottom-sm margin-left" data-bind="click: addNewQueueOptions">
            <i class="icon-plus"></i><span data-bind="i18n: $data.destinationType === 'Topic' ? 'optionsPerQueueEtl:topic.addOptions' : 'optionsPerQueueEtl:queue.addOptions'"></span>
        </button>
    </div>
</div>
<div class="margin-bottom">
    <div class="text-center text-muted" data-bind="if: optionsPerQueue().length === 0">
        <i class="icon-lg icon-empty-set"></i>
        <h3 class="margin-top margin-top-sm" data-bind="i18n: 'optionsPerQueueEtl:noOptions'"></h3>
    </div>
    <div data-bind="foreach: optionsPerQueue">
        <div class="flex-horizontal margin-bottom-sm item">
            <div class="flex-grow margin-right" data-bind="validationElement: queueName">
                <input type="text" class="form-control" data-bind="textInput: queueName, i18nAttr: { placeholder: $parent.destinationType === 'Topic' ? 'optionsPerQueueEtl:topic.namePlaceholder' : 'optionsPerQueueEtl:queue.namePlaceholder' }"/>
            </div>
            <div class="toggle input-sm flex-shrink-0">
                <input id="toggleMode" class="styled" type="checkbox" data-bind="checked: deleteProcessedDocuments">
                <label for="toggleMode" data-bind="i18n: 'optionsPerQueueEtl:deleteProcessedDocuments'"></label>
            </div>
            <div class="">
                <a href="#" class="btn" data-bind="click: $parent.removeQueueOptions.bind($parent, $data), i18nAttr: { title: $parent.destinationType === 'Topic' ? 'optionsPerQueueEtl:topic.removeTitle' : 'optionsPerQueueEtl:queue.removeTitle' }">
                    <i class="icon-trash"></i>
                </a>
            </div>
        </div>
    </div>
    <div data-bind="validationElement: optionsPerQueue">
        <div class="help-block margin-bottom-sm" data-bind="validationMessage: optionsPerQueue"></div>
    </div>
</div>
