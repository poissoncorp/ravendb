<div class="content-margin edit-replication-task edit-ongoing-task">
    <form class="flex-form" data-bind="submit: saveExternalReplication">
        <div class="align-items-center justify-content-between d-flex gap-2 margin-bottom-md padding-top-xs">
            <div class="flex-horizontal gap-2">
                <i class="icon-pull-replication-agent"></i>
                <h2 data-bind="i18n: { key: 'editExternalReplicationTask:heading', options: { context: $root.isAddingNewReplicationTask() ? 'new' : 'edit' } }" class="mb-0"></h2>
                <span class="badge license-restricted-badge professional" data-bind="if: !$root.hasExternalReplication">Professional +</span>
            </div>
            <div class="flex-end margin-right-xs" data-bind="react: $root.infoHubView"></div>
        </div>
        <div class="row flex-row">
            <div class="col-xs-12 col-lg-6 flex-vertical">
                <div class="flex-header">
                    <span data-placement="right" data-toggle="tooltip" data-html="true" data-animation="true"
                        data-bind="tooltipText: $root.hasExternalReplication ? null : $root.licenseRestrictedTooltip">
                        <button type="submit" class="btn btn-primary" data-bind="disable: $root.spinners.save() || !$root.dirtyFlag().isDirty(), css: { 'btn-spinner': $root.spinners.save }">
                            <i class="icon-save"></i><span data-bind="i18n: 'common:save'"></span>
                        </button>
                    </span>
                    <button data-bind="click: cancelOperation, i18nAttr: { title: 'editExternalReplicationTask:cancelTitle' }" class="btn btn-default">
                        <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                    </button>
                </div>
                <div class="panel" data-bind="css: { 'pe-none item-disabled': !$root.hasExternalReplication }">
                    <div class="panel-body" data-bind="with: editedExternalReplication">
                        <div class="form-group margin-top" data-bind="validationElement: taskName">
                            <label for="taskName" class="control-label" data-bind="i18n: 'editExternalReplicationTask:taskName'"></label>
                            <div class="flex-grow">
                                <input type="text" class="form-control" data-bind="textInput: taskName, i18nAttr: { placeholder: 'editExternalReplicationTask:taskNamePlaceholder' }" id="taskName" autocomplete="off">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label" data-bind="i18n: 'editExternalReplicationTask:taskState'"></label>
                            <div class="flex-grow">
                                <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                                    <span data-bind="text: stateText()"></span>
                                    <span class="caret"></span>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Enabled')"><span data-bind="i18n: 'editExternalReplicationTask:stateEnabled'"></span></a></li>
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Disabled')"><span data-bind="i18n: 'editExternalReplicationTask:stateDisabled'"></span></a></li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editExternalReplicationTask:delayTimeTitle' }" data-animation="true">
                                <input id="setDelayTime" type="checkbox" data-bind="checked: showDelayReplication">
                                <label for="setDelayTime" data-bind="i18n: 'editExternalReplicationTask:setDelayTime'"></label>
                            </div>
                        </div>
                        <div data-bind="validationElement: delayReplicationTime, collapse: showDelayReplication">
                            <div class="form-group">
                                <div>
                                    <label class="control-label" data-bind="i18n: 'editExternalReplicationTask:delayTime'"></label>
                                </div>
                                <div class="flex-grow" data-bind="validationElement: delayReplicationTime">
                                    <input type="text" class="form-control" data-bind="durationPicker: delayReplicationTime, durationPickerOptions: { showDays: true, showSeconds: true }" />
                                    <div class="help-block" data-bind="validationMessage: delayReplicationTime"></div>
                                </div>
                            </div>
                        </div>
                        <div data-bind="collapse: humaneDelayDescription">
                            <div class="form-group margin-bottom">
                                <label class="control-label">&nbsp;</label>
                                <div class="bg-info padding padding-sm small flex-horizontal">
                                    <div><i class="icon-info"></i></div>
                                    <div data-bind="html: humaneDelayDescription"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: $root.db.isSharded() ? 'editExternalReplicationTask:responsibleNodeNotSupportedSharded' : 'editExternalReplicationTask:responsibleNodeTitle' }"
                                 data-animation="true">
                                <input id="responsibleNode" type="checkbox" data-bind="checked: manualChooseMentor, disable: $root.possibleMentors().length === 0 || $root.db.isSharded()">
                                <label for="responsibleNode" data-bind="i18n: 'editExternalReplicationTask:setResponsibleNode'"></label>
                            </div>
                        </div>
                        <div data-bind="compose: $root.taskResponsibleNodeSectionView"></div>
                        <div class="form-group">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle">
                                <input id="createNewString" type="checkbox" data-bind="checked: $root.createNewConnectionString">
                                <label for="createNewString" data-bind="i18n: 'editExternalReplicationTask:createNewConnectionString'"></label>
                            </div>
                        </div>
                        <div data-bind="collapse: $root.createNewConnectionString, with: $root.newConnectionString"> 
                            <div class="form-group">
                                <div class="flex-grow" data-bind="compose: $root.connectionStringView"></div>
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationOptions: { insertMessages: false }, validationElement: connectionStringName, visible: !$root.createNewConnectionString()">
                            <label class="control-label" data-bind="i18n: 'editExternalReplicationTask:connectionString.label'"></label>
                            <div class="flex-grow">
                                <button class="btn btn-block dropdown-toggle text-left" type="button" data-toggle="dropdown"
                                        data-bind="textInput: connectionStringName, disable: $root.ravenEtlConnectionStringsDetails().length === 0,
                                                   i18nAttr: { 'title': $root.ravenEtlConnectionStringsDetails().length === 0 ? 'editExternalReplicationTask:connectionString.noneDefinedTitle' : 'editExternalReplicationTask:connectionString.select' }">
                                    <span data-bind="text: connectionStringName"></span><span data-bind="i18n: connectionStringName() ? null : 'editExternalReplicationTask:connectionString.select'"></span>
                                    <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
                                </button>
                                <ul class="dropdown-menu"
                                    data-bind="foreach: $root.ravenEtlConnectionStringsDetails">
                                    <li data-bind="click: _.partial($root.useConnectionString, $data.Name)">
                                        <a href="#">
                                            <div class="row">
                                                <strong class="col-xs-7" data-bind="text: $data.Name"></strong>
                                                <small class="col-xs-2" data-bind="i18n: 'editExternalReplicationTask:connectionString.destinationDb'"></small>
                                                <small class="col-xs-3" data-bind="text: $data.Database"></small>
                                            </div>
                                        </a>
                                    </li>
                                </ul>
                                <span class="help-block" data-bind="validationMessage: connectionStringName"></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div data-bind="if: createNewConnectionString">
                            <div class="panel-addon" data-bind="with: testConnectionResult">
                                <div class="padding bg-success small" data-bind="visible: Success">
                                    <div data-bind="i18n: 'editExternalReplicationTask:testConnection.success'"></div>
                                </div>
                                <div data-bind="if: !Success">
                                    <div class="padding bg-danger small">
                                        <h2 data-bind="i18n: 'editExternalReplicationTask:testConnection.failed'"></h2>
                                        <span data-bind="text: $root.fullErrorDetailsVisible() ? Error : $root.shortErrorText()"></span>
                                        <div>
                                            <a href="#" data-bind="click: $root.fullErrorDetailsVisible.toggle.bind($root.fullErrorDetailsVisible), i18n: { key: 'editExternalReplicationTask:testConnection.details', options: { context: $root.fullErrorDetailsVisible() ? 'hide' : 'show' } }"></a>
                                        </div>
                                    </div>
                                    <div class="padding bg-info small">
                                        <h2 data-bind="i18n: 'editExternalReplicationTask:testConnection.aboutError'"></h2>
                                        <div data-bind="i18n: 'editExternalReplicationTask:testConnection.endpoints'"></div>
                                        <div data-bind="i18n: 'editExternalReplicationTask:testConnection.tcpAfterHttp'"></div>
                                        <div data-bind="visible: HTTPSuccess, i18n: 'editExternalReplicationTask:testConnection.httpSucceeded'"></div>
                                        <div data-bind="visible: !HTTPSuccess, i18n: 'editExternalReplicationTask:testConnection.httpFailed'"></div>
                                        <div>
                                            <span data-bind="i18n: 'editExternalReplicationTask:testConnection.pleaseVerify'"></span>
                                            <ul>
                                                <li data-bind="i18n: 'editExternalReplicationTask:testConnection.urlCorrect'"></li>
                                                <li data-bind="i18n: 'editExternalReplicationTask:testConnection.machinesRunning'"></li>
                                                <li data-bind="i18n: 'editExternalReplicationTask:testConnection.noFirewall'"></li>
                                                <li data-bind="i18n: 'editExternalReplicationTask:testConnection.noNetworkConfig'"></li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="panel-addon">
                            <div class="padding text-warning bg-warning small" data-bind="visible: ravenEtlConnectionStringsDetails().length === 0 && !createNewConnectionString()">
                                <i class="icon-warning"></i>&nbsp;&nbsp;<span data-bind="i18n: 'editExternalReplicationTask:connectionString.noneDefinedYet'"></span>
                            </div>
                            <div data-bind="visible: usingHttps">
                                <div data-bind="compose: $root.certificateUploadInfoForOngoingTasks"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
