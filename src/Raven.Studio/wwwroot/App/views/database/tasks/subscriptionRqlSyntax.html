<div class="modal-dialog" role="document" id="subscriptionRqlSyntaxDialog">
    <div class="modal-content">
        <div class="modal-body">
            <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'editSubscriptionTask:close' }"><i class="icon-cancel"></i></button>
            <h3 data-bind="i18n: 'editSubscriptionTask:rqlSyntax.heading'"></h3>
            <hr />
            <div data-bind="foreach: $data.constructor.samples">
                <div class="margin-top" data-bind="text: title"></div>
                <pre class="margin-bottom copy-area"><a href="#" class="copy-button-hidden" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'editSubscriptionTask:rqlSyntax.copyTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
            </div>
        </div>
        <div class="modal-footer margin-bottom">
            <div class="text-left bg-info text-info padding padding-xs">
                <ul class="margin-top">
                    <li data-bind="html: noteHtml"></li>
                    <li><span data-bind="i18n: 'editSubscriptionTask:rqlSyntax.moreExamples'"></span><br />
                        <a href="https://ravendb.net/l/S3QT51" target="_blank" data-bind="i18n: 'editSubscriptionTask:rqlSyntax.creationExamplesLink'"></a><br />
                        <a href="https://ravendb.net/l/OC3JL4" target="_blank" data-bind="i18n: 'editSubscriptionTask:rqlSyntax.revisionsSupportLink'"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
