<div class="row margin-bottom" data-bind="validationElement: vaultName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4">
        <span data-bind="i18n: 'glacierSettings:vaultName'"></span> <i class="required"></i> <small><i class="vault-info icon-info text-info"></i></small>
    </label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: vaultName" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: remoteFolderName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 'glacierSettings:remoteFolderName'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: remoteFolderName" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: awsRegionName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="i18n: 'glacierSettings:region'"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8" data-bind="validationOptions: { insertMessages: false }">
        <div class="dropdown btn-block">
            <input type="text" class="form-control dropdown-toggle" data-toggle="dropdown"
                   id="glacierRegionInput"
                   data-bind="textInput: selectedAwsRegion, i18nAttr: { placeholder: 'glacierSettings:regionPlaceholder' }">
            <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
            <ul class="dropdown-menu" data-bind="foreach: createAwsRegionAutoCompleter(false), autoComplete: '#' + 'glacierRegionInput'">
                <li data-bind="click: $parent.useAwsRegion.bind($parent, $data)">
                    <a href="#" data-bind="text: $data.label + ' - ' + $data.value"></a>
                </li>
            </ul>
        </div>
        <span class="help-block" data-bind="validationMessage: awsRegionName"></span>
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: awsAccessKey">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="i18n: 'glacierSettings:accessKey'"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: awsAccessKey" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: awsSecretKey">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="i18n: 'glacierSettings:secretKey'"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <div class="input-group flex-grow">
            <input data-bind="textInput: awsSecretKey, attr: { type: isSecretHidden() ? 'password' : 'text' }" class="form-control" />
            <button type="button" class="btn btn-default" data-bind="click: toggleIsSecretHidden, visible: isSecretHidden(), i18nAttr: { title: 'glacierSettings:viewHiddenCharactersTitle' }">
                <i class="icon-preview"></i>
            </button>
            <button type="button" class="btn btn-info" data-bind="click: toggleIsSecretHidden, visible: !isSecretHidden(), i18nAttr: { title: 'glacierSettings:hideCharactersTitle' }">
                <i class="icon-preview-off"></i>
            </button>
        </div>
    </div>
</div>
<div class="row margin-bottom" data-bind="visible: targetOperation === 'ManualBackup'">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 'glacierSettings:sessionToken'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <div class="input-group flex-grow">
            <input data-bind="textInput: awsSessionToken, attr: { type: isSessionTokenHidden() ? 'password' : 'text' }" class="form-control" />
            <button type="button" class="btn btn-default" data-bind="click: toggleIsSessionTokenHidden, visible: isSessionTokenHidden(), i18nAttr: { title: 'glacierSettings:viewHiddenCharactersTitle' }">
                <i class="icon-preview"></i>
            </button>
            <button type="button" class="btn btn-info" data-bind="click: toggleIsSessionTokenHidden, visible: !isSessionTokenHidden(), i18nAttr: { title: 'glacierSettings:hideCharactersTitle' }">
                <i class="icon-preview-off"></i>
            </button>
        </div>
    </div>
</div>
