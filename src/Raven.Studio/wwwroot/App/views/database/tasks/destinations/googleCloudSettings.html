<div class="row margin-bottom" data-bind="validationElement: bucket">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4">
        <span data-bind="i18n: 'googleCloudSettings:bucket'"></span> <i class="required"></i> <small><i class="bucket-gcs-info icon-info text-info"></i></small>
    </label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: bucket" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: remoteFolderName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 'googleCloudSettings:remoteFolderName'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: remoteFolderName" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: googleCredentialsJson">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="i18n: 'googleCloudSettings:credentialsJson'"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <textarea rows="9" data-bind="textInput: googleCredentialsJson, visible: credentialsVisible, i18nAttr: { placeholder: { key: 'googleCloudSettings:credentialsPlaceholder', options: { example: credentialsExample } } }" class="form-control"></textarea>
        <button class="btn btn-default margin-right-xs" data-bind="click: toggleCredentials, visible: !credentialsVisible(), i18nAttr: { title: 'googleCloudSettings:viewCredentialsTitle' }">
            <i class="icon-preview"></i> <span data-bind="i18n: 'googleCloudSettings:showCredentials'"></span>
        </button>
        <button class="btn btn-info margin-right-xs" data-bind="click: toggleCredentials, visible: credentialsVisible, i18nAttr: { title: 'googleCloudSettings:hideCredentials' }">
            <i class="icon-preview-off"></i> <span data-bind="i18n: 'googleCloudSettings:hideCredentials'"></span>
        </button>
        
    </div>
</div>
