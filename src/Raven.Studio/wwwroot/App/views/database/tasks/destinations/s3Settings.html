<div class="row margin-bottom" data-bind="collapse: useCustomS3Host">
    <div class="col-xs-offset-12 col-sm-offset-6 col-lg-offset-4">
        <div class="toggle margin-left">
            <input id="s3ForcePathStyle" type="checkbox" data-bind="checked: forcePathStyle">
            <label for="s3ForcePathStyle" data-bind="i18n: 's3Settings:forcePathStyle'"></label>
            <small data-toggle="tooltip" 
                   data-animation="true" 
                   data-bind="i18nAttr: { title: 's3Settings:forcePathStyleTitle' }">
                <i class="icon-info text-info"></i>
            </small>
        </div>
    </div>
    <div class="col-xs-offset-12 col-sm-offset-6 col-lg-offset-4">
        <div class="toggle margin-left">
            <input id="disableChecksumValidation" type="checkbox" data-bind="checked: disableChecksumValidation">
            <label for="disableChecksumValidation" data-bind="i18n: 's3Settings:disableChecksumValidation'"></label>
            <small data-toggle="tooltip"
                   data-animation="true"
                   data-bind="i18nAttr: { title: 's3Settings:disableChecksumValidationTitle' }">
                <i class="icon-info text-info"></i>
            </small>
        </div>
    </div>
</div>

<div class="row margin-bottom" data-bind="validationElement: customServerUrl, collapse: useCustomS3Host">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4">
        <span data-bind="i18n: 's3Settings:customServerUrl'"></span> <i class="required"></i>
    </label>
    <div class="col-xs-12 col-sm-6 col-lg-8" data-bind="validationElement: customServerUrl">
        <input data-bind="textInput: customServerUrl" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: bucketName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4">
        <span data-bind="i18n: 's3Settings:bucketName'"></span> <i class="required"></i> <small><i class="icon-info text-info bucket-info"></i></small>
    </label>
    <div class="col-xs-12 col-sm-6 col-lg-8" data-bind="validationElement: bucketName">
        <input data-bind="textInput: bucketName" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: remoteFolderName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 's3Settings:remoteFolderName'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input data-bind="textInput: remoteFolderName" type="text" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: storageClass, visible: targetOperation !== 'OLAP'">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 's3Settings:storageClass'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" data-bind="i18nAttr: { title: 's3Settings:storageClassTitle' }">
            <span data-bind="text: storageClassLabel"></span>&nbsp;&nbsp;<span class="caret"></span>
        </button>
        <ul class="dropdown-menu margin-left-sm" data-bind="foreach: storageClassOptions">
            <li data-bind="click: $parent.storageClass.bind($parent, value)">
                <a href="#" data-bind="text: label"></a>
            </li>
        </ul>
    </div>
</div>
<div class="row margin-bottom" data-bind="visible: useCustomS3Host">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 's3Settings:region'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <input type="text" class="form-control" data-bind="textInput: selectedAwsRegion">
    </div>
</div>
<div class="row margin-bottom" data-bind="visible: !useCustomS3Host(), validationElement: awsRegionName">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="i18n: 's3Settings:region'"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8" data-bind="validationOptions: { insertMessages: false }">
        <div class="dropdown btn-block">
            <input type="text" class="form-control dropdown-toggle" data-toggle="dropdown"
                   id="s3RegionInput"
                   data-bind="textInput: selectedAwsRegion, i18nAttr: { placeholder: 's3Settings:regionPlaceholder' }">
            <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
            <ul class="dropdown-menu" data-bind="foreach: createAwsRegionAutoCompleter(true), autoComplete: '#' + 's3RegionInput'">
                <li data-bind="click: $parent.useAwsRegion.bind($parent, $data)">
                    <a href="#" data-bind="text: $data.label + ' - ' + $data.value"></a>
                </li>
            </ul>
        </div>
        <span class="help-block" data-bind="validationMessage: awsRegionName"></span>
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: awsAccessKey">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="text: accessKeyPropertyName"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8" data-bind="validationElement: awsAccessKey">
        <input data-bind="textInput: awsAccessKey" class="form-control" />
    </div>
</div>
<div class="row margin-bottom" data-bind="validationElement: awsSecretKey">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4"><span data-bind="text: secretKeyPropertyName"></span> <i class="required"></i></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <div class="input-group flex-grow">
            <input data-bind="textInput: awsSecretKey, attr: { type: isSecretHidden() ? 'password' : 'text' }" class="form-control" />
            <button type="button" class="btn btn-default" data-bind="click: toggleIsSecretHidden, visible: isSecretHidden(), i18nAttr: { title: 's3Settings:viewHiddenCharactersTitle' }">
                <i class="icon-preview"></i>
            </button>
            <button type="button" class="btn btn-info" data-bind="click: toggleIsSecretHidden, visible: !isSecretHidden(), i18nAttr: { title: 's3Settings:hideCharactersTitle' }">
                <i class="icon-preview-off"></i>
            </button>
        </div>
    </div>
</div>
<div class="row margin-bottom"  data-bind="visible: targetOperation === 'ManualBackup'">
    <label class="control-label col-xs-12 col-sm-6 col-lg-4" data-bind="i18n: 's3Settings:sessionToken'"></label>
    <div class="col-xs-12 col-sm-6 col-lg-8">
        <div class="input-group flex-grow">
            <input data-bind="textInput: awsSessionToken, attr: { type: isSessionTokenHidden() ? 'password' : 'text' }" class="form-control" />
            <button type="button" class="btn btn-default" data-bind="click: toggleIsSessionTokenHidden, visible: isSessionTokenHidden(), i18nAttr: { title: 's3Settings:viewHiddenCharactersTitle' }">
                <i class="icon-preview"></i>
            </button>
            <button type="button" class="btn btn-info" data-bind="click: toggleIsSessionTokenHidden, visible: !isSessionTokenHidden(), i18nAttr: { title: 's3Settings:hideCharactersTitle' }">
                <i class="icon-preview-off"></i>
            </button>
        </div>
    </div>
</div>
