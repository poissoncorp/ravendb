<div class="migrate-ravendb-database">
    <div class="panel padding padding-md" data-bind="visible: $root.activeDatabase().isSharded()">
        <div>
            <div class="empty-set text-center margin-top-sm margin-bottom-sm mx-auto">
                <i class="icon-disabled text-warning icon-xl m-0"></i>
                <div class="lead">
                    <div class="vstack gap-3">
                        <span>
                            <div class="rounded-pill badge bg-faded-warning" data-bind="i18n: 'migrateRavenDbDatabase:sharded.featureNotAvailable'"></div>
                        </span>
                        <span data-bind="html: shardedNotAvailableHtml"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="panel" data-bind="visible: !$root.activeDatabase().isSharded()">
        <div class="panel-body">
            <form class="flex-form" data-bind="submit: migrateDb" autocomplete="off">
                <div class="row">
                    <div class="col-sm-9 col-lg-7 col-xl-6">
                        <h3 data-bind="i18n: 'migrateRavenDbDatabase:title'"></h3>
                        <div class="bg-warning text-warning padding padding-xs margin-top margin-bottom">
                            <small><i class="icon-warning"></i><span data-bind="i18n: 'migrateRavenDbDatabase:overwriteWarning'"></span></small>
                        </div>
                    </div>
                </div>
                <div class="row" data-bind="with: model">
                    <div class="col-sm-8 col-lg-6 margin-top">
                        <div class="form-group" data-bind="validationElement: serverUrl">
                            <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:serverUrl.label'"></label>
                            <div class="flex-grow">
                                <div class="flex-grow">
                                    <div class="dropdown btn-block">
                                        <input type="text" class="form-control dropdown-toggle" data-toggle="dropdown"
                                               id="server-url"
                                               data-bind="textInput: serverUrl, i18nAttr: { placeholder: 'migrateRavenDbDatabase:serverUrl.placeholder' }" />
                                        <ul class="dropdown-menu" data-bind="foreach: createServerUrlAutoCompleter(), autoComplete: '#server-url'">
                                            <li data-bind="click: $parent.selectServerUrl.bind($parent, $data)">
                                                <a href="#" data-bind="text: $data"></a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="form-group" data-bind="visible: isSecuredConnection">
                                <label class="control-label"></label>
                                <div class="toggle">
                                    <input class="styled" type="checkbox" id="skip-server-certificate-validation" data-bind="checked: skipServerCertificateValidation" />
                                    <label for="skip-server-certificate-validation" data-bind="i18n: 'migrateRavenDbDatabase:skipServerCertificateValidation'"></label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationElement: serverMajorVersion">
                            <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:serverVersion'"></label>
                            <div class="flex-grow">
                                <div class="form-control-static">
                                    <div data-bind="text: serverMajorVersionNumber, visible: !$root.spinners.versionDetect() && serverMajorVersionNumber()"></div>
                                    <div data-bind="visible: $root.spinners.versionDetect">
                                        <i class="global-spinner spinner-sm"></i>
                                    </div>
                                </div>
                                <div>
                                    <div class="help-block" data-bind="validationMessage: serverMajorVersion"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group" data-bind="visible: hasRavenFs">
                            <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:resourceType.label'"></label>
                            <div class="flex-grow" data-bind="validationElement: authenticationMethod">
                                <div class="btn-group">
                                    <button type="button" class="btn btn-default"
                                            data-bind="click: _.partial(importRavenFs, false), css: { active: !importRavenFs() }, i18n: 'migrateRavenDbDatabase:resourceType.database'">
                                    </button>
                                    <button type="button" class="btn btn-default"
                                            data-bind="click: _.partial(importRavenFs, true), css: { active: importRavenFs }">
                                        RavenFS
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationElement: resourceName">
                            <label class="control-label" data-bind="i18n: { key: 'migrateRavenDbDatabase:resourceName.label', options: { context: ravenFsImport() ? 'fileSystem' : 'database' } }"></label>
                            <div class="flex-grow">
                                <div class="dropdown btn-block">
                                    <input type="text"
                                           class="form-control dropdown-toggle"
                                           data-toggle="dropdown"
                                           id="resource-name"
                                           data-bind="textInput: resourceName, i18nAttr: { placeholder: { key: 'migrateRavenDbDatabase:resourceName.placeholder', options: { context: ravenFsImport() ? 'fileSystem' : 'database' } } }" />
                                    <ul class="dropdown-menu" data-bind="foreach: createResourceNamesAutoCompleter(), autoComplete: '#resource-name'">
                                        <li data-bind="click: $parent.selectResourceName.bind($parent, $data)">
                                            <a href="#" data-bind="text: $data"></a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div data-bind="visible: isLegacy">
                            <div class="form-group">
                                <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:authentication.label'"></label>
                                <div class="flex-grow" data-bind="validationElement: authenticationMethod">
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-default"
                                                data-bind="click: _.partial(authenticationMethod, 'none'), css: { active: authenticationMethod() === 'none' }, i18n: 'migrateRavenDbDatabase:authentication.none'">
                                        </button>
                                        <button type="button" class="btn btn-default"
                                                data-bind="click: _.partial(authenticationMethod, 'apiKey'), css: { active: authenticationMethod() === 'apiKey' }, i18n: 'migrateRavenDbDatabase:authentication.apiKey'">
                                        </button>
                                        <button type="button" class="btn btn-default"
                                                data-bind="click: _.partial(authenticationMethod, 'windows'), css: { active: authenticationMethod() === 'windows' }, i18n: 'migrateRavenDbDatabase:authentication.windowsCredentials'">
                                        </button>
                                    </div>
                                    <span data-bind="visible: $root.spinners.getResourceNames">
                                        <i class="global-spinner spinner-sm"></i>
                                    </span>
                                </div>
                            </div>
                            <div data-bind="visible: showWindowsCredentialInputs, if: showWindowsCredentialInputs">
                                <div class="form-group" data-bind="validationElement: userName">
                                    <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:authentication.userName'"></label>
                                    <div class="flex-grow">
                                        <input data-bind="textInput: userName, i18nAttr: { placeholder: 'migrateRavenDbDatabase:authentication.userName' }" type="text" class="form-control" />
                                    </div>
                                </div>
                                <div class="form-group" data-bind="validationElement: password">
                                    <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:authentication.password'"></label>
                                    <div class="flex-grow">
                                        <input data-bind="textInput: password, i18nAttr: { placeholder: 'migrateRavenDbDatabase:authentication.password' }" type="password" class="form-control" />
                                    </div>
                                </div>
                                <div class="form-group" data-bind="validationElement: domain">
                                    <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:authentication.domain'"></label>
                                    <div class="flex-grow">
                                        <input data-bind="textInput: domain, i18nAttr: { placeholder: 'migrateRavenDbDatabase:authentication.domain' }" type="text" class="form-control" />
                                    </div>
                                </div>
                            </div>
                            <div data-bind="visible: showApiKeyCredentialInputs, if: showApiKeyCredentialInputs">
                                <div class="form-group" data-bind="validationElement: apiKey">
                                    <label class="control-label" data-bind="i18n: 'migrateRavenDbDatabase:authentication.apiKey'"></label>
                                    <div class="flex-grow">
                                        <input data-bind="textInput: apiKey, i18nAttr: { placeholder: 'migrateRavenDbDatabase:authentication.apiKey' }" type="password" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group" data-bind="visible: isUnsecuredBasicAuthentication">
                                    <label class="control-label"></label>
                                    <div class="toggle">
                                        <input class="styled" type="checkbox" id="basic-authentication" data-bind="checked: enableBasicAuthenticationOverUnsecuredHttp" />
                                        <label for="basic-authentication" data-bind="i18n: 'migrateRavenDbDatabase:authentication.basicOverUnsecuredHttp'"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div data-bind="with: model" style="margin-left: 160px">
                    <div data-bind="visible: isRavenDb() && !ravenFsImport()">
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="toggle">
                                    <input id="migrate_documents" type="checkbox" data-bind="checked: includeDocuments" />
                                    <label for="migrate_documents" data-bind="i18n: 'migrateRavenDbDatabase:include.documents'"></label>
                                </div>
                                <div class="margin-left">
                                    <div class="toggle" data-bind="visible: isLegacy">
                                        <input id="migrate_legacy_attachments" type="checkbox" data-bind="checked: includeLegacyAttachments" />
                                        <label for="migrate_legacy_attachments" data-bind="i18n: 'migrateRavenDbDatabase:include.legacyAttachments'"></label>
                                    </div>
                                    <div class="toggle" data-bind="visible: !isLegacy()">
                                        <input id="migrate_attachments" type="checkbox" data-bind="checked: includeAttachments" />
                                        <label for="migrate_attachments" data-bind="i18n: 'migrateRavenDbDatabase:include.attachments'"></label>
                                    </div>
                                    <div class="toggle" data-bind="visible: isV42orAbove">
                                        <input id="migrate_counters" type="checkbox" data-bind="checked: includeCounters" />
                                        <label for="migrate_counters" data-bind="i18n: 'migrateRavenDbDatabase:include.counters'"></label>
                                    </div>
                                    <div class="toggle" data-bind="visible: isV50orAbove">
                                        <input id="migrate_time_series" type="checkbox" data-bind="checked: includeTimeSeries" />
                                        <label for="migrate_time_series" data-bind="i18n: 'migrateRavenDbDatabase:include.timeSeries'"></label>
                                    </div>
                                    <div class="toggle" data-toggle="tooltip" data-placement="top">
                                        <input id="migrate_revisions" type="checkbox" data-bind="checked: includeRevisionDocuments" />
                                        <label for="migrate_revisions" data-bind="i18n: 'migrateRavenDbDatabase:include.revisions'"></label>
                                    </div>
                                    <div class="toggle" data-bind="visible: !isLegacy()">
                                        <input id="migrate_conflicts" type="checkbox" data-bind="checked: includeConflicts" />
                                        <label for="migrate_conflicts" data-bind="i18n: 'migrateRavenDbDatabase:include.conflicts'"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-5">
                                <div class="toggle">
                                    <input id="migrate_indexes" type="checkbox" data-bind="checked: includeIndexes" />
                                    <label for="migrate_indexes" data-bind="i18n: 'migrateRavenDbDatabase:include.indexes'"></label>
                                </div>
                                <div class="margin-left">
                                    <div class="toggle">
                                        <input id="toggleIndexHistory" type="checkbox"
                                               data-bind="checked: databaseModel.includeIndexHistory, enable: includeIndexes" />
                                        <label for="toggleIndexHistory" data-bind="i18n: 'migrateRavenDbDatabase:include.indexHistory'"></label>
                                    </div>
                                    <div class="toggle">
                                        <input id="migrate_remove_analyzers" type="checkbox"
                                               data-bind="checked: removeAnalyzers, enable: includeIndexes" />
                                        <label for="migrate_remove_analyzers" data-bind="i18n: 'migrateRavenDbDatabase:include.removeAnalyzers'"></label>
                                    </div>
                                </div>
                                <div class="toggle" data-bind="visible: !isLegacy()">
                                    <input id="migrate_identities" type="checkbox" data-bind="checked: includeIdentities" />
                                    <label for="migrate_identities" data-bind="i18n: 'migrateRavenDbDatabase:include.identities'"></label>
                                </div>
                                <div class="toggle" data-bind="visible: !isLegacy()">
                                    <input id="migrate_cmp_xch" type="checkbox" data-bind="checked: includeCompareExchange" />
                                    <label for="migrate_cmp_xch" data-bind="i18n: 'migrateRavenDbDatabase:include.compareExchange'"></label>
                                </div>
                                <div class="toggle">
                                    <input id="migrate_Subscriptions" type="checkbox" data-bind="checked: includeSubscriptions" />
                                    <label for="migrate_Subscriptions" class="margin-right margin-right-sm" data-bind="i18n: 'migrateRavenDbDatabase:include.subscriptions'"></label>
                                </div>
                                <div class="flex-horizontal" data-bind="visible: !isLegacy()">
                                    <div class="toggle">
                                        <input id="migrate_Configuration" type="checkbox" data-bind="checked: includeDatabaseRecord" />
                                        <label for="migrate_Configuration" class="margin-right margin-right-sm" data-bind="i18n: 'migrateRavenDbDatabase:include.configuration'"></label>
                                    </div>
                                    <button class="btn btn-sm margin-right margin-right-sm" data-bind="enable: includeDatabaseRecord, click: $root.customizeConfigurationClicked, i18n: 'migrateRavenDbDatabase:include.customize'"></button>
                                    <small id="js-ongoing-tasks-disabled"><i class="icon-info text-info"></i></small>
                                </div>
                            </div>
                        </div>
                        <div data-bind="validationElement: importDefinitionHasIncludes">
                            <div class="help-block" data-bind="validationMessage: importDefinitionHasIncludes"></div>
                        </div>
                    </div>
                </div>
                <div data-bind="collapse: showAdvancedOptions">
                    <hr />
                    <h3 data-bind="i18n: 'migrateRavenDbDatabase:advanced.title'"></h3>
                    <div class="margin-left">
                        <div data-bind="with: model">
                            <div data-bind="visible: enableAdvanced">
                                <div class="form-group">
                                    <div class="toggle">
                                        <input class="styled" type="checkbox" id="use-transform-script" data-bind="checked: showTransformScript">
                                        <label for="use-transform-script" class="margin-right margin-right-sm" data-bind="i18n: 'migrateRavenDbDatabase:advanced.useTransformScript'"></label>
                                        <small id="scriptPopover"><i class="icon-info text-info"></i></small>
                                    </div>
                                </div>
                                <div class="flex-grow" data-bind="collapse: showTransformScript">
                                <pre class="form-control editor query-source" style="height: 200px;"
                                     data-bind="aceEditor: { code: transformScript, allowResize: false, lang:'ace/mode/javascript' }">
                                </pre>
                                </div>
                            </div>
                            <div data-bind="with: databaseModel, visible: enableAdvanced">
                                <div data-bind="compose: $root.smugglerDatabaseRecordView"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr />
                <span class="has-disable-reason" data-placement="bottom"
                      data-bind="attr: { 'data-original-title': model.enableAdvanced() ? '': advancedDisabledReason }">
                    <button class="btn btn-default" type="button"
                            data-bind="click: showAdvancedOptions.toggle.bind(showAdvancedOptions), enable: model.enableAdvanced(), i18n: 'migrateRavenDbDatabase:advanced.button'">
                    </button>
                </span>
                <button class="btn btn-primary" type="submit" data-bind="css: { 'btn-spinner': spinners.migration() }, disable: spinners.migration">
                    <span class="icon-import"></span> <span data-bind="i18n: 'migrateRavenDbDatabase:migrate'"></span>
                </button>
            </form>
        </div>
    </div>
</div>
