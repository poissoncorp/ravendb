<div class="content-margin edit-pull-replication-sink-task edit-ongoing-task">
    <form class="flex-form" data-bind="submit: saveTask" autocomplete="off">
        <div class="align-items-center justify-content-between d-flex gap-2 margin-bottom-md padding-top-xs">
            <div class="flex-horizontal gap-2">
                <i class="icon-pull-replication-agent"></i>
                <h2 data-bind="i18n: { key: 'editReplicationSinkTask:heading', options: { context: $root.isAddingNewTask() ? 'new' : 'edit' } }" class="mb-0"></h2>
                <span class="badge license-restricted-badge professional" data-bind="if: !hasPullReplicationAsSink">Professional +</span>
            </div>
            <div class="flex-end margin-right-xs" data-bind="react: $root.infoHubView"></div>
        </div>
        <div class="row flex-row">
            <div class="col-xs-12 col-lg-6 flex-vertical">
                <div class="flex-header flex-horizontal">
                    <span data-placement="right" data-toggle="tooltip" data-html="true" data-animation="true"
                        data-bind="tooltipText: $root.hasPullReplicationAsSink ? null : $root.licenseRestrictedTooltip">
                        <button type="submit" class="btn btn-primary"
                            data-bind="disable: $root.spinners.save() || !$root.dirtyFlag().isDirty(), css: { 'btn-spinner': $root.spinners.save }">
                            <i class="icon-save"></i><span data-bind="i18n: 'common:save'"></span>
                        </button>
                    </span>
                    <button data-bind="click: cancelOperation, i18nAttr: { title: 'editReplicationSinkTask:cancelTitle' }" class="btn btn-default margin-left-xxs">
                        <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                    </button>
                    <div class="flex-separator"></div>
                    <div class="input-group file-input" data-bind="i18nAttr: { title: 'editReplicationSinkTask:importConfigurationTitle' }">
                        <input type="file" id="configurationFilePicker" 
                               data-bind="event: { change: _.partial($root.onConfigurationFileSelected, $element) }" tabindex="-1" accept=".json" />
                    </div>
                    <label for="configurationFilePicker" class="btn btn-default" data-bind="visible: !canDefineCertificates, css: { 'pe-none item-disabled': !$root.hasPullReplicationAsSink }">
                        <i class="icon-import"></i><span data-bind="i18n: 'editReplicationSinkTask:importConfiguration'"></span>
                    </label>
                </div>
                <div class="panel" data-bind="css: { 'pe-none item-disabled': !$root.hasPullReplicationAsSink }">
                    <div class="panel-body" data-bind="with: editedSinkTask">
                        <div class="form-group margin-top" data-bind="validationElement: taskName">
                            <label for="taskName" class="control-label" data-bind="i18n: 'editReplicationSinkTask:task.nameLabel'"></label>
                            <div class="flex-grow">
                                <input type="text" class="form-control" data-bind="textInput: taskName, i18nAttr: { placeholder: 'editReplicationSinkTask:task.namePlaceholder' }" id="taskName" />
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationElement: hubName">
                            <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:task.hubNameLabel'"></label>
                            <div class="flex-grow">
                                <input type="text" class="form-control" data-bind="textInput: hubName, i18nAttr: { placeholder: 'editReplicationSinkTask:task.hubNamePlaceholder' }" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:task.stateLabel'"></label>
                            <div class="flex-grow">
                                <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                                    <span data-bind="text: stateText()"></span>
                                    <span class="caret"></span>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Enabled')"><span data-bind="i18n: 'editReplicationSinkTask:task.stateEnabled'"></span></a></li>
                                    <li><a href="#" data-bind="click: _.partial($root.setState, 'Disabled')"><span data-bind="i18n: 'editReplicationSinkTask:task.stateDisabled'"></span></a></li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group margin-bottom margin-bottom-xs">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: $root.db.isSharded() ? 'editReplicationSinkTask:task.responsibleNodeShardedTitle' : 'editReplicationSinkTask:task.responsibleNodeTitle' }"
                                 data-animation="true">
                                <input id="responsibleNode" type="checkbox" data-bind="checked: manualChooseMentor, disable: $root.possibleMentors().length === 0 || $root.db.isSharded()">
                                <label for="responsibleNode" data-bind="i18n: 'editReplicationSinkTask:task.responsibleNodeToggle'"></label>
                            </div>
                        </div>
                        <div data-bind="compose: $root.taskResponsibleNodeSectionView"></div>
                        <div class="form-group margin-bottom margin-bottom-xs margin-top" data-bind="validationElement: replicationMode">
                            <label class="control-label">&nbsp;</label>
                            <div class="flex-vertical">
                                <div class="toggle">
                                    <input id="allowHubToSink" type="checkbox" data-bind="checked: allowReplicationFromHubToSink" />
                                    <label for="allowHubToSink" data-bind="i18n: 'editReplicationSinkTask:task.allowHubToSink'"></label>
                                </div>
                                <div class="toggle">
                                    <input id="allowSinkToHub" type="checkbox" data-bind="checked: allowReplicationFromSinkToHub" />
                                    <label for="allowSinkToHub" data-bind="i18n: 'editReplicationSinkTask:task.allowSinkToHub'"></label>
                                </div>
                                <div class="help-block" data-bind="validationMessage: replicationMode"></div>
                            </div>
                        </div>
                        <div class="form-group margin-top">
                            <label class="control-label">&nbsp;</label>
                            <div class="toggle">
                                <input id="createNewString" type="checkbox" data-bind="checked: $root.createNewConnectionString" />
                                <label for="createNewString" data-bind="i18n: 'editReplicationSinkTask:connectionString.createNew'"></label>
                            </div>
                        </div>
                        <div data-bind="collapse: $root.createNewConnectionString, with: $root.newConnectionString">
                            <div class="form-group">
                                <div class="flex-grow" data-bind="compose: $root.connectionStringView"></div>
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationOptions: { insertMessages: false }, validationElement: connectionStringName, visible: !$root.createNewConnectionString()">
                            <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:connectionString.label'"></label>
                            <div class="flex-grow">
                                <button class="btn btn-block dropdown-toggle text-left" type="button" data-toggle="dropdown"
                                        data-bind="textInput: connectionStringName, disable: $root.ravenEtlConnectionStringsDetails().length === 0,
                                                   i18nAttr: { 'title': $root.ravenEtlConnectionStringsDetails().length === 0 ? 'editReplicationSinkTask:connectionString.noneDefinedTitle' : 'editReplicationSinkTask:connectionString.select' }">
                                    <span data-bind="text: connectionStringName() || $root.selectConnectionStringText"></span>
                                    <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
                                </button>
                                <ul class="dropdown-menu"
                                    data-bind="foreach: $root.ravenEtlConnectionStringsDetails">
                                    <li data-bind="click: _.partial($root.useConnectionString, $data.Name)">
                                        <a href="#">
                                            <div class="row">
                                                <strong class="col-xs-7" data-bind="text: $data.Name"></strong>
                                                <small class="col-xs-2" data-bind="i18n: 'editReplicationSinkTask:connectionString.destinationDb'"></small>
                                                <small class="col-xs-3" data-bind="text: $data.Database"></small>
                                            </div>
                                        </a>
                                    </li>
                                </ul>
                                <span class="help-block" data-bind="validationMessage: connectionStringName"></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div data-bind="if: createNewConnectionString">
                            <div class="panel-addon" data-bind="with: testConnectionResult">
                                <div class="padding bg-success small" data-bind="visible: Success">
                                    <div data-bind="i18n: 'editReplicationSinkTask:testConnection.success'"></div>
                                </div>
                                <div data-bind="if: !Success">
                                    <div class="padding bg-danger small">
                                        <h2 data-bind="i18n: 'editReplicationSinkTask:testConnection.failed'"></h2>
                                        <span data-bind="text: $root.fullErrorDetailsVisible() ? Error : $root.shortErrorText()"></span>
                                        <div>
                                            <a href="#" data-bind="click: $root.fullErrorDetailsVisible.toggle.bind($root.fullErrorDetailsVisible), i18n: $root.fullErrorDetailsVisible() ? 'editReplicationSinkTask:testConnection.hideDetails' : 'editReplicationSinkTask:testConnection.showDetails'"></a>
                                        </div>
                                    </div>
                                    <div class="padding bg-info small">
                                        <h2 data-bind="i18n: 'editReplicationSinkTask:testConnection.aboutError'"></h2>
                                        <div data-bind="i18n: 'editReplicationSinkTask:testConnection.endpoints'"></div>
                                        <div data-bind="i18n: 'editReplicationSinkTask:testConnection.tcpAfterHttp'"></div>
                                        <div data-bind="visible: HTTPSuccess, i18n: 'editReplicationSinkTask:testConnection.tcpFailed'"></div>
                                        <div data-bind="visible: !HTTPSuccess, i18n: 'editReplicationSinkTask:testConnection.httpFailed'"></div>
                                        <div>
                                            <span data-bind="i18n: 'editReplicationSinkTask:testConnection.verify'"></span>
                                            <ul>
                                                <li data-bind="i18n: 'editReplicationSinkTask:testConnection.urlCorrect'"></li>
                                                <li data-bind="i18n: 'editReplicationSinkTask:testConnection.serversRunning'"></li>
                                                <li data-bind="i18n: 'editReplicationSinkTask:testConnection.noFirewall'"></li>
                                                <li data-bind="i18n: 'editReplicationSinkTask:testConnection.noNetworkIssues'"></li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="panel-addon" data-bind="visible: ravenEtlConnectionStringsDetails().length === 0 && !createNewConnectionString()">
                            <div class="padding bg-warning small">
                                <i class="icon-warning"></i>&nbsp;&nbsp;<span data-bind="i18n: 'editReplicationSinkTask:connectionString.noneDefinedYet'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 col-lg-6 margin-top" data-bind="with: editedSinkTask, css: { 'pe-none item-disabled': !$root.hasPullReplicationAsSink }">
                <div class="flex-horizontal">
                    <div class="flex-separator"></div>
                    <label for="configurationFilePicker" class="btn btn-default margin-top" data-bind="visible: $root.canDefineCertificates, i18nAttr: { title: 'editReplicationSinkTask:importConfigurationTitle' }">
                        <i class="icon-import"></i><span data-bind="i18n: 'editReplicationSinkTask:importConfiguration'"></span>
                    </label>
                </div>
                <div class="panel margin-top" data-bind="if: $root.canDefineCertificates">
                    <div class="panel-body">
                        <h3 class="margin-top" data-bind="i18n: 'editReplicationSinkTask:access.heading'"></h3>
                        <div class="margin-top" data-bind="with: replicationAccess">
                            <div class="form-group margin-top" data-bind="validationElement: replicationAccessName">
                                <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:access.nameLabel'"></label>
                                <div class="flex-grow">
                                    <input type="text" class="form-control" data-bind="textInput: replicationAccessName, i18nAttr: { placeholder: 'editReplicationSinkTask:access.namePlaceholder' }" />
                                </div>
                            </div>
                            <hr>
                            <div class="form-group margin-top">
                                <label class="control-label " data-bind="i18n: 'editReplicationSinkTask:certificate.sourceLabel'"></label>
                                <div class="btn-group ">
                                    <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" data-bind="i18nAttr: { title: 'editReplicationSinkTask:certificate.sourceTitle' }">
                                        <span data-bind="text: certificateSourceText"></span>&nbsp;&nbsp;
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" role="menu">
                                        <li><a href="#" data-bind="i18n: 'editReplicationSinkTask:certificate.provideOwn', click: _.partial(useServerCertificate, false)"></a></li>
                                        <li><a href="#" data-bind="i18n: 'editReplicationSinkTask:certificate.useServer', click: _.partial(useServerCertificate, true)"></a></li>
                                    </ul>
                                </div>
                                <small id="sink-certificate-info" class="margin-left margin-left-sm margin-top margin-top-sm" data-toggle="tooltip" data-placement="bottom"><i class="icon-info text-info"></i></small>
                                <div class="flex-separator"></div>
                                <button type="button" class="btn btn-default" id="download-server-certificate" data-toggle="tooltip" data-placement="left"
                                        data-bind="visible: serverCertificateSelected, click: $root.downloadServerCertificate">
                                    <i class="icon-export"></i><span data-bind="i18n: 'editReplicationSinkTask:certificate.download'"></span>
                                </button>
                            </div>
                            <div data-bind="if: !certificate()">
                                <div class="form-group">
                                    <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:certificate.fileLabel'"></label>
                                    <div class="input-group file-input flex-grow" data-bind="validationElement: certificateExtracted">
                                        <input type="file" name="uploadFile" id="uploadFile" accept="" data-bind="event: { change: _.partial($root.certFileSelected, $element) }" />
                                        <span class="static-name form-control" data-bind="text: selectedFileName() || $root.certificateFilePlaceholder"></span>
                                        <span class="input-group-btn">
                                            <label for="uploadFile" class="btn btn-default"><i class="icon-document"></i><span data-bind="i18n: 'editReplicationSinkTask:certificate.browse'"></span></label>
                                        </span>
                                        <p class="help-block" data-bind="validationMessage: certificateExtracted"></p>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:certificate.passphraseLabel'"></label>
                                    <input class="form-control margin-bottom" type="password" data-bind="textInput: selectedFilePassphrase" />
                                </div>
                            </div>
                            <div data-bind="if: certificate">
                                <div class="form-group">
                                    <label class="control-label" data-bind="i18n: 'editReplicationSinkTask:certificate.label'"></label>
                                    <div class="panel certificate-item flex-grow margin-top margin-top-xs">
                                        <div class="padding padding-sm flex-horizontal">
                                            <div data-bind="i18nAttr: { title: 'editReplicationSinkTask:certificate.thumbprintTitle' }">
                                                <i class="icon-certificate"></i><span data-bind="text: certificate().thumbprint()"></span>
                                            </div>
                                            <div class="flex-separator"></div>
                                            <button type="button" class="btn btn-sm btn-danger"
                                                    data-bind="visible: !serverCertificateSelected(), click: _.partial($root.removeCertificate, $data), i18nAttr: { title: 'editReplicationSinkTask:certificate.removeTitle' }"> 
                                                <i class="icon-trash"></i>
                                            </button>
                                        </div>
                                        <div class="panel-addon padding padding-sm">
                                            <div class="flex-horizontal">
                                                <span class="notBefore">
                                                    <span class="margin-right margin-right-sm"><i class="icon-generation"></i><span data-bind="i18n: 'editReplicationSinkTask:certificate.validFrom'"></span></span>
                                                    <strong data-bind="text: certificate().validFromText()"></strong>
                                                </span>
                                                <span class="expiration margin-left">
                                                    <span class="margin-right margin-right-sm"><i data-bind="attr: { class: certificate().expirationIcon }"></i><span data-bind="i18n: 'editReplicationSinkTask:certificate.expiration'"></span></span>
                                                    <strong data-bind="attr: { class: certificate().expirationClass }, text: certificate().expirationText"></strong>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="margin-bottom margin-top">
                                <hr>
                                <div class="margin-bottom">
                                    <h3 data-bind="i18n: 'editReplicationSinkTask:paths.heading'"></h3>
                                </div>
                                <div class="form-group" data-bind="validationElement: inputPrefixHubToSink().path">
                                    <label for="hubToSink" class="control-label"><span data-bind="i18n: 'editReplicationSinkTask:paths.hubToSinkLabel'"></span>
                                        <small id="hub-to-sink-info" class="margin-left margin-left-sm" data-toggle="tooltip" data-placement="bottom"><i class="icon-info text-info"></i></small>
                                    </label>
                                    <div class="flex-grow" id="hubToSink" data-bind="validationElement: hubToSinkPrefixes">
                                        <div class="flex-horizontal">
                                            <div class="flex-grow">
                                                <input type="text" class="form-control" data-bind="textInput: inputPrefixHubToSink().path, i18nAttr: { placeholder: 'editReplicationSinkTask:paths.placeholder' }" />
                                            </div>
                                            <button class="btn btn-info"
                                                    data-bind="click: addHubToSinkInputPrefixWithBlink, enable: inputPrefixHubToSink && inputPrefixHubToSink().path() && inputPrefixHubToSink().path.isValid()">
                                                <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationSinkTask:paths.addPath'"></span>
                                            </button>
                                        </div>
                                        <div data-bind="visible: hubToSinkPrefixes().length" class="margin-top">
                                            <ul class="well collection-list" data-bind="foreach: hubToSinkPrefixes">
                                                <li>
                                                    <div class="name" data-bind="text: $data.path()"></div>
                                                    <a href="#" data-bind="click: $parent.removePrefixPathHubToSink.bind($parent, $data.path()), i18nAttr: { title: 'editReplicationSinkTask:paths.removeTitle' }"><i class="icon-trash"></i></a>
                                                </li>
                                            </ul>
                                        </div>
                                        <span class="help-block" data-bind="validationMessage: hubToSinkPrefixes"></span>
                                        <div class="padding padding-xs text-warning bg-warning" data-bind="visible: hasSingleDocumentPattern(hubToSinkPrefixes())">
                                            <small><i class="icon-warning"></i><span data-bind="text: getSingleDocumentPatternWarning()"></span></small>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group margin-top">
                                    <label class="control-label">&nbsp;</label>
                                    <div class="toggle">
                                        <input id="useStuff" type="checkbox" data-bind="checked: samePrefixesForBothDirections" />
                                        <label for="useStuff" data-bind="html: $root.useForBothDirectionsHtml"></label>
                                    </div>
                                </div>
                                <div class="form-group margin-bottom" data-bind="validationElement: inputPrefixSinkToHub().path">
                                    <label for="sinkToHub" class="control-label"><span data-bind="i18n: 'editReplicationSinkTask:paths.sinkToHubLabel'"></span>
                                        <small id="sink-to-hub-info" class="margin-left margin-left-sm" data-toggle="tooltip" data-placement="bottom"><i class="icon-info text-info"></i></small>
                                    </label>
                                    <div class="flex-grow" id="sinkToHub" data-bind="collapse: !samePrefixesForBothDirections(), validationElement: sinkToHubPrefixes">
                                        <div class="flex-horizontal">
                                            <div class="flex-grow">
                                                <input type="text" class="form-control" data-bind="textInput: inputPrefixSinkToHub().path, i18nAttr: { placeholder: 'editReplicationSinkTask:paths.placeholder' }" />
                                            </div>
                                            <button class="btn btn-info"
                                                    data-bind="click: addSinkToHubInputPrefixWithBlink, enable: inputPrefixSinkToHub && inputPrefixSinkToHub().path() && inputPrefixSinkToHub().path.isValid()">
                                                <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationSinkTask:paths.addPath'"></span>
                                            </button>
                                        </div>
                                        <div data-bind="visible: sinkToHubPrefixes().length" class="margin-top">
                                            <ul class="well collection-list" data-bind="foreach: sinkToHubPrefixes">
                                                <li>
                                                    <div class="name" data-bind="text: $data.path()"></div>
                                                    <a href="#" data-bind="click: $parent.removePrefixPathSinkToHub.bind($parent, $data.path()), i18nAttr: { title: 'editReplicationSinkTask:paths.removeTitle' }"><i class="icon-trash"></i></a>
                                                </li>
                                            </ul>
                                        </div>
                                        <span class="help-block" data-bind="validationMessage: sinkToHubPrefixes"></span>
                                        <div class="padding padding-xs text-warning bg-warning" data-bind="visible: hasSingleDocumentPattern(sinkToHubPrefixes())">
                                            <small><i class="icon-warning"></i><span data-bind="text: getSingleDocumentPatternWarning()"></span></small>
                                        </div>
                                    </div>
                                    <div data-bind="visible: samePrefixesForBothDirections">
                                        <div class="form-control-static" data-bind="html: $root.sameAsHubToSinkHtml"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<form id="certificates_download_form" target="certificate_download_iframe" style="display: none"></form>

<iframe name="certificate_download_iframe" style="display: none"></iframe>
