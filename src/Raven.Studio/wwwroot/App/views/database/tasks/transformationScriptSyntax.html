<div class="modal-dialog modal-lg" role="document" id="transformationScriptSyntaxDialog">
    <div class="modal-content">
       <div class="modal-body">
           <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'transformationScriptSyntax:close' }"><i class="icon-cancel"></i></button>
           <div data-bind="if: etlType() === 'Raven'">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:raven.title'"></h3>
               <div data-bind="foreach: $data.constructor.ravenEtlSamples">
                   <div class="margin-top" data-bind="text: title"></div>
                   <pre class="margin-bottom copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
               </div>
            </div>
           <div data-bind="if: etlType() === 'Sql'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:sql.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: sqlEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'Snowflake'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:snowflake.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: snowflakeEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'ElasticSearch'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:elasticsearch.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: elasticSearchEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'Olap'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:olap.title'"></h3>
               <div data-bind="i18n: 'transformationScriptSyntax:olap.withPartitions'"></div>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'olapEtlSamplePartition'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: olapEtlSamplePartitionHtml"></span></pre>
               </div>
               <div data-bind="i18n: 'transformationScriptSyntax:olap.withoutPartitions'"></div>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'olapEtlSampleNoPartition'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: olapEtlSampleNoPartitionHtml"></span></pre>
               </div>
               <div data-bind="i18n: 'transformationScriptSyntax:olap.partitionWithKey'"></div>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'olapEtlSampleKey'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: olapEtlSampleKeyHtml"></span></pre>
               </div>
               <div data-bind="i18n: 'transformationScriptSyntax:olap.customPartition'"></div>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'olapEtlSampleCustomPartition'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: olapEtlSampleCustomPartitionHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'Kafka'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:kafka.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: kafkaEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'RabbitMQ'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:rabbitMq.title'"></h3>
               <div data-bind="i18n: 'transformationScriptSyntax:rabbitMq.example'"></div>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: rabbitMqEtlSampleHtml"></span></pre>
               </div>
               <table class="table table-striped table-condensed">
                   <thead>
                   </thead>
                   <tbody>
                   <tr>
                       <th><strong data-bind="html: loadToOptionHtml"></strong></th>
                       <th><strong data-bind="i18n: 'transformationScriptSyntax:rabbitMq.targetExchange'"></strong></th>
                       <th><strong data-bind="i18n: 'transformationScriptSyntax:rabbitMq.routingKey'"></strong></th>
                   </tr>
                   <tr>
                       <td><code>loadToUsers({ Name: 'Bob' })</code></td>
                       <td>Users</td>
                       <td class="text-muted" data-bind="i18n: 'transformationScriptSyntax:rabbitMq.emptyDefault'"></td>
                   </tr>
                   <tr>
                       <td><code>loadToUsers({ Name: 'Bob' }, 'admin')</code></td>
                       <td>Users</td>
                       <td>admin</td>
                   </tr>
                   <tr>
                       <td>
                           <code>loadToUsers({ Name: 'Bob' }, {<br />
                               <span class="margin-left">Id: ...,</span><br />
                               <span class="margin-left">Source: ...,</span><br />
                               <span class="margin-left">Type: ...</span><br /> })
                           </code>
                       </td>
                       <td>Users</td>
                       <td class="text-muted" data-bind="i18n: 'transformationScriptSyntax:rabbitMq.emptyDefault'"></td>
                   </tr>
                   <tr>
                       <td>
                           <code>loadToUsers({ Name: 'Bob' }, 'admin', {<br />
                               <span class="margin-left">Type: ...,</span><br /> })
                           </code>
                       </td>
                       <td>Users</td>
                       <td>admin</td>
                   </tr>
                   <tr>
                       <td><code>loadTo('', { Name: 'Bob' }, 'users-queue')</code></td>
                       <td class="text-muted" data-bind="i18n: 'transformationScriptSyntax:rabbitMq.emptyDefault'"></td>
                       <td>users-queue</td>
                   </tr>
                   </tbody>
               </table>
           </div>
           <div data-bind="if: etlType() === 'AzureQueueStorage'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:azureQueueStorage.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: azureQueueStorageEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'AmazonSqs'" class="copy-area">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:amazonSqs.title'"></h3>
               <div class="margin-bottom">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: copySample, i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: amazonSqsEtlSampleHtml"></span></pre>
               </div>
           </div>
           <div data-bind="if: etlType() === 'EmbeddingsGeneration'">
               <h3 class="margin-bottom margin-top" data-bind="i18n: 'transformationScriptSyntax:embeddings.title'"></h3>
               <div data-bind="i18n: 'transformationScriptSyntax:embeddings.text'"></div>
               <div class="margin-bottom copy-area">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'embeddingsGenerationSampleText'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: embeddingsGenerationSampleTextHighlighted"></span></pre>
               </div>
               <div>Markdown</div>
               <div class="margin-bottom copy-area">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'embeddingsGenerationSampleMarkdown'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: embeddingsGenerationSampleMarkdownHighlighted"></span></pre>
               </div>
               <div>HTML</div>
               <div class="margin-bottom copy-area">
                   <pre class="copy-area"><a href="#" class="copy-button-hidden margin-right-xs" data-bind="click: _.partial($root.copySample, 'embeddingsGenerationSampleHtml'), i18nAttr: { title: 'transformationScriptSyntax:copySampleTitle' }"><i class="icon-copy"></i></a><span data-bind="html: embeddingsGenerationSampleHtmlHighlighted"></span></pre>
               </div>
           </div>
       </div>
    </div>
</div>
