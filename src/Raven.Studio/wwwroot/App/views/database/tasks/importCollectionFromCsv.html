<div class="importDatabase ">
    <div class="panel padding padding-md" data-bind="visible: $root.activeDatabase().isSharded()">
        <div>
            <div class="empty-set text-center margin-top-sm margin-bottom-sm mx-auto">
                <i class="icon-disabled text-warning icon-xl m-0"></i>
                <div class="lead">
                    <div class="vstack gap-3">
                        <span>
                            <div class="rounded-pill badge bg-faded-warning" data-bind="i18n: 'importCollectionFromCsv:sharded.featureNotAvailable'"></div>
                        </span>
                        <span data-bind="html: $root.shardedNotAvailableHtml"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="panel" data-bind="visible: !$root.activeDatabase().isSharded()">
        <div class="panel-body">
            <form class="flex-form" data-bind="submit: importCsv">
                <h3 data-bind="i18n: 'importCollectionFromCsv:title'"></h3>
                <div class="row">
                    <div class="col-lg-6">
                        <hr class="margin-top"/>
                        <h4 data-bind="i18n: 'importCollectionFromCsv:source.title'"></h4>
                        <div class="form-group margin-top margin-left">
                            <label for="importCsvFilePicker" class="control-label"><span data-bind="i18n: 'importCollectionFromCsv:source.importFromFile'"></span><i class="required"></i></label>
                            <div class="flex-grow">
                                <div class="input-group file-input" data-bind="validationElement: importedFileName">
                                    <input type="file" accept=".csv" id="importCsvFilePicker" data-bind="event: { change: _.partial(fileSelected, $element.value) }, disable: isImporting" tabindex="-1">
                                    <span class="static-name form-control" data-bind="text: importedFileName() || selectFileText"></span>
                                    <span class="input-group-btn">
                                    <label for="importCsvFilePicker" class="btn btn-default">
                                        <i class="icon-document"></i><span data-bind="i18n: 'importCollectionFromCsv:source.browse'"></span>
                                    </label>
                                </span>
                                    <p class="help-block" data-bind="validationMessage: importedFileName"></p>
                                </div>
                                <div class="bg-info text-info padding padding-xs margin-top margin-top-sm flex-horizontal">
                                    <div class="flex-start">
                                        <small><i class="icon-info"></i></small>
                                    </div>
                                    <div>
                                        <ul class="no-margin">
                                            <li><small data-bind="i18n: 'importCollectionFromCsv:source.headersRequired'"></small></li>
                                            <li><small data-bind="i18n: 'importCollectionFromCsv:source.columnsAsProperties'"></small></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group margin-top margin-left">
                            <label for="csvImportCollection" class="control-label" data-bind="i18n: 'importCollectionFromCsv:source.importToCollection'"></label>
                            <div class="flex-grow">
                                <input class="form-control" type="text" name="csvImportCollection" id="csvImportCollection" 
                                       data-bind="textInput: customCollectionName, i18nAttr: { placeholder: 'importCollectionFromCsv:source.collectionPlaceholder' }" autocomplete="off" />
                                <div class="bg-info text-info padding padding-xs margin-top margin-top-sm flex-horizontal">
                                    <div class="flex-start">
                                        <small><i class="icon-info"></i></small>
                                    </div>
                                    <div>
                                        <ul class="no-margin">
                                            <li><small data-bind="html: collectionFromColumnHtml"></small></li>
                                            <li><small data-bind="i18n: 'importCollectionFromCsv:source.collectionFromInput'"></small></li>
                                            <li><small data-bind="i18n: 'importCollectionFromCsv:source.collectionFromFileName'"></small></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr class="margin-top margin-top-md"/>
                        <h4 data-bind="i18n: 'importCollectionFromCsv:csvOptions.title'"></h4>
                        <div class="margin-left margin-top">
                            <div class="form-group">
                                <label class="control-label" data-bind="i18n: 'importCollectionFromCsv:csvOptions.fieldsDelimiter'"></label>
                                <div class="flex-grow" data-bind="with: csvConfig">
                                    <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                                        <span data-bind="text: $root.getDelimiterLabel(delimiter())"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" data-bind="foreach: constructor.possibleDelimiters">
                                        <li>
                                            <a href="#" data-bind="text: $root.getDelimiterLabel($data), click: _.partial($parent.delimiter)"></a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="margin-left">
                            <div class="form-group" data-bind="with: csvConfig">
                                <label class="control-label" data-bind="i18n: 'importCollectionFromCsv:csvOptions.textQualifier'"></label>
                                <div class="flex-grow">
                                    <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                                        <span data-bind="text: $root.getQuoteLabel(quote())"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" data-bind="foreach: constructor.possibleQuoteChars">
                                        <li>
                                            <a href="#" data-bind="text: $root.getQuoteLabel($data), click: _.partial($parent.quote)"></a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="margin-left">
                            <div class="form-group" data-bind="with: csvConfig">
                                <label class="control-label" data-bind="i18n: 'importCollectionFromCsv:csvOptions.whitespace'"></label>
                                <div class="flex-grow">
                                    <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                                        <span data-bind="text: $root.getTrimOptionLabel(trimOption())"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" data-bind="foreach: constructor.possibleTrimOptions">
                                        <li>
                                            <a href="#" data-bind="text: $root.getTrimOptionLabel($data), click: _.partial($parent.trimOption)"></a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="margin-left">
                            <div class="form-group" data-bind="with: csvConfig">
                                <label class="control-label margin-left margin-left-sm"></label>      
                                <div class="toggle">
                                    <input id="allowComments" type="checkbox" data-bind="checked: allowComments"/>
                                    <label for="allowComments" data-bind="i18n: 'importCollectionFromCsv:csvOptions.allowComments'"></label>
                                </div>
                                <div class="flex-grow margin-left" data-bind="validationElement: commentCharacter">
                                    <input type="text" class="form-control"
                                           data-bind="textInput: commentCharacter, disable: !allowComments(), i18nAttr: { placeholder: 'importCollectionFromCsv:csvOptions.commentCharacterPlaceholder' }" autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr />
                <div class="progress" data-bind="visible: isUploading()">
                    <div class="progress-bar progress-bar-primary progress-bar-striped" role="progressbar" data-bind="style: { width: uploadStatus() + '%' }"> <span class="sr-only" data-bind="text: uploadStatus() + '%'"></span> </div>
                </div>
                <div>
                    <button class="btn btn-primary" type="submit" data-bind="css: { 'btn-spinner': isImporting() }"><span class="icon-import"></span> <span data-bind="i18n: 'importCollectionFromCsv:importCollection'"></span></button>                  
                </div>
            </form>
        </div>
    </div>
</div>
