<div class="modal-dialog modal-lg margin-bottom" role="document" id="patchSyntaxDialog">
    <div class="modal-content">
        <div class="modal-body">
            <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'queueSinkSyntax:close' }"><i class="icon-cancel"></i></button>
            <div class="row margin-top">
                <div class="col-xs-12 col-lg-6">
                    <h3 data-bind="i18n: 'queueSinkSyntax:samples.title'"></h3>
                    <div data-bind="foreach: $data.constructor.samples">
                        <div class="margin-top" data-bind="text: title"></div>
                        <pre class="margin-bottom copy-area"><a href="#" class="copy-button-hidden" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'queueSinkSyntax:samples.copyTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
                    </div>
                </div>
                <div class="col-xs-12 col-lg-6">
                    <h3 data-bind="i18n: 'queueSinkSyntax:methods.title'"></h3>
                    <div class="text-left margin-top">
                        <div data-bind="i18n: 'queueSinkSyntax:methods.intro'"></div>
                        <small data-bind="i18n: 'queueSinkSyntax:methods.fullList'"></small>
                        <div data-bind="compose: $root.scriptFunctionsSyntaxView"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
