<div class="modal-dialog" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.title'"></h4>
        </div>
        <div class="modal-body">
            <p class="margin-top" data-bind="html: descriptionHtml"></p>
            <hr>
            <p>
                <i class="text-warning icon-warning"></i>
                <span data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.saveKeyWarning'"></span>
            </p>
            <ul>
                <li>
                    <strong data-bind="i18n: 'editReplicationHubTask:sinkInfo.exportAccessConfiguration'"></strong><br>
                    <small data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.exportDescription'"></small>
                </li>
                <li class="margin-top margin-top-sm">
                    <strong data-bind="i18n: 'editReplicationHubTask:sinkInfo.downloadCertificate'"></strong><br>
                    <small data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.downloadDescription'"></small>
                </li>
            </ul>
            <p class="text-info bg-info padding padding-xs margin-right margin-right-lg margin-top margin-bottom">
                <small><i class="icon-info"></i><span data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.keepSafe'"></span></small>
            </p>
            <hr>
            <p class="margin-top" data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.validityPrompt'"></p>
            <div class="flex-form">
                <div class="form-group" data-bind="validationElement: validityInMonths">
                    <label class="control-label" data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.validityLabel'"></label>
                    <div class="input-group btn-block">
                        <input type="number" min="1" class="form-control" data-bind="numericInput: validityInMonths, i18nAttr: { placeholder: 'editReplicationHubTask:generateCertificateDialog.validityPlaceholder' }" />
                        <div class="input-group-addon" data-bind="i18n: 'editReplicationHubTask:generateCertificateDialog.months'"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel">
                <i class="icon-cancel"></i>
                <span data-bind="i18n: 'common:cancel'"></span>
            </button>
            <button type="button" class="btn btn-success" data-bind="click: generate">
                <i class="icon-magic-wand"></i>
                <span data-bind="i18n: 'editReplicationHubTask:certificate.generate'"></span>
            </button>
        </div>
    </div>
</div>
