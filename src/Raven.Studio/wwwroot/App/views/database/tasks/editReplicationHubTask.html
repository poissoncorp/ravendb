<div class="content-margin edit-pull-replication-hub-task edit-ongoing-task">
    <form class="flex-form" autocomplete="off">
        <div class="align-items-center justify-content-between d-flex gap-2 margin-bottom-md padding-top-xs">
            <div class="flex-horizontal gap-2">
                <i class="icon-pull-replication-hub"></i>
                <h2 data-bind="i18n: { key: 'editReplicationHubTask:heading', options: { context: $root.isNewTask() ? 'new' : 'edit' } }" class="mb-0"></h2>
                <span class="badge license-restricted-badge enterprise" data-bind="if: !hasPullReplicationAsHub">Enterprise</span>
            </div>
            <div class="flex-end margin-right-xs" data-bind="react: $root.infoHubView"></div>
        </div>
        <div class="row flex-row" data-bind="with: editedHubTask">
            <div class="col-xs-12 col-lg-6">
                <div class="flex-horizontal margin-bottom" data-bind="css: { 'disabled-area': $root.editedReplicationAccessItem }">
                    <div>
                        <button class="btn btn-default" data-bind="click: $root.cancelHubTaskOperation, i18nAttr: { title: 'editReplicationHubTask:cancelTitle' }">
                            <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                        </button>
                    </div>
                    <div data-bind="visible: !$root.canDefineCertificates">
                        <button class="btn btn-default" data-bind="click: $root.exportHubConfiguration, css: { 'pe-none item-disabled': !$root.hasPullReplicationAsHub }, i18nAttr: { title: 'editReplicationHubTask:exportConfigurationTitle' }">
                            <i class="icon-export"></i><span data-bind="i18n: 'editReplicationHubTask:exportConfiguration'"></span>
                        </button>
                    </div>
                    <div>
                        <span data-placement="right" data-toggle="tooltip" data-html="true" data-animation="true"
                        data-bind="tooltipText: $root.hasPullReplicationAsHub ? null : $root.licenseRestrictedTooltip">
                            <button class="btn btn-primary"
                            data-bind="click: $root.saveReplicationHubTask, css: { 'btn-spinner': $root.spinners.saveHubTask },
                            disable: $root.spinners.saveHubTask() || !$root.dirtyFlag().isDirty(),
                            i18nAttr: { title: 'editReplicationHubTask:saveTitle' }">
                            <i class="icon-save"></i><span data-bind="i18n: 'common:save'"></span>
                        </button>
                    </span>
                    </div>
                </div>
                <div class="panel" data-bind="css: { 'pe-none item-disabled': !$root.hasPullReplicationAsHub }">
                    <div class="panel-body">
                        <div class="bg-info text-info padding padding-xs pull-right">
                            <small><i class="icon-info"></i><span data-bind="i18n: 'editReplicationHubTask:task.connectionInfo'"></span></small>
                        </div>
                        <div data-bind="css: { 'disabled-area': $root.editedReplicationAccessItem }">
                            <div class="form-group margin-top" data-bind="validationElement: taskName">
                                <label for="taskName" class="control-label" data-bind="i18n: 'editReplicationHubTask:task.nameLabel'"></label>
                                <div class="flex-grow">
                                    <input type="text" class="form-control" data-bind="textInput: taskName, i18nAttr: { placeholder: 'editReplicationHubTask:task.namePlaceholder' }" id="taskName" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label" data-bind="i18n: 'editReplicationHubTask:task.stateLabel'"></label>
                                <div class="flex-grow">
                                    <button type="button" class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown" aria-expanded="false">
                                        <span data-bind="text: stateText()"></span>
                                        <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a href="#" data-bind="click: _.partial($root.setState, 'Enabled')"><span data-bind="i18n: 'editReplicationHubTask:task.stateEnabled'"></span></a></li>
                                        <li><a href="#" data-bind="click: _.partial($root.setState, 'Disabled')"><span data-bind="i18n: 'editReplicationHubTask:task.stateDisabled'"></span></a></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="form-group margin-bottom margin-bottom-xs">
                                <label class="control-label">&nbsp;</label>
                                <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editReplicationHubTask:task.delayTimeTitle' }" data-animation="true">
                                    <input id="setDelayTime" type="checkbox" data-bind="checked: showDelayReplication" />
                                    <label for="setDelayTime" data-bind="i18n: 'editReplicationHubTask:task.delayTimeToggle'"></label>
                                </div>
                            </div>
                            <div data-bind="validationElement: delayReplicationTime, collapse: showDelayReplication">
                                <div class="form-group">
                                    <div>
                                        <label class="control-label" data-bind="i18n: 'editReplicationHubTask:task.delayTimeLabel'"></label>
                                    </div>
                                    <div class="flex-grow" data-bind="validationElement: delayReplicationTime">
                                        <input type="text" class="form-control" data-bind="durationPicker: delayReplicationTime, durationPickerOptions: { showDays: true, showSeconds: true }" />
                                        <div class="help-block" data-bind="validationMessage: delayReplicationTime"></div>
                                    </div>
                                </div>
                            </div>
                            <div data-bind="collapse: humaneDelayDescription">
                                <div class="form-group margin-bottom">
                                    <label class="control-label">&nbsp;</label>
                                    <div class="bg-info padding padding-sm small flex-horizontal">
                                        <div><i class="icon-info"></i></div>
                                        <div data-bind="html: humaneDelayDescription"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group margin-bottom margin-bottom-xs">
                                <label class="control-label">&nbsp;</label>
                                <div class="toggle" data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: $root.db.isSharded() ? 'editReplicationHubTask:task.responsibleNodeShardedTitle' : 'editReplicationHubTask:task.responsibleNodeTitle' }"
                                     data-animation="true">
                                    <input id="responsibleNode" type="checkbox" data-bind="checked: manualChooseMentor, disable: $root.possibleMentors().length === 0 || $root.db.isSharded()">
                                    <label for="responsibleNode" data-bind="i18n: 'editReplicationHubTask:task.responsibleNodeToggle'"></label>
                                </div>
                            </div>
                            <div data-bind="compose: $root.taskResponsibleNodeSectionView"></div>
                            <div class="form-group margin-bottom margin-bottom-xs" data-bind="validationElement: replicationMode">
                                <label class="control-label">&nbsp;</label>
                                <div class="flex-vertical">
                                    <div class="toggle">
                                        <input id="allowHubToSink" type="checkbox" data-bind="checked: allowReplicationFromHubToSink" />
                                        <label for="allowHubToSink" data-bind="i18n: 'editReplicationHubTask:task.allowHubToSink'"></label>
                                    </div>
                                    <div class="toggle">
                                        <div data-bind="visible: !$root.canDefineCertificates, i18nAttr: { title: 'editReplicationHubTask:task.allowSinkToHubTitle' }" data-placement="right" data-toggle="tooltip" data-animation="true">
                                            <input type="checkbox" data-bind="checked: false, disable: true" />
                                            <label data-bind="i18n: 'editReplicationHubTask:task.allowSinkToHub'"></label>
                                        </div>
                                        <div data-bind="visible: $root.canDefineCertificates">
                                            <input id="allowSinkToHub" type="checkbox" data-bind="checked: allowReplicationFromSinkToHub" />
                                            <label for="allowSinkToHub" data-bind="i18n: 'editReplicationHubTask:task.allowSinkToHub'"></label>
                                        </div>
                                    </div>
                                    <div class="help-block" data-bind="validationMessage: replicationMode"></div>
                                </div>
                            </div>
                            <div class="form-group margin-bottom margin-bottom-xs">
                                <label class="control-label">&nbsp;</label>
                                <div class="flex-vertical">
                                    <div class="toggle">
                                        <div data-placement="right" data-toggle="tooltip" data-bind="i18nAttr: { title: 'editReplicationHubTask:task.preventDeletionsTitle' }" data-animation="true">
                                            <input id="preventDeletion" type="checkbox" data-bind="checked: preventDeletions" />
                                            <label for="preventDeletion" data-bind="i18n: 'editReplicationHubTask:task.preventDeletions'"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group margin-bottom margin-bottom-xs" data-bind="visible: $root.canDefineCertificates">
                                <label class="control-label">&nbsp;</label>
                                <div class="toggle">
                                    <input id="toggleFiltering" type="checkbox" data-bind="checked: withFiltering, enable: $root.isNewTask" />
                                    <label for="toggleFiltering"><span data-bind="i18n: 'editReplicationHubTask:task.allowFiltering'"></span>
                                        <small class="margin-left margin-left-sm" data-bind="visible: $root.isNewTask">
                                            <i id="replication-filtering-info" class="icon-info text-info"></i>
                                        </small>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div data-bind="if: $root.canDefineCertificates, css: { 'pe-none item-disabled': !$root.hasPullReplicationAsHub }">
                    <div class="flex-horizontal">
                        <h3 class="margin-top"
                            data-bind="i18n: withFiltering() ? 'editReplicationHubTask:accessList.headingFiltered' : 'editReplicationHubTask:accessList.heading'">
                        </h3>
                        <div class="margin-top margin-left margin-right margin-right-sm flex-grow" data-bind="visible: $root.allReplicationAccessItems().length, i18nAttr: { title: 'editReplicationHubTask:accessList.filterTitle' }">
                            <input class="form-control" data-bind="textInput: $root.filterText, i18nAttr: { placeholder: { key: 'editReplicationHubTask:accessList.filterPlaceholder', options: { total: $root.allReplicationAccessItems().length } } }" />
                        </div>
                        <div class="flex-separator" data-bind="visible: !$root.allReplicationAccessItems().length"></div>
                        <div class="toggle margin-top" data-bind="visible: $root.visibleReplicationAccessItems().length">
                            <input id="details" type="checkbox" data-bind="checked: $root.showAccessDetails" />
                            <label for="details" data-bind="i18n: 'editReplicationHubTask:accessList.viewDetails'"></label>
                        </div>
                        <div class="margin-top">
                            <button class="btn btn-info" data-bind="click: $root.addNewReplicationAccess, disable: $root.isNewTask">
                                <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationHubTask:accessList.addAccess'"></span>
                            </button>
                        </div>
                    </div>
                    <div data-bind="if: !$root.allReplicationAccessItems().length && !$root.editedReplicationAccessItem()">
                        <h3 class="text-center text-muted margin-top margin-top-md" data-bind="visible: !$root.isNewTask(), i18n: 'editReplicationHubTask:accessList.empty'"></h3>
                        <h3 class="text-center text-muted margin-top margin-top-md" data-bind="visible: $root.isNewTask, i18n: 'editReplicationHubTask:accessList.saveTaskFirst'"></h3>
                    </div>
                </div>
                <div class="scroll replication-access-list flex-vertical" data-bind="css: { 'pe-none item-disabled': !$root.hasPullReplicationAsHub }">
                    <div data-bind="foreach: $root.visibleReplicationAccessItems">
                        <div class="panel panel-hover"
                             data-bind="css: { active: $root.editedReplicationAccessItem() && $data.certificate() === $root.editedReplicationAccessItem().certificate() }">
                            <div data-bind="if: !$root.showAccessDetails()">
                                <div class="flex-horizontal padding">
                                    <div class="flex-grow margin-right" data-bind="attr: { title: replicationAccessName }">
                                        <label class="control-label" data-bind="i18n: 'editReplicationHubTask:accessList.nameLabel'"></label>
                                        <span class="form-control-static margin-left margin-left-sm word-break" data-bind="text: replicationAccessName"></span>
                                    </div>
                                    <div class="flex-horizontal flex-wrap">
                                        <div>
                                            <label class="control-label margin-left-sm"><i data-bind="attr: { class: certificate().expirationIcon }"></i> <span data-bind="i18n: 'editReplicationHubTask:accessList.expirationLabel'"></span></label>
                                        </div>
                                        <div class="margin-right">
                                            <small class="form-control-static margin-left margin-left-sm" data-bind="text: certificate().expirationText()"></small>
                                        </div>
                                    </div>

                                    <div class="nobr" data-bind="template: { name: 'access-item-buttons' }"></div>

                                </div>
                            </div>
                            <div data-bind="if: $root.showAccessDetails">
                                <div class="padding">
                                    <div class="form-group margin-bottom margin-bottom-xs">
                                        <label class="control-label" data-bind="i18n: 'editReplicationHubTask:access.nameLabel'"></label>
                                        <div class="form-control-static" data-bind="text: replicationAccessName"></div>
                                    </div>
                                    <div class="form-group margin-bottom margin-bottom-xs">
                                        <label class="control-label" data-bind="i18n: 'editReplicationHubTask:certificate.label'"></label>
                                        <div class="panel certificate-item">
                                            <div class="padding padding-sm flex-horizontal" data-bind="visible: $root.showAccessDetails">
                                                <div data-bind="i18nAttr: { title: 'editReplicationHubTask:certificate.thumbprintTitle' }">
                                                    <i class="icon-certificate"></i><span data-bind="text: certificate().thumbprint()"></span>
                                                </div>
                                            </div>
                                            <div class="panel-addon padding padding-sm">
                                                <div class="flex-horizontal">
                                                    <span class="notBefore" data-bind="visible: $root.showAccessDetails">
                                                        <span class="margin-right margin-right-sm"><i class="icon-generation"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.validFrom'"></span></span>
                                                        <strong data-bind="text: certificate().validFromText()"></strong>
                                                    </span>
                                                    <span class="expiration" data-bind="css: { 'margin-left': $root.showAccessDetails }">
                                                        <span class="margin-right margin-right-sm"><i data-bind="attr: { class: certificate().expirationIcon }"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.expiration'"></span></span>
                                                        <strong data-bind="attr: { class: certificate().expirationClass }, text: certificate().expirationText()"></strong>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div data-bind="if: $parent.withFiltering" class="margin-bottom">
                                        <div class="form-group margin-bottom margin-bottom-xs" data-bind="visible: !$root.showAccessDetails()">
                                            <label class="control-label" data-bind="i18n: 'editReplicationHubTask:accessList.filteringLabel'"></label>
                                            <div class="margin-top margin-top-xs">
                                                <div><small data-bind="text: filteringReplicationText"></small></div>
                                            </div>
                                        </div>
                                        <div class="form-group margin-bottom margin-bottom-xs" data-bind="visible: $root.showAccessDetails">
                                            <label class="control-label" data-bind="i18n: 'editReplicationHubTask:accessList.hubToSinkFilteringLabel'"></label>
                                            <div data-bind="foreach: hubToSinkPrefixes" class="margin-top margin-top-xs">
                                                <div><small data-bind="text: $data.path"></small></div>
                                            </div>
                                        </div>
                                        <div class="form-group" data-bind="visible: $root.showAccessDetails">
                                            <label class="control-label" data-bind="i18n: 'editReplicationHubTask:accessList.sinkToHubFilteringLabel'"></label>
                                            <div data-bind="visible: samePrefixesForBothDirections" class="margin-top margin-top-xs">
                                                <small data-bind="html: $root.sameAsHubToSinkHtml"></small>
                                            </div>
                                            <div data-bind="visible: !samePrefixesForBothDirections(), foreach: sinkToHubPrefixes" class="margin-top margin-top-xs">
                                                <div><small data-bind="text: $data.path"></small></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="pull-right btn-group btn-group-sm replication-access-buttons">
                                        <div data-bind="template: { name: 'access-item-buttons' }"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary" data-bind="click: $root.loadMoreAccessItems(), visible: $root.showLoadMore">
                        <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationHubTask:accessList.loadMore'"></span>
                    </button>
                </div>
            </div>
            <div class="col-xs-12 col-lg-6" data-bind="with: $root.editedReplicationAccessItem, css: { 'pe-none item-disabled': !$root.hasPullReplicationAsHub }">
                <div class="panel margin-top">
                    <div class="panel-body">
                        <button class="close" data-bind="click: $root.cancelReplicationAccessOperation" aria-hidden="true">
                            <i class="icon-cancel"></i>
                        </button>
                        <h3 data-bind="if: isNewAccessItem"><span data-bind="i18n: 'editReplicationHubTask:access.headingNew'"></span></h3>
                        <h3 data-bind="if: !isNewAccessItem()"><span data-bind="i18n: 'editReplicationHubTask:access.headingEdit'"></span></h3>
                        <div class="form-group margin-top" data-bind="validationElement: replicationAccessName">
                            <label for="replicationAccessName" class="control-label" data-bind="i18n: 'editReplicationHubTask:access.nameLabel'"></label>
                            <div class="flex-grow">
                                <input type="text" class="form-control" data-bind="textInput: replicationAccessName, i18nAttr: { placeholder: 'editReplicationHubTask:access.namePlaceholder' }" id="replicationAccessName" />
                            </div>
                        </div>
                        <div class="form-group" data-bind="validationElement: certificate">
                            <label class="control-label" data-bind="i18n: 'editReplicationHubTask:certificate.label'"></label>
                            <div class="flex-grow">
                                <div data-bind="if: certificate">
                                    <div class="panel certificate-item margin-top margin-top-xs">
                                        <div class="padding padding-sm flex-horizontal">
                                            <div data-bind="i18nAttr: { title: 'editReplicationHubTask:certificate.thumbprintTitle' }">
                                                <i class="icon-certificate"></i>
                                                <span data-bind="text: certificate().thumbprint()"></span>
                                            </div>
                                            <div class="flex-separator"></div>
                                            <button class="btn btn-sm btn-primary pull-right"
                                                    data-bind="click: _.partial($root.removeCertificate, $data), visible: isNewAccessItem, i18nAttr: { title: 'editReplicationHubTask:certificate.removeTitle' }">
                                                <i class="icon-trash"></i>
                                            </button>
                                        </div>
                                        <div class="panel-addon padding padding-sm">
                                            <div class="flex-horizontal">
                                                <span class="notBefore">
                                                    <span class="margin-right margin-right-sm"><i class="icon-generation"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.validFrom'"></span></span>
                                                    <strong data-bind="text: certificate().validFromText()"></strong>
                                                </span>
                                                <span class="expiration margin-left">
                                                    <span class="margin-right margin-right-sm"><i data-bind="attr: { class: certificate().expirationIcon }"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.expiration'"></span></span>
                                                    <strong data-bind="attr: { class: certificate().expirationClass }, text: certificate().expirationText"></strong>
                                                 </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="input-group file-input">
                                    <input type="file" id="certificateFilePicker" data-bind="event: { change: _.partial($root.uploadCertificate, $element) }" tabindex="-1" />
                                </div>
                                <div class="flex-horizontal certificates-actions margin-bottom" data-bind="if: isNewAccessItem() && !certificate()">
                                    <label for="certificateFilePicker" class="btn btn-default" id="upload-certificate" data-toggle="tooltip" data-placement="bottom">
                                        <i class="icon-import"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.upload'"></span>
                                    </label>
                                    <button type="button" class="btn btn-default" id="generate-certificate" data-toggle="tooltip" data-placement="bottom"
                                            data-bind="click: $root.generateCertificate, disable: $root.spinners.generateCertificate,
                                                       css: { 'btn-spinner' : $root.spinners.generateCertificate }">
                                        <i class="icon-magic-wand"></i><span data-bind="i18n: 'editReplicationHubTask:certificate.generate'"></span>
                                    </button>
                                </div>
                                <span class="help-block" data-bind="validationMessage: certificate"></span>
                            </div>
                        </div>
                        <div data-bind="visible: $parent.withFiltering" class="margin-bottom">
                            <hr>
                            <div class="margin-bottom">
                                <h3 data-bind="i18n: 'editReplicationHubTask:paths.heading'"></h3>
                            </div>
                            <div class="form-group" data-bind="validationElement: inputPrefixHubToSink().path">
                                <label for="hubToSink" class="control-label"><span data-bind="i18n: 'editReplicationHubTask:paths.hubToSinkLabel'"></span>
                                    <small id="hub-to-sink-info" class="margin-left margin-left-sm" data-toggle="tooltip" data-placement="bottom"><i class="icon-info text-info"></i></small>
                                </label>
                                <div class="flex-grow" id="hubToSink" data-bind="validationElement: hubToSinkPrefixes">
                                    <div class="flex-horizontal">
                                        <div class="flex-grow">
                                            <input type="text" class="form-control" data-bind="textInput: inputPrefixHubToSink().path, i18nAttr: { placeholder: 'editReplicationHubTask:paths.placeholder' }" />
                                        </div>
                                        <button class="btn btn-info"
                                                data-bind="click: addHubToSinkInputPrefixWithBlink, enable: inputPrefixHubToSink && inputPrefixHubToSink().path() && inputPrefixHubToSink().path.isValid()">
                                            <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationHubTask:paths.addPath'"></span>
                                        </button>
                                    </div>
                                    <div data-bind="visible: hubToSinkPrefixes().length" class="margin-top">
                                        <ul class="well collection-list" data-bind="foreach: hubToSinkPrefixes">
                                            <li>
                                                <div class="name" data-bind="text: $data.path()"></div>
                                                <a href="#" data-bind="click: $parent.removePrefixPathHubToSink.bind($parent, $data.path()), i18nAttr: { title: 'editReplicationHubTask:paths.removeTitle' }"><i class="icon-trash"></i></a>
                                            </li>
                                        </ul>
                                    </div>
                                    <span class="help-block" data-bind="validationMessage: hubToSinkPrefixes"></span>
                                    <div class="padding padding-xs text-warning bg-warning" data-bind="visible: hasSingleDocumentPattern(hubToSinkPrefixes())">
                                        <small><i class="icon-warning"></i><span data-bind="text: getSingleDocumentPatternWarning()"></span></small>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group margin-top">
                                <label class="control-label">&nbsp;</label>
                                <div class="toggle">
                                    <input id="useStuff" type="checkbox" data-bind="checked: samePrefixesForBothDirections" />
                                    <label for="useStuff" data-bind="html: $root.useForBothDirectionsHtml"></label>
                                </div>
                            </div>
                            <div class="form-group" data-bind="validationElement: inputPrefixSinkToHub().path">
                                <label for="sinkToHub" class="control-label"><span data-bind="i18n: 'editReplicationHubTask:paths.sinkToHubLabel'"></span>
                                    <small id="sink-to-hub-info" class="margin-left margin-left-sm" data-toggle="tooltip" data-placement="bottom"><i class="icon-info text-info"></i></small>
                                </label>
                                <div class="flex-grow" id="sinkToHub" data-bind="collapse: !samePrefixesForBothDirections(), validationElement: sinkToHubPrefixes">
                                    <div class="flex-horizontal">
                                        <div class="flex-grow">
                                            <input type="text" class="form-control" data-bind="textInput: inputPrefixSinkToHub().path, i18nAttr: { placeholder: 'editReplicationHubTask:paths.placeholder' }" />
                                        </div>
                                        <button class="btn btn-info"
                                                data-bind="click: addSinkToHubInputPrefixWithBlink, enable: inputPrefixSinkToHub && inputPrefixSinkToHub().path() && inputPrefixSinkToHub().path.isValid()">
                                                <i class="icon-plus"></i><span data-bind="i18n: 'editReplicationHubTask:paths.addPath'"></span>
                                        </button>
                                    </div>
                                    <div data-bind="visible: sinkToHubPrefixes().length" class="margin-top">
                                        <ul class="well collection-list" data-bind="foreach: sinkToHubPrefixes">
                                            <li>
                                                <div class="name" data-bind="text: $data.path()"></div>
                                                <a href="#" data-bind="click: $parent.removePrefixPathSinkToHub.bind($parent, $data.path()), i18nAttr: { title: 'editReplicationHubTask:paths.removeTitle' }"><i class="icon-trash"></i></a>
                                            </li>
                                        </ul>
                                    </div>
                                    <span class="help-block" data-bind="validationMessage: sinkToHubPrefixes"></span>
                                    <div class="padding padding-xs text-warning bg-warning" data-bind="visible: hasSingleDocumentPattern(sinkToHubPrefixes())">
                                        <small><i class="icon-warning"></i><span data-bind="text: getSingleDocumentPatternWarning()"></span></small>
                                    </div>
                                </div>
                                <div data-bind="visible: samePrefixesForBothDirections">
                                    <div class="form-control-static" data-bind="html: $root.sameAsHubToSinkHtml"></div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="margin-bottom">
                            <div class="margin-bottom margin-bottom-xs">
                                <h3 data-bind="i18n: 'editReplicationHubTask:sinkInfo.heading'"></h3>
                            </div>
                            <div class="form-group" data-bind="validationElement: certificateInfoWasSavedForSinkTask">
                                <label class="control-label">&nbsp;</label>
                                <div>
                                    <div class="flex-horizontal">
                                        <div class="has-disable-reason" data-placement="bottom"
                                             data-bind="i18nAttr: { 'data-original-title': $root.spinners.generateCertificate() || disableExport() ?
                                                                'editReplicationHubTask:sinkInfo.exportDisabledReason' : null,
                                                                'title': !$root.spinners.generateCertificate() && !disableExport() ?
                                                                'editReplicationHubTask:sinkInfo.exportTitle' : null }">
                                            <button class="btn btn-default"
                                                    data-bind="click: $root.exportAccessConfiguration,
                                                               disable: $root.spinners.generateCertificate() || disableExport()">
                                                <i class="icon-export"></i><span data-bind="i18n: 'editReplicationHubTask:sinkInfo.exportAccessConfiguration'"></span>
                                            </button>
                                        </div>
                                        <div class="has-disable-reason" data-placement="bottom"
                                             data-bind="if: isNewAccessItem,
                                                        i18nAttr: { 'data-original-title': $root.spinners.generateCertificate() || disableDownload() ?
                                                                 usingExistingCertificate() ? 'editReplicationHubTask:sinkInfo.downloadExistingCertificateReason' :
                                                                'editReplicationHubTask:sinkInfo.downloadNoCertificateReason' : null,
                                                                'title': !$root.spinners.generateCertificate() && !disableDownload() ?
                                                                'editReplicationHubTask:sinkInfo.downloadTitle' : null }">
                                            <button class="btn btn-default"
                                                    data-bind="click: $root.downloadCertificate,
                                                               disable: $root.spinners.generateCertificate() || disableDownload()">
                                                <i class="icon-export"></i><span data-bind="i18n: 'editReplicationHubTask:sinkInfo.downloadCertificate'"></span>
                                            </button>
                                        </div>
                                    </div>
                                    <span class="help-block" data-bind="validationMessage: certificateInfoWasSavedForSinkTask"></span>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="flex-horizontal pull-right margin-top">
                            <div>
                                <button class="btn btn-default"
                                        data-bind="click: $root.cancelReplicationAccessOperation, i18nAttr: { title: 'editReplicationHubTask:access.cancelTitle' }">
                                    <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                                </button>
                            </div>
                            <div data-bind="visible: $parent.withFiltering">
                                <button class="btn btn-default"
                                        data-bind="click: $root.cloneReplicationAccessItem, disable: $root.spinners.generateCertificate, i18nAttr: { title: 'editReplicationHubTask:access.cloneTitle' }">
                                    <i class="icon-clone"></i><span data-bind="i18n: 'editReplicationHubTask:access.clone'"></span>
                                </button>
                            </div>
                            <div>
                                <button class="btn btn-primary"
                                        data-bind="disable: $root.spinners.saveReplicationAccess() || $root.spinners.generateCertificate() || !dirtyFlag().isDirty(),
                                                   css: { 'btn-spinner': $root.spinners.saveReplicationAccess }, click: $root.saveReplicationAccessItem,
                                                   i18nAttr: { title: 'editReplicationHubTask:access.saveTitle' }">
                                    <i class="icon-save"></i><span data-bind="i18n: 'common:save'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script type="text/html" id="access-item-buttons">
    <button class="btn btn-sm btn-default"
            data-bind="click: _.partial($root.editReplicationAccessItem, $data), i18nAttr: { title: 'editReplicationHubTask:accessList.editTitle' }">
        <i class="icon-edit"></i><span data-bind="i18n: 'editReplicationHubTask:accessList.edit'"></span>
    </button>
    <button class="btn btn-sm btn-primary"
            data-bind="click: _.partial($root.deleteReplicationAccessItem, $data), disable: $root.editedReplicationAccessItem(), i18nAttr: { title: 'editReplicationHubTask:accessList.deleteTitle' }">
        <i class="icon-trash"></i>
    </button>
</script>
