<form data-bind="submit: saveDocument, css: { 'diff': inDiffMode }" class="edit-document" autocomplete="off">
    <div class="docEditor flex-window flex-grow content-margin" data-bind="style: { 'z-index': isFullScreenEditor() ? 1084 : undefined }">
        <div class="flex-window-head">
            <div class="flex-horizontal copy-area gap-3 margin-bottom margin-bottom-xs">
                <div class="left-header">
                    <div class="documentId">
                        <div data-bind="if: isCreatingNewDocument() && !isFullScreenEditor()">
                            <div class="input-group" data-bind="validationElement: userSpecifiedId">
                                <div class="input-group-addon" data-bind="i18n: 'editDocument:idLabel'"></div>
                                <input class="form-control"
                                       name="documentId"
                                       id="documentIdInput"
                                       data-bind="textInput: userSpecifiedId, disable: $root.isBusy, hasFocus: userIdHasFocus(), i18nAttr: { placeholder: 'editDocument:idPlaceholder' }">
                            </div>
                        </div>
                        <div class="flex-horizontal gap-2" data-bind="if: !isCreatingNewDocument()">
                            <!-- todo: bring back the star when doing issue RavenDB-8110 (vNext) -->
                            <!--<a class="reset-color btn-toggle markFavourite" data-bind="click: connectedDocuments.toggleStar">-->
                                <!--<span data-bind="attr: { class: connectedDocuments.currentDocumentIsStarred()?'icon-star-filled favorite':'icon-star' }"></span>-->
                            <!--</a>-->
                            <span class="obj-name on-base-background" data-bind="text: userSpecifiedId, attr: { title: userSpecifiedId }"></span>
                            <span data-bind="visible: revisionText(), text: revisionText()" class="text-primary revision flex-shrink-0"></span>
                            <span data-bind="visible: archivedText(), text: archivedText()" class="text-primary archived flex-shrink-0"></span>
                            <a href="#" class="inherit-position" data-bind="click: copyDocumentIdToClipboard, i18nAttr: { title: 'editDocument:copyIdTitle' }"><i class="icon-copy"></i></a>
                        </div>
                    </div>
                </div>
                <div class="flex-horizontal flex-shrink-0 gap-2">
                    <a target="_blank" href="#" class="flex-shrink-0"
                       data-bind="attr: { href: rawJsonUrl }, visible: !isCreatingNewDocument() && !isDeleteRevision(), i18nAttr: { title: 'editDocument:rawContentTitle' }"><i class="icon-json"></i>
                    </a>
                    <div class="flex-shrink-0" data-bind="visible: !inDiffMode()">
                        <p class="pull-right-md text-right-md padding padding-xs on-base-background" data-bind="if: displayLastModifiedDate()">
                            <i class="icon-recent"></i>
                            <small data-bind="i18n: { key: 'editDocument:lastModified', options: { ago: $root.lastModifiedAsAgo } }"></small>
                        </p>
                        <p class="pull-right-md bg-warning padding padding-xs" data-bind="visible: displayDocumentChange() && !displayDocumentDeleted()">
                            <small>
                                <i class="icon-warning"></i>
                                <span data-bind="i18n: 'editDocument:modifiedOutside'"></span>
                                <a href="#" data-bind="click: refreshDocument, i18n: 'editDocument:clickToRefresh'"></a>
                            </small>
                        </p>
                        <p class="pull-right-md bg-warning padding padding-xs" data-bind="visible: displayDocumentDeleted">
                            <small>
                                <i class="icon-warning"></i>
                                <span data-bind="i18n: 'editDocument:deletedOutside'"></span>
                                <a href="#" data-bind="click: navigateAfterExternalDelete, i18n: 'editDocument:goToRecentDocument'"></a>
                            </small>
                        </p>
                    </div>
                </div>
            </div>
            <div class="btn-bar toolbar">
                <div class="pull-left-sm">
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary save-btn" 
                                data-bind="enable: isSaveEnabled, css: { 'btn-spinner': isSaving }, visible: !inReadOnlyMode() && !inDiffMode(), 
                                           i18nAttr: { 'title': isSaveEnabled ? 'editDocument:toolbar.saveTitle' : null }, requiredAccess: 'DatabaseReadWrite'">
                            <i class="icon-save"></i>
                            <span data-bind="i18n: 'common:save'"></span>
                        </button>
                        <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                                data-bind="visible: !inReadOnlyMode() && !inDiffMode(), enable: isSaveEnabled, requiredAccess: 'DatabaseReadWrite'">
                            <span class="caret"></span>
                            <span class="sr-only" data-bind="i18n: 'editDocument:toolbar.toggleDropdown'"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="#" data-bind="click: () => handleSaveDocument(true), enable: isSaveEnabled">
                                    <i class="icon-cluster"></i>
                                    <span data-bind="i18n: 'editDocument:toolbar.saveClusterWide'"></span>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <button type="button" class="clone-btn btn btn-default"
                            data-bind="click: tryCreateClone, enable: cloneEnabled, visible: !isDeleteRevision() && !inDiffMode() && !isClone(), requiredAccess: 'DatabaseReadWrite'">
                        <i class="icon-clone"></i>
                        <span data-bind="i18n: 'editDocument:toolbar.clone'"></span>
                    </button>
                    <div class="btn-group">
                        <button type="button" class="delete-btn btn btn-danger"
                                data-bind="click: isRevision() ? deleteRevision : deleteDocument, enable: !isCreatingNewDocument(), visible: isRevision() && !inDiffMode() || !inReadOnlyMode() && !inDiffMode() && !isClone() && !isCreatingNewDocument(), requiredAccess: 'DatabaseReadWrite'">
                            <i class="icon-trash"></i>
                            <span data-bind="i18n: 'common:delete'"></span>
                        </button>
                        <button type="button" class="btn btn-danger dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                                data-bind="visible: !isRevision() && !inReadOnlyMode() && !inDiffMode() && !isClone() && !isCreatingNewDocument(), enable: !isCreatingNewDocument(), requiredAccess: 'DatabaseReadWrite'">
                            <span class="caret"></span>
                            <span class="sr-only" data-bind="i18n: 'editDocument:toolbar.toggleDropdown'"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="#" data-bind="click: () => handleDeleteDocument(true), enable: !isCreatingNewDocument()">
                                    <i class="icon-cluster"></i>
                                    <span data-bind="i18n: 'editDocument:toolbar.deleteClusterWide'"></span>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <a data-bind="attr: { href: latestRevisionUrl }, visible: inReadOnlyMode() && !isDeleteRevision()" class="btn btn-default">
                        <i class="icon-latest"></i>
                        <span data-bind="i18n: 'editDocument:toolbar.seeCurrentDocument'"></span>
                    </a>
                    <button class="btn btn-default" data-bind="click: enterCompareModeAndCompareWithPrevious, visible: compareButtonVisible, i18nAttr: { title: 'editDocument:toolbar.compareTitle' }">
                        <i class="icon-diff"></i>
                        <span data-bind="i18n: 'editDocument:toolbar.compare'"></span>
                    </button>
                    <button class="btn btn-default" data-bind="click: exitCompareMode, visible: inDiffMode()">
                        <i class="icon-cancel"></i>
                        <span data-bind="i18n: 'editDocument:toolbar.exitCompare'"></span>
                    </button>
                </div>
                <div class="pull-right-sm" data-bind="visible: !isDeleteRevision()">
                    <div class="btn-group" data-bind="visible: !inDiffMode()">
                        <a class="btn continue-ai-agent-conversation" data-bind="visible: aiAgentConversationUrl(), attr: { href: aiAgentConversationUrl() }" >
                            <i class="icon-ai-agents"></i>
                            <span data-bind="i18n: isAiAgentHistory() ? 'editDocument:toolbar.seeConversation' : 'editDocument:toolbar.continueConversation'"></span>
                        </a>

                        <button type="button" class="btn btn-default"
                                data-bind="click: validateDocumentSchema,
                                           visible: canValidateDocument(),
                                           i18nAttr: { title: 'editDocument:toolbar.validateDocument' }">
                            <i class="icon-start"></i>
                            <span data-bind="i18n: 'editDocument:toolbar.validateDocument'"></span>
                        </button>

                        <button type="button" class="btn btn-default" data-bind="click: copyDocumentBodyToClipboard, enable: !showHugeDocumentWarning(), i18nAttr: { title: 'editDocument:toolbar.copyToClipboardTitle' }">
                            <i class="icon-copy-to-clipboard"></i>
                            <span data-bind="i18n: 'editDocument:toolbar.copyToClipboard'"></span>
                        </button>
                        <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="caret"></span>
                            <span class="sr-only" data-bind="i18n: 'editDocument:toolbar.toggleDropdown'"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li data-bind="visible: !canViewCSharpClass()" class="disabled"><a class="disabled" data-bind="i18n: 'editDocument:toolbar.viewCSharpClass'"></a></li>
                            <li data-bind="visible: canViewCSharpClass()"><a data-bind="click: generateClass, i18n: 'editDocument:toolbar.viewCSharpClass'" href="#"></a></li>
                        </ul>
                    </div>
                </div>
                <div class="pull-right-sm" data-bind="visible: inDiffMode()">
                    <div class="radio-toggle d-flex justify-content-center">
                        <input type="radio" id="radio-toggle-left" name="CompressAllCollections" value="previous" data-bind="checked: diffMode">
                        <label for="radio-toggle-left" data-bind="i18n: 'editDocument:diff.previous', i18nAttr: { title: 'editDocument:diff.previousTitle' }"></label>
                        <input type="radio" id="radio-toggle-right" name="CompressAllCollections" value="manual" data-bind="checked: diffMode">
                        <label for="radio-toggle-right" data-bind="i18n: 'editDocument:diff.manual', i18nAttr: { title: 'editDocument:diff.manualTitle' }"></label>
                        <div class="toggle-knob">
                            <i class="icon-diff m-0"></i><i class="icon-documents m-0"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" data-bind="visible: inDiffMode()">
                <div class="col-md-6 text-center d-flex">
                    <span data-bind="visible: currentDiff() && !currentDiff().identicalContent()">
                        <span class="text-success" data-bind="visible: $root.leftRevisionIsNewer(), i18n: 'editDocument:diff.newerRevision'"></span>
                        <span class="text-warning" data-bind="visible: !$root.leftRevisionIsNewer(), i18n: 'editDocument:diff.olderRevision'"></span>
                    </span>
                    <div class="flex-grow"></div>
                    <div data-bind="if: comparingWith" class="margin-left margin-left-sm inline-block">
                        <div class="btn-group">
                            <div data-bind="visible: diffMode() !== 'manual'">
                                <button
                                  data-bind="click: () => copyRevisionTimestampToClipboard($root.comparingWith().__metadata.lastModified()), i18nAttr: { title: 'editDocument:diff.copyOlderTimestampTitle' }"
                                  class="btn btn-sm btn-default">
                                    <i class="icon-copy"></i>
                                </button>
                                <span data-bind="text: $root.comparingWith().__metadata.lastModified()"></span>
                                <i data-bind="visible: $root.comparingWith().__metadata.hasFlag('Conflicted'), i18nAttr: { title: 'editDocument:diff.conflictedRevisionTitle' }" class="icon-conflicts"></i>
                                <i data-bind="visible: $root.comparingWith().__metadata.hasFlag('Resolved'), i18nAttr: { title: 'editDocument:diff.resolvedRevisionTitle' }" class="icon-tick"></i>
                            </div>
                            <button class="btn btn-sm btn-default"
                                    data-bind="click: _.partial(revisionNavigate, 'newer', 'left'), enable: canNavigateObservable('newer', 'left'), visible: diffMode() === 'manual', i18nAttr: { title: 'editDocument:diff.newerRevisionTitle' }">
                                <i class="icon-arrow-up"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-default dropdown-toggle" data-toggle="dropdown" data-bind="visible: diffMode() === 'manual', i18nAttr: { title: 'editDocument:diff.chooseRevisionTitle' }">
                                <span data-bind="text: $root.comparingWith().__metadata.lastModified()"></span>
                                <i data-bind="visible: $root.comparingWith().__metadata.hasFlag('Conflicted'), i18nAttr: { title: 'editDocument:diff.conflictedRevisionTitle' }" class="icon-conflicts"></i>
                                <i data-bind="visible: $root.comparingWith().__metadata.hasFlag('Resolved'), i18nAttr: { title: 'editDocument:diff.resolvedRevisionTitle' }" class="icon-tick"></i>
                                <span class="caret margin-left margin-left-sm"></span>
                            </button>
                            <ul class="dropdown-menu" data-bind="foreach: revisionsToCompare">
                                <li data-bind="css: { active: $data === $root.comparingWith() }">
                                    <a href="#" data-bind="click: _.partial($root.changeLeftRevision, $data)">
                                        <span data-bind="text: $data.__metadata.lastModified()"></span>
                                        <i data-bind="visible: $data.__metadata.hasFlag('Conflicted'), i18nAttr: { title: 'editDocument:diff.conflictedRevisionTitle' }" class="icon-conflicts"></i>
                                        <i data-bind="visible: $data.__metadata.hasFlag('Resolved'), i18nAttr: { title: 'editDocument:diff.resolvedRevisionTitle' }" class="icon-tick"></i>
                                    </a>
                                </li>
                            </ul>
                            <button class="btn btn-sm btn-default"
                                    data-bind="click: _.partial(revisionNavigate, 'older', 'left'), enable: canNavigateObservable('older', 'left'), visible: diffMode() === 'manual', i18nAttr: { title: 'editDocument:diff.olderRevisionTitle' }">
                                <i class="icon-arrow-down"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-center d-flex">
                    <span data-bind="visible: currentDiff() && !currentDiff().identicalContent()">
                        <span class="text-warning" data-bind="visible: $root.leftRevisionIsNewer(), i18n: 'editDocument:diff.olderRevision'"></span>
                        <span class="text-success" data-bind="visible: !$root.leftRevisionIsNewer(), i18n: 'editDocument:diff.newerRevision'"></span>
                    </span>
                    <div class="flex-grow"></div>
                    <div class="margin-left margin-left-sm inline-block">
                        <button data-bind="click: () => copyRevisionTimestampToClipboard(document().__metadata.lastModified()), i18nAttr: { title: 'editDocument:diff.copyNewerTimestampTitle' }"
                                class="btn btn-sm btn-default">
                            <i class="icon-copy"></i>
                        </button>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-default"
                                    data-bind="click: _.partial(revisionNavigate, 'newer', 'right'), enable: canNavigateObservable('newer', 'right'), i18nAttr: { title: 'editDocument:diff.newerRevisionTitle' }">
                                <i class="icon-arrow-up"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-default dropdown-toggle" data-toggle="dropdown" 
                                    data-bind="i18nAttr: { 'title': diffMode() === 'manual' ? 'editDocument:diff.chooseRevisionTitle' : 'editDocument:diff.chooseRevisionInPreviousModeTitle' }">
                                <span data-bind="text: document().__metadata.lastModified()"></span>
                                <i data-bind="visible: document().__metadata.hasFlag('Conflicted'), i18nAttr: { title: 'editDocument:diff.conflictedRevisionTitle' }" class="icon-conflicts"></i>
                                <i data-bind="visible: document().__metadata.hasFlag('Resolved'), i18nAttr: { title: 'editDocument:diff.resolvedRevisionTitle' }" class="icon-tick"></i>
                                <span class="caret margin-left margin-left-sm"></span>
                            </button>
                            <ul class="dropdown-menu" data-bind="foreach: revisionsToCompare">
                                <li data-bind="css: { active: $data.__metadata.changeVector() === $root.document().__metadata.changeVector() }, visible: $root.diffMode() === 'previous' ? $index() < $root.revisionsToCompare().length - 1 : true">
                                    <a href="#" data-bind="click: _.partial($root.changeRightRevision, $data)">
                                        <span data-bind="text: $data.__metadata.lastModified()"></span>
                                        <i data-bind="visible: $data.__metadata.hasFlag('Conflicted'), i18nAttr: { title: 'editDocument:diff.conflictedRevisionTitle' }" class="icon-conflicts"></i>
                                        <i data-bind="visible: $data.__metadata.hasFlag('Resolved'), i18nAttr: { title: 'editDocument:diff.resolvedRevisionTitle' }" class="icon-tick"></i>
                                    </a>
                                </li>
                            </ul>
                            <button class="btn btn-sm btn-default"
                                    data-bind="click: _.partial(revisionNavigate, 'older', 'right'), enable: canNavigateObservable('older', 'right'), i18nAttr: { title: 'editDocument:diff.olderRevisionTitle' }">
                                <i class="icon-arrow-down"></i>
                            </button>
                        </div>
                       
                    </div>
                </div>
            </div>
            <div class="clearfix" data-bind="visible: !isDeleteRevision() && !inDiffMode()">
                <div class="btn-group btn-group-sm pull-right" role="group" data-bind="visible: !inDiffMode()">
                    <button type="button" class="btn btn-default"
                            data-bind="enable: !isNewLineFriendlyMode(), click: formatDocument, i18nAttr: { title: 'editDocument:editor.formatTitle' }">
                        <i class="icon-indent"></i><span data-bind="i18n: 'editDocument:editor.format'"></span>
                    </button>
                    <button class="btn btn-default" data-bind="click: toggleCollapse">
                        <i data-bind="attr: { class: isDocumentCollapsed() ? 'icon-unfold' : 'icon-fold'} "></i>
                        <span data-bind="i18n: isDocumentCollapsed() ? 'editDocument:editor.expand' : 'editDocument:editor.collapse'"></span>
                    </button>
                    <button type="button" class="btn btn-default" data-toggle="button"
                            data-bind="click: toggleNewlineMode, i18nAttr: { title: 'editDocument:editor.newLinesTitle' }">
                        <i class="icon-newline"></i><span data-bind="i18n: 'editDocument:editor.toggleNewLines'"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="flex-window-scroll editors-container">
            <div class="left-editor">
                <pre id="docEditorLeft" class="form-control absolute-fill"
                     data-bind="aceEditor: { code: documentTextLeft, fontSize:'16px', lang: 'ace/mode/raven_document', readOnly: inReadOnlyMode() || inDiffMode() || isReadOnlyAccess() },
                                disable: isBusy, validationOptions: { errorsAsTitle: false }, validationElement: documentText, visible: !isDeleteRevision()"></pre>
            </div>
            <div class="right-editor">
                <pre id="docEditor" class="form-control absolute-fill"
                     data-bind="aceEditor: { code: documentText, fontSize:'16px', lang: 'ace/mode/raven_document', readOnly: inReadOnlyMode() || inDiffMode() || isReadOnlyAccess() },
                                disable: isBusy, validationOptions: { errorsAsTitle: false }, validationElement: documentText, visible: !isDeleteRevision() && !showHugeDocumentWarning()"></pre>
                <div class="absolute-fill" data-bind="visible: isDeleteRevision()">
                    <div class="absolute-center padding padding-lg bg-info text-center">
                        <i class="icon-trash icon-xl"></i>
                        <div data-bind="html: deletedRevisionRemovedOnHtml"></div>
                        <div data-bind="html: deletedRevisionFlagsHtml"></div>
                        <div class="margin-top"><span data-bind="i18n: 'editDocument:deletedRevision.goTo'"></span> <a href="#" class="text-revisions" data-bind="click: _.partial(connectedDocuments.activateRevisions, true), i18n: 'editDocument:deletedRevision.revisionsLink'"></a> <span data-bind="i18n: 'editDocument:deletedRevision.seeHistory'"></span>
                        </div>
                    </div>
                </div>
                <div class="absolute-fill" data-bind="visible: showHugeDocumentWarning()">
                    <div class="absolute-center padding padding-lg bg-info">
                        <div class="padding" data-bind="html: hugeDocumentWarningHtml"></div>
                        <div class="padding text-left">
                            <span data-bind="i18n: 'editDocument:hugeDocument.selectHowToContinue'"></span> <br />
                        </div>
                        <div class="padding text-center">
                            <button class="btn btn-warning" 
                                    data-bind="click: reLoadDocument, i18nAttr: { title: { key: 'editDocument:hugeDocument.openTitle', options: { context: inReadOnlyMode() ? 'revision' : 'document' } } }, css: { 'btn-spinner': isBusy }">
                                <i class="icon-preview"></i>
                                <span data-bind="i18n: isBusy() ? 'editDocument:hugeDocument.loading' : { key: 'editDocument:hugeDocument.open', options: { context: inReadOnlyMode() ? 'revision' : 'document' } }"></span>
                            </button>
                            <button class="btn btn-success"
                                    data-bind="click: viewRaw, i18nAttr: { title: { key: 'editDocument:hugeDocument.viewRawTitle', options: { context: inReadOnlyMode() ? 'revision' : 'document' } } }, disable: isBusy">
                                <i class="icon-json"></i>
                                <span data-bind="i18n: 'editDocument:hugeDocument.viewRaw'"></span>
                            </button>
                            <button class="btn btn-info"
                                    data-bind="click: downloadDocument, i18nAttr: { title: { key: 'editDocument:hugeDocument.downloadTitle', options: { context: inReadOnlyMode() ? 'revision' : 'document' } } }, disable: isBusy">
                                <i class="icon-export"></i>
                                <span data-bind="i18n: { key: 'editDocument:hugeDocument.download', options: { context: inReadOnlyMode() ? 'revision' : 'document' } }"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
           
        </div>
        <div data-bind="validationOptions: { errorsAsTitle: false }, validationElement: documentText">
            <div class="help-block" data-bind="validationMessage: documentText"></div>
        </div>
        <small data-bind="visible: inReadOnlyMode() && !isDeleteRevision() && !inDiffMode() && !isReadOnlyAccess()" class="text-warning bg-warning padding padding-sm">
            <i class="icon-warning"></i>
            <span data-bind="i18n: 'editDocument:readOnly.revisions'"></span>
        </small>
        <small data-bind="visible: isReadOnlyAccess" class="text-warning bg-warning padding padding-sm">
            <i class="icon-warning"></i>
            <span data-bind="i18n: 'editDocument:readOnly.insufficientAccess'"></span>
        </small>
        <div class="differences_summary" data-bind="visible: currentDiff, with: currentDiff">
            <div class="padding padding-sm" data-bind="visible: identicalContent">
                <small class="text-success" data-bind="i18n: 'editDocument:diff.identical'"></small>
            </div>
            <div class="padding padding-sm" data-bind="visible: !identicalContent()">
                <small class="text-warning" data-bind="html: $root.diffSummaryHtml"></small>
            </div>
        </div>
    </div>
    <div id="right-options-panel" class="flex-window" data-bind="css: { collapse: !propertiesPanelVisible() }">
        <div class="collapse-options-panel-container">
            <button class="collapse-options-panel btn btn-sm" data-bind="click: togglePropertiesPanel, i18nAttr: { title: 'editDocument:properties.collapseTitle' }"><i class="icon-arrow-right"></i></button>
            <button class="show-options-panel btn btn-sm" data-bind="click: togglePropertiesPanel, i18nAttr: { title: 'editDocument:properties.expandTitle' }"><i class="icon-arrow-left"></i></button>
        </div>
        <div class="panel document-properties flex-window-head copy-area">
            <div class="panel-body">
                <h3 class="margin-none" data-bind="i18n: 'editDocument:properties.title'"></h3>
                <hr class="small" />
                <dl class="dl-horizontal small" data-bind="with: metadata">
                    <div data-bind="visible: shardNumber != null">
                        <dt data-bind="i18n: 'editDocument:properties.shard'"></dt>
                        <dd>
                            <span class="label label-default">
                                # <span data-bind="text: shardNumber"></span>    
                            </span>
                        </dd>
                    </div>
                    <div data-bind="visible: !$root.isCreatingNewDocument()">
                        <dt data-bind="i18n: 'editDocument:properties.changeVector'"></dt>
                        <dd>
                            <div class="flex-horizontal">
                                <div data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true" data-bind="tooltipText: $root.changeVectorHtml()">
                                    <div class="change-vector" data-bind="foreach: $root.changeVector">
                                        <span class="badge badge-default" data-bind="text: shortFormat"></span>
                                    </div>
                                </div>
                                <div>
                                    <a href="#" class="copy-button-hidden" data-bind="click: $root.copyChangeVectorToClipboard, i18nAttr: { title: 'editDocument:properties.copyChangeVectorTitle' }"><i class="icon-copy"></i></a>
                                </div>
                            </div>
                        </dd>
                        <dt data-bind="i18n: 'editDocument:properties.modified'"></dt>
                        <dd>
                            <span data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true"
                                  data-bind="tooltipText: $root.lastModifiedTooltipHtml">
                                <span data-bind="text: lastModifiedInterval"></span>
                            </span>
                        </dd>
                    </div>
                    <div data-bind="if: expirationDateInterval">
                        <dt data-bind="i18n: 'editDocument:properties.expires'"></dt>
                        <dd>
                             <span data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true"
                                   data-bind="tooltipText: $root.expirationTooltipHtml">
                                <span data-bind="text: expirationDateInterval"></span>
                            </span>
                            <span data-toggle="tooltip" data-animation="true" data-html="true" data-placement="bottom"
                                  data-bind="visible: !$root.documentExpirationEnabled(), tooltipText: $root.expirationOffTooltipHtml">
                                <i class="icon-danger text-warning"></i>
                            </span>
                        </dd>
                    </div>
                    <div data-bind="if: archiveAtDateInterval">
                        <dt data-bind="i18n: 'editDocument:properties.archiveIn'"></dt>
                        <dd>
                             <span data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true"
                                   data-bind="tooltipText: $root.archivalTooltipHtml">
                                <span data-bind="text: archiveAtDateInterval, visible: !archiveAtInPast() || $root.documentArchivalEnabled()"></span>
                                <s data-bind="text: archiveAtDateInterval, visible: archiveAtInPast() && !$root.documentArchivalEnabled()"></s>
                            </span>
                            <br data-bind="visible: archiveAtInPast() && !$root.documentArchivalEnabled()" /> 
                            <span class="text-warning" data-bind="visible: archiveAtInPast() && !$root.documentArchivalEnabled(), i18n: 'editDocument:properties.archivalOffWarning'"></span>
                            <span data-toggle="tooltip" data-animation="true" data-html="true" data-placement="bottom"
                                  data-bind="visible: !$root.documentArchivalEnabled(), tooltipText: $root.archivalOffTooltipHtml">
                                <i class="icon-danger text-warning"></i>
                            </span>
                        </dd>
                    </div>
                    <div data-bind="if: refreshDateInterval">
                        <dt data-bind="i18n: 'editDocument:properties.refresh'"></dt>
                        <dd>
                             <span data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true"
                                   data-bind="tooltipText: $root.refreshTooltipHtml">
                                <span data-bind="text: refreshDateInterval"></span>
                            </span>
                            <span data-toggle="tooltip" data-animation="true" data-html="true" data-placement="bottom"
                                  data-bind="visible: !$root.documentRefreshEnabled(), tooltipText: $root.refreshOffTooltipHtml">
                                <i class="icon-danger text-warning"></i>
                            </span>
                        </dd>
                    </div>
                    <dt data-bind="i18n: 'editDocument:properties.size'"></dt>
                    <dd>
                        <span data-placement="left" data-toggle="tooltip" data-html="true" data-animation="true"
                             data-bind="tooltipText: $root.documentSizeHtml()">
                            <span data-bind="text: $root.computedDocumentSize()"></span>
                            <i class="icon-documents-compression margin-left-xs" data-bind="visible: $root.isCompressed()"></i>
                            <i class="icon-warning text-warning margin-left-xs" data-bind="visible: $root.isHugeDocument"></i>
                        </span>
                    </dd>
                    <dt data-bind="visible: $root.savedInClusterTransaction">
                       <i class="icon-cmp-xchg"></i> 
                    </dt>
                    <dd data-bind="visible: $root.savedInClusterTransaction">
                        <span data-bind="i18n: 'editDocument:properties.clusterTransaction'"></span>
                        <br />
                        <a data-bind="attr: { href: $root.atomicGuardUrl }, i18n: 'editDocument:properties.goToAtomicGuard'"></a>
                    </dd>
                </dl>
            </div>
        </div>
        <div class="panel connected-documents flex-window-scroll flex-window margin-none" data-bind="with: connectedDocuments">
            <div class="flex-window-head">
                <div class="btn-group btn-group-justified btn-tabs" role="group">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-attachments"
                                data-bind="css: { active: isAttachmentsActive() }, click: $root.activateAttachmentsTab, disable: !$root.canViewAttachments()">
                            <i class="icon-attachment"></i>
                            <span data-bind="i18n: 'editDocument:tabs.attachments'"></span>
                            <div data-bind="text: $root.getBadgeText($root.crudActionsProvider().attachmentsCount),
                                            attr: { class: $root.getBadgeClasses($root.crudActionsProvider().attachmentsCount),
                                                    title: $root.getBadgeTitle($root.crudActionsProvider().attachmentsCount) }">
                            </div>
                        </button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-counters"
                                data-bind="css: { active: isCountersActive() }, click: activateCounters, disable: !$root.canViewCounters()">
                            <i class="icon-new-counter"></i>
                            <span data-bind="i18n: 'editDocument:tabs.counters'"></span>
                            <div data-bind="text: $root.getBadgeText($root.crudActionsProvider().countersCount),
                                            attr: { class: $root.getBadgeClasses($root.crudActionsProvider().countersCount),
                                                    title: $root.getBadgeTitle($root.crudActionsProvider().countersCount) }">
                            </div>
                        </button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-time-series"
                                data-bind="css: { active: isTimeSeriesActive() }, click: $root.activateTimeSeriesTab, disable: !$root.canViewTimeSeries()">
                            <i class="icon-new-time-series"></i>
                            <span data-bind="i18n: 'editDocument:tabs.timeSeries'"></span>
                            <div data-bind="text: $root.getBadgeText($root.crudActionsProvider().timeSeriesCount),
                                            attr: { class: $root.getBadgeClasses($root.crudActionsProvider().timeSeriesCount),
                                                    title: $root.getBadgeTitle($root.crudActionsProvider().timeSeriesCount) }">
                            </div>
                        </button>
                    </div>
                    <div class="btn-group" id="revisions_pane" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-revisions"
                                data-bind="css: { active: isRevisionsActive() }, click: _.partial(activateRevisions, false), disable: !$root.canViewRevisions()">
                            <i class="icon-revisions"></i>
                            <span data-bind="i18n: 'editDocument:tabs.revisions'"></span>
                            <div data-bind="text: $root.getBadgeText($root.crudActionsProvider().revisionsCount),
                                            attr: { class: $root.getBadgeClasses($root.crudActionsProvider().revisionsCount),
                                                    title: $root.getBadgeTitle($root.crudActionsProvider().revisionsCount) }">
                            </div>
                        </button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-related" data-bind="css: { active: isRelatedActive() }, click: activateRelated, disable: !$root.canViewRelated()">
                            <i class="icon-link"></i>
                            <span data-bind="i18n: 'editDocument:tabs.related'"></span>
                        </button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-xs btn-default doc-recent" data-bind="css: { active: isRecentActive() }, click: activateRecent">
                            <i class="icon-recent"></i>
                            <span data-bind="i18n: 'editDocument:tabs.recent'"></span>
                        </button>
                    </div>
                </div>
                <div class="search-documents" data-bind="visible: searchInputVisible">
                    <input type="search" class="form-control" data-bind="textInput: searchInput, i18nAttr: { placeholder: 'editDocument:tabs.searchPlaceholder' }" /><span class="icon-search"></span>
                </div>
                <div class="flex-window-head" data-bind="visible: isUploaderActive() && $root.canViewAttachments() && !$root.inReadOnlyMode(),
                                                         template: { name: 'uploader-template' }, requiredAccess: 'DatabaseReadWrite'">
                </div>
                <div data-bind="visible: isAttachmentsActive() && isClone()">
                    <div class="padding padding-xs margin-top margin-top-sm">
                        <div class="input-group file-input has-disable-reason" data-bind="i18nAttr: { 'data-original-title': 'editDocument:attachments.saveCloneFirst' }" data-placement="bottom">
                            <label class="btn btn-sm btn-primary btn-block" disabled>
                                <i class="icon-attachment"></i>
                                <span data-bind="i18n: 'editDocument:attachments.add'"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="flex-window-head" data-bind="visible: isCountersActive() && $root.canViewCounters() && !$root.inReadOnlyMode(), requiredAccess: 'DatabaseReadWrite'">
                    <div class="padding padding-xs margin-top margin-top-sm">
                        <button type="button" class="btn btn-sm btn-primary btn-block" data-bind="click: _.partial($root.crudActionsProvider().setCounter, null)">
                            <i class="icon-new-counter"></i>
                            <span data-bind="i18n: 'editDocument:counters.add'"></span>
                        </button>
                    </div>
                </div>
                <div class="flex-window-head" data-bind="visible: isTimeSeriesActive() && $root.canViewTimeSeries() && !$root.inReadOnlyMode(), requiredAccess: 'DatabaseReadWrite'">
                    <div data-bind="attr: { class: 'padding padding-xs margin-top margin-top-sm' + (isClone() ? ' has-disable-reason' : '') },
                                    i18nAttr: { 'data-original-title': isClone() ? 'editDocument:timeSeries.saveCloneFirst' : null }" data-placement="bottom">
                        <a data-bind="attr: { href: $root.createTimeSeriesUrl(), class: 'btn btn-sm btn-primary btn-block' + (isClone() ? ' disabled' : '') }">
                            <i class="icon-new-time-series"></i>
                            <span data-bind="i18n: 'editDocument:timeSeries.add'"></span>
                        </a>
                    </div>
                </div>
                <div class="flex-window-head" data-bind="visible: isRevisionsActive() && $root.canViewRevisions() && !$root.inReadOnlyMode(),
                     i18nAttr: { title: $root.dirtyFlag().isDirty() ? 'editDocument:revisions.saveChangesFirst' : 'editDocument:revisions.createHint' },
                     requiredAccess: 'DatabaseReadWrite'">
                    <div class="padding padding-xs margin-top margin-top-sm">
                        <button type="button" class="btn btn-sm btn-primary btn-block"
                                data-bind="click: $root.forceCreateRevision, disable: $root.dirtyFlag().isDirty(), css: { 'btn-spinner': $root.isSaving }">
                            <i class="icon-revisions"></i>
                            <span data-bind="i18n: 'editDocument:revisions.create'"></span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex-window-scroll">
                <div class="objects-list-container">
                    <virtual-grid class="resizable document-items-grid" params="controller: gridController"></virtual-grid>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="hidden">
    <form method="post" download target="hidden-form" id="downloadAttachmentAtRevisionForm">
        <input type="hidden" name="ChangeVectorAndType" />
        <input type="hidden" name="Type" value="Document" />
    </form>
</div>

<script type="text/html" id="uploader-template">
    <div class="padding padding-xs margin-top margin-top-sm">
        <div class="btn-group w-100 d-flex">
            <button type="button" class="btn btn-sm btn-primary flex-grow"
                    data-bind="click: () => $root.connectedDocuments.isAddAttachmentModalVisible(true)">
                <i class="icon-attachment"></i> <span data-bind="i18n: 'editDocument:attachments.add'"></span>
            </button>

            <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-toggle="dropdown"
                    aria-haspopup="true"
                    aria-expanded="false"
            >
                <span class="caret"></span>
                <span class="sr-only" data-bind="i18n: 'editDocument:toolbar.toggleDropdown'"></span>
            </button>

            <ul class="dropdown-menu uploader-template">
                <li class="add-remote-attachment">
                    <a href="#" data-bind="click: () => $root.connectedDocuments.isAddAttachmentWithRemoteParametersModalVisible(!$root.remoteAttachmentDisabledReason()), css: { 'disabled': $root.remoteAttachmentDisabledReason() }">
                        <i class="icon-remote-attachment"></i>
                        <span data-bind="i18n: 'editDocument:attachments.addRemote'"></span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</script>

<div class="tooltip json-preview document-items-tooltip" style="opacity: 0">
    <pre><code></code></pre>
</div>

<div data-bind="if: connectedDocuments.isAddAttachmentModalVisible()">
    <div data-bind="react: $root.connectedDocuments.addAttachmentModalView"></div>
</div>

<div data-bind="if: connectedDocuments.isAddAttachmentWithRemoteParametersModalVisible()">
    <div data-bind="react: $root.connectedDocuments.remoteAttachmentParametersModalView"></div>
</div>
