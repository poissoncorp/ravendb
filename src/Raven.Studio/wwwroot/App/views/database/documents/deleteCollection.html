<div class="modal-dialog" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="i18n: 'deleteCollection:title'"></h4>
        </div>
        <div class="modal-body">
            <div>
                <span data-bind="i18n: 'deleteCollection:deleting'"></span>
                <strong data-bind="text: collectionName"></strong>
                <strong data-bind="i18n: { key: 'deleteCollection:documentsCount', options: { count: itemsToDelete, formattedCount: itemsToDelete.toLocaleString() } }"></strong>.
            </div>
            <div class="padding">
                <div data-bind="visible: isAllDocuments && hasHiloDocuments" class="bg-warning padding">
                    <small><i class="icon-warning"></i> <span data-bind="i18n: 'deleteCollection:hiloNote'"></span><br />
                        <span data-bind="i18n: 'deleteCollection:hiloHint'"></span></small>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
            <button type="button" class="btn btn-primary" data-bind="click: deleteCollection, i18n: 'common:delete'"></button>
        </div>
    </div>
</div>
