<div class="modal-dialog prevent-close" id="setCounterModal" role="document">
    <form data-bind="submit: updateCounter" autocomplete="off" novalidate>
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'editDocument:close' }"><i class="icon-cancel"></i></button>
                <h2 class="modal-title" id="myModalLabel">
                    <i class="icon-new-counter"></i>
                    <span data-bind="i18n: { key: 'editDocument:setCounter.title', options: { context: createNewCounter() ? 'new' : 'update' } }"></span>
                </h2>
            </div>
            <div class="modal-body">
                <div data-bind="visible: createNewCounter()">
                    <div class="padding">
                        <div class="form-group row" data-bind="validationElement: counterName">
                            <div class="col-md-3">
                                <label for="counterNameInput" class="control-label"><span data-bind="i18n: 'editDocument:setCounter.nameLabel'"></span><i class="required"></i></label>
                            </div>
                            <div class="col-md-9">
                                <input type="text" id="counterNameInput" data-bind="textInput: counterName, i18nAttr: { placeholder: 'editDocument:setCounter.namePlaceholder' }" class="form-control" autofocus>
                            </div>
                        </div>
                        <div class="form-group row" data-bind="validationElement: newTotalValue">
                            <div class="col-md-3">
                                <label for="counterValueInput" class="control-label"><span data-bind="i18n: 'editDocument:setCounter.valueLabel'"></span><i class="required"></i></label>
                            </div>
                            <div class="col-md-9">
                                <input type="number" id="counterValueInput" data-bind="numericInput: newTotalValue, i18nAttr: { placeholder: 'editDocument:setCounter.valuePlaceholder' }" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div data-bind="visible: !createNewCounter()">
                    <div class="padding">
                        <div class="form-group row">
                           <div class="col-md-3">
                              <label for="counterName" class="control-label" data-bind="i18n: 'editDocument:setCounter.nameLabel'"></label>
                           </div>
                           <div class="col-md-9">
                              <input type="text" id="counterName" data-bind="textInput: counterName" disabled class="form-control">
                           </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-3">
                                <label for="counterTotalValue" class="control-label" data-bind="i18n: 'editDocument:setCounter.valueLabel'"></label>
                            </div>
                            <div class="col-md-9">
                                <input type="text" id="counterTotalValue" data-bind="textInput: totalValue().toLocaleString()" class="form-control" disabled>
                            </div>
                        </div>
                        <div class="form-group row" data-bind="validationElement: newTotalValue">
                            <div class="col-md-3">
                                <label for="counterTotalInput" class="control-label"><span data-bind="i18n: 'editDocument:setCounter.newValueLabel'"></span><i class="required"></i></label>
                            </div>
                            <div class="col-md-9">
                                <input type="number" id="counterTotalInput" data-bind="numericInput: newTotalValue, i18nAttr: { placeholder: 'editDocument:setCounter.newValuePlaceholder' }" class="form-control" autofocus>
                            </div>
                        </div>
                    </div>
                    <div class="panel padding" data-bind="visible: showPerNodeValues">
                        <div class="form-group">
                            <div data-bind="foreach: counterValuesPerNode">
                                <div class="row">
                                    <div class="col-md-4">
                                        <label data-bind="visible: $index() === 0, i18n: 'editDocument:setCounter.valuesPerNode'" class="control-label"></label>
                                    </div>
                                    <div class="col-md-3" data-bind="i18nAttr: { title: { key: 'editDocument:setCounter.databaseIdTitle', options: { databaseId: databaseId } } }">
                                        <span class="small" data-bind="i18n: 'editDocument:setCounter.node'"></span>
                                        <label class="control-label" data-bind="text: nodeTag"></label>
                                    </div>
                                    <div class="col-md-3">
                                        <span class="small" data-bind="i18n: 'editDocument:setCounter.value'"></span>
                                        <label class="control-label" data-bind="text: nodeCounterValue.toLocaleString()"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="padding text-right">
                    <button data-dismiss="modal" class="btn btn-default" data-bind="i18nAttr: { 'aria-label': 'editDocument:close' }">
                        <i class="icon-cancel"></i><span data-bind="i18n: 'common:cancel'"></span>
                    </button>
                    <button type="submit" class="btn btn-primary" data-bind="disable: $root.spinners.update(), css: { 'btn-spinner': $root.spinners.update }">
                        <i class="icon-save"></i>
                        <span data-bind="i18n: { key: 'editDocument:setCounter.submit', options: { context: createNewCounter() ? 'create' : 'update' } }"></span>
                    </button> 
                </div>
            </div>
        </div>
    </form>
</div>
