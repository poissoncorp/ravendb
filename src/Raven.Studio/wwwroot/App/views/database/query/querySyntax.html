<div class="modal-dialog modal-lg" role="document" id="querySyntaxDialog">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'query:syntaxDialog.close' }">
                <i class="icon-cancel"></i>
            </button>
            <div data-bind="i18n: 'query:syntaxDialog.title'"></div>
        </div>        
        <div class="modal-body">
            <div data-bind="foreach: $data.constructor.samples">
                <div class="flex-horizontal">
                    <div data-bind="text: title"></div>
                    <div class="flex-separator"></div>
                    <small data-bind="visible: $index() === 0, i18nAttr: { title: 'query:syntaxDialog.documentationTitle' }">
                        <a target="_blank" data-bind="attr: { href: 'https://ravendb.net/l/XXVECG/' + $root.clientVersion() }">
                            <i class="icon-link"></i><span data-bind="i18n: 'query:syntaxDialog.tutorial'"></span>
                        </a>
                    </small>
                </div>
                <pre class="margin-bottom copy-area"><a href="#" class="copy-button-hidden" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'query:syntaxDialog.copyTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
            </div>
        </div>
    </div>
</div>
