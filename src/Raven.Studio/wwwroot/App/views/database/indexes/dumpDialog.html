<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h3 class="modal-title" data-bind="i18n: 'editIndex:dump.title'"></h3>
        </div>
        <div class="modal-body">
            <form class="flex-form" data-bind="submit: dumpIndex" autocomplete="off">
                <div class="form-group margin-top word-break">
                    <label class="control-label" data-bind="i18n: 'editIndex:indexName.title'"></label>
                    <strong class="form-control-static" data-bind="text: indexName"></strong>
                </div>
                <div class="form-group margin-top margin-bottom margin-bottom-md" data-bind="validationElement: directoryPath">
                    <label class="control-label"><span data-bind="i18n: 'editIndex:dump.directoryPath'"></span><i class="required"></i></label>
                    <div class="flex-grow" data-bind="validationOptions: { insertMessages: false }">
                        <div class="dropdown btn-block">
                            <input type="text" class="form-control dropdown-toggle" data-toggle="dropdown" id="directoryPath"
                                   data-bind="textInput: directoryPath, hasFocus: directoryPathHasFocus, i18nAttr: { placeholder: 'editIndex:dump.directoryPathPlaceholder' }" />
                            <span class="caret dropdown-toggle" data-toggle="dropdown"></span>
                            <ul class="dropdown-menu max-height" data-bind="foreach: directoryPathOptions, autoComplete: '#directoryPath'">
                                <li data-bind="click: $parent.directoryPathChanged">
                                    <a href="#" data-bind="text: $data"></a>
                                </li>
                            </ul>
                        </div>
                        <span class="help-block" data-bind="validationMessage: directoryPath"></span>
                    </div>
                </div>

                <div class="form-group margin-top word-break" data-bind="visible: $root.db.getLocations().length > 1">
                    <label class="control-label"><span data-bind="i18n: 'editIndex:dump.context'"></span><i class="required"></i></label>
                    <div>
                        <div data-bind="react: locationSelectorOptions">
                        </div>
                        <div data-bind="validationElement: location">
                            <span class="help-block" data-bind="validationMessage: location"></span>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <div>
                <button class="btn btn-default" data-bind="click: close, i18nAttr: { title: 'editIndex:dialog.closeTitle' }">
                    <i class="icon-cancel"></i><span data-bind="i18n: 'editIndex:dialog.close'"></span>
                </button>
                <button type="submit" class="btn btn-primary" data-bind="click: dumpIndex, i18nAttr: { title: 'editIndex:toolbar.dumpTitle' }">
                    <i class="icon-dump-index-files"></i><span data-bind="i18n: 'editIndex:dump.dumpFiles'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
