<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title text-warning word-break" data-bind="visible: reasons().IsStale, i18n: { key: 'indexStalenessReasons:heading', options: { indexName: $root.indexName, context: 'stale' } }"></h4>
            <h4 class="modal-title text-success word-break" data-bind="visible: !reasons().IsStale, i18n: { key: 'indexStalenessReasons:heading', options: { indexName: $root.indexName, context: 'upToDate' } }"></h4>
        </div>
        <div class="modal-body" data-bind="with: reasons">
            
            <form class="form-horizontal">
                <div class="form-group">
                    <label class="col-md-3 control-label" data-bind="i18n: 'indexStalenessReasons:location'"></label>
                    <div class="col-md-9">
                        <div class="form-control-static" data-bind="text: $root.formatLocation()"></div>
                    </div>
                </div>

            </form>
            
            <div data-bind="visible: IsStale, i18n: 'indexStalenessReasons:reasonsIntro'"></div>
            
            <ul data-bind="foreach: StalenessReasons">
                <li data-bind="text: $data"></li>
            </ul>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: close, i18n: 'indexStalenessReasons:close'"></button>
        </div>
    </div>
</div>
