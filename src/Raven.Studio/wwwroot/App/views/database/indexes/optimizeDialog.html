<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h3 class="modal-title" data-bind="i18n: 'editIndex:optimize.title'"></h3>
        </div>
        <div class="modal-body">
            <div class="padding">
                <div class="bg-info padding">
                    <small>
                        <ul class="margin-bottom-sm margin-top-sm">
                            <li data-bind="i18n: 'editIndex:optimize.removeUnnecessaryData'"></li>
                            <li data-bind="i18n: 'editIndex:optimize.indexDisabled'"></li>
                            <li data-bind="i18n: 'editIndex:optimize.noReindexing'"></li>
                        </ul>
                    </small>
                </div>
            </div>
            
            <form class="flex-form" data-bind="submit: optimizeIndex" autocomplete="off">
                <div class="form-group margin-top word-break">
                    <label class="control-label" data-bind="i18n: 'editIndex:indexName.title'"></label>
                    <strong class="form-control-static" data-bind="text: indexName"></strong>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <div>
                <button class="btn btn-default" data-bind="click: close, i18nAttr: { title: 'editIndex:dialog.closeTitle' }">
                    <i class="icon-cancel"></i><span data-bind="i18n: 'editIndex:dialog.close'"></span>
                </button>
                <button type="submit" class="btn btn-primary" data-bind="click: optimizeIndex">
                    <i class="icon-compact"></i><span data-bind="i18n: 'editIndex:optimize.optimizeFiles'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
