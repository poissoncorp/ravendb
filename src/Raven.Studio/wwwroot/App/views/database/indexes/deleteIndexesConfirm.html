<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" data-bind="text: title"></h5>
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
        </div>
        <div class="modal-body">
            <p data-bind="visible: indexesInfoForDelete?.length > 0, html: subTitleHtml"></p>
            <ul data-bind="foreach: indexesInfoForDelete" style="max-height: 200px; overflow-y: auto;">
                <li class="padding padding-xs force-text-wrap">
                    <strong data-bind="text: indexName"></strong>
                    <small data-bind="if: reduceOutputCollection">
                        <span data-bind="visible: referenceCollection, i18n: { key: 'editIndex:deleteConfirm.reduceResultsCollections', options: { collection: reduceOutputCollection, referenceCollection: referenceCollection } }" class="margin-left margin-left-sm"></span>
                        <span data-bind="visible: !referenceCollection, i18n: { key: 'editIndex:deleteConfirm.reduceResultsCollection', options: { collection: reduceOutputCollection } }" class="margin-left margin-left-sm"></span>
                    </small>
                </li>
            </ul>
            <p data-bind="visible: lockedIndexNames?.length > 0, i18n: 'editIndex:deleteConfirm.skippingLocked'"></p>
            <ul data-bind="foreach: lockedIndexNames" style="max-height: 200px; overflow-y: auto;">
                <li class="padding padding-xs force-text-wrap">
                    <strong data-bind="text: $data"></strong>
                </li>
            </ul>
            <hr data-bind="visible: showWarning">
            <div data-bind="if: showWarning, visible: showWarning" class="flex-horizontal text-warning bg-warning margin">
                <span class="flex-start padding padding-sm">
                    <i class="icon-warning"></i>
                </span>
                <span class="padding padding-sm">
                    <span data-bind="i18n: 'editIndex:deleteConfirm.warning.collectionsCreated'"></span>
                    <ul class="margin-top-sm margin-bottom-sm padding-left-sm padding-right-xs">
                        <li data-bind="html: warningNoteHtml"></li>
                        <li class="margin-top-xs" data-bind="html: warningImportantHtml"></li>
                    </ul>
                </span>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
            <button type="button" class="btn btn-primary" data-bind="click: deleteIndexes, i18n: 'common:delete'"></button>
        </div>
    </div>
</div>
