<div class="modal-dialog modal-lg visualiserTreeExplorer" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h4 class="modal-title" data-bind="i18n: 'visualizer:treeExplorer.title'"></h4>
        </div>
        <div class="modal-body">
            <h3 data-bind="i18n: 'visualizer:treeExplorer.aggregationResult'"></h3>
            <pre id="aggregationResultPreview"
                 data-bind="aceEditor: { code: aggregationResult, fontSize:'14px', lang: 'ace/mode/json', readOnly: true }"></pre>
            <div data-bind="if: hasEntries">
                <hr />
                <h3 data-bind="i18n: { key: 'visualizer:treeExplorer.entries', options: { entriesCount: tableItems.length.toLocaleString() } }"></h3>
                <div style="position: relative; height: 500px">
                    <virtual-grid style="height: 500px" class="resizable flex-window" params="controller: gridController"></virtual-grid>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <div class="text-right">
                <button type="button" class="btn btn-default" data-bind="click: $root.close, i18n: 'visualizer:treeExplorer.close'"></button>
            </div>
        </div>
    </div>
</div>
<div class="tooltip json-preview js-visualizer-tree-tooltip" style="opacity: 0">
</div>
