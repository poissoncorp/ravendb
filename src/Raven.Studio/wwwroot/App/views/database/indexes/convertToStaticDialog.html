<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-bind="click: close" aria-hidden="true">
                <i class="icon-cancel"></i>
            </button>
            <h3 class="modal-title" data-bind="i18n: 'editIndex:convertToStatic.title'"></h3>
        </div>
        <div class="modal-body vstack gap-2">

            <div class="form-group word-break">
                <label class="control-label" data-bind="i18n: 'editIndex:indexName.title'"></label>
                <strong class="form-control-static" data-bind="text: indexName"></strong>
            </div>
            
            <div class="hstack gap-2">
                <button class="btn btn-primary" data-bind="click: createNewStaticIndex, i18nAttr: { title: 'editIndex:convertToStatic.createTitle' }">
                    <i class="icon-index icon-addon-plus"></i> <span data-bind="i18n: 'editIndex:convertToStatic.create'"></span>
                </button>
                <button class="btn btn-secondary" data-bind="click: () => downloadConvertedIndex('Json'), i18nAttr: { title: 'editIndex:convertToStatic.downloadJsonTitle' }">
                    <i class="icon-download"></i> <span data-bind="i18n: 'editIndex:convertToStatic.downloadJson'"></span>
                </button>
                <button class="btn btn-secondary" data-bind="click: () => downloadConvertedIndex('CsharpClass'), i18nAttr: { title: 'editIndex:convertToStatic.downloadCsharpTitle' }">
                    <i class="icon-download"></i> <span data-bind="i18n: 'editIndex:convertToStatic.downloadCsharp'"></span>
                </button>
            </div>

        </div>
        <div class="modal-footer">
            <div>
                <button class="btn btn-default" data-bind="click: close, i18nAttr: { title: 'editIndex:dialog.closeTitle' }">
                    <i class="icon-cancel"></i><span data-bind="i18n: 'editIndex:dialog.close'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
