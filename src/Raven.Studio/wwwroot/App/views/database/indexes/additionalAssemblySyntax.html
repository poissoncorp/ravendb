<div class="modal-dialog modal-lg" role="document" id="additionalAssymblySyntaxDialog">
    <div class="modal-content">
        <div class="modal-body">
            <div data-bind="compose: additionalTextView"></div>
            <h3 class="margin-top" data-bind="html: csharpExampleHtml"></h3>
            <div>
                <span data-bind="i18n: 'editIndex:additionalSyntax.toUse'"></span><br>
                <ol>
                    <li><small data-bind="html: addPackageHtml"></small></li>
                    <li><small data-bind="i18n: 'editIndex:additionalSyntax.uploadSource'"></small></li>
                </ol>
            </div>
            <div data-bind="foreach: $data.constructor.csharpSamples">
                <pre class="copy-area"><a href="#" class="copy-button-hidden" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'editIndex:syntaxSamples.copyTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
            </div>
        </div>
    </div>
</div>
