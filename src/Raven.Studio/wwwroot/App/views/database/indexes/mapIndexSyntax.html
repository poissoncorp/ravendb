<div class="modal-dialog modal-lg" role="document" id="mapIndexSyntaxDialog">
    <div class="modal-content">
        <div class="modal-body">
            <button type="button" class="close" data-dismiss="modal" data-bind="i18nAttr: { 'aria-label': 'editIndex:dialog.close' }"><i class="icon-cancel"></i></button>
            <h3 class="margin-bottom margin-top" data-bind="i18n: 'editIndex:mapSyntax.title'"></h3>
            <div class="margin-bottom" data-bind="html: descriptionHtml"></div>
            <hr>
            <div class="margin-bottom" data-bind="i18n: 'editIndex:mapSyntax.examplesInfo'"></div>
            <div class="row">
                <div data-bind="foreach: $data.constructor.samples">
                    <div class="col-md-6">
                        <div class="margin-top">
                            <h3 data-bind="html: $root.exampleHeadingHtml(title)"></h3>
                        </div>
                        <pre class="copy-area"><a href="#" class="copy-button-hidden" data-bind="click: _.partial($root.copySample, title), i18nAttr: { title: 'editIndex:syntaxSamples.copyTitle' }"><i class="icon-copy"></i></a><span data-bind="html: html"></span></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
