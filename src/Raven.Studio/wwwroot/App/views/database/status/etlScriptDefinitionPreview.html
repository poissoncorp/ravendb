<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <div class="flex-horizontal">
                <div class="flex-grow">
                    <h3 class="modal-title" id="myModalLabel" data-bind="i18n: 'etlScriptDefinitionPreview:title'"></h3>
                </div>
                <div>
                    <button type="button" class="close" data-bind="click: $root.close" aria-hidden="true">
                        <i class="icon-cancel"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="modal-body">
            <div class="padding text-center" data-bind="visible: spinners.loading">
                <i class="global-spinner"></i>
            </div>

            <div class="modal-details" data-bind="visible: !spinners.loading()">
                <div class="details-item">
                    <div class="row">
                        <div class="col-sm-6 text-right" data-bind="i18n: 'etlScriptDefinitionPreview:taskType'"></div>
                        <div class="col-sm-6 details-value" data-bind="text: etlType"></div>
                    </div>
                </div>
                <div class="details-item">
                    <div class="row">
                        <div class="col-sm-6 text-right" data-bind="i18n: 'etlScriptDefinitionPreview:taskName'"></div>
                        <div class="col-sm-6 details-value" data-bind="text: taskName"></div>
                    </div>
                </div>
                <div class="details-item">
                    <div class="row">
                        <div class="col-sm-6 text-right" data-bind="i18n: 'etlScriptDefinitionPreview:transformationName'"></div>
                        <div class="col-sm-6 details-value" data-bind="text: transformationName"></div>
                    </div>
                </div>
                <div class="details-item">
                    <div class="row">
                        <div class="col-sm-6 text-right" data-bind="i18n: 'etlScriptDefinitionPreview:collections'"></div>
                        <div class="col-sm-6 details-value" data-bind="with: transformation">
                            <span class="etl-collections" data-bind="foreach: Collections, visible: !ApplyToAllDocuments && Collections.length, i18nAttr: { title: 'etlScriptDefinitionPreview:collectionsTitle' }">
                                <span data-bind="text: $data"></span>
                            </span>
                            <span class="etl-collections" data-bind="visible: ApplyToAllDocuments, i18nAttr: { title: 'etlScriptDefinitionPreview:collectionsTitle' }">
                                <span data-bind="i18n: 'etlScriptDefinitionPreview:allCollections'"></span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="details-item" data-bind="visible: !script()">
                    <div class="row">
                        <div class="col-sm-6 text-right" data-bind="i18n: 'etlScriptDefinitionPreview:transformationScript'"></div>
                        <div class="col-sm-6 details-value" data-bind="i18n: 'etlScriptDefinitionPreview:noTransformScript'"></div>
                    </div>
                </div>
                <div data-bind="visible: script">
                    <span data-bind="i18n: 'etlScriptDefinitionPreview:transformScript'"></span>
                    <pre class="form-control editor"
                         data-bind="aceEditor: { code: script, fontSize: '14px', lang: 'ace/mode/javascript', readOnly: true }" style="height: 250px;"></pre>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <div class="text-right">
                <button type="button" class="btn btn-default" data-bind="click: $root.close, i18n: 'etlScriptDefinitionPreview:close'"></button>
            </div>
        </div>
    </div>
</div>
