<div class="flex-vertical absolute-fill content-margin edit-time-series">
    <div class="flex-horizontal flex-shrink-0 document-header">
        <div class="documentId">
            <a class="obj-name on-base-background" data-bind="text: documentId, attr: { href: urlForDocument }, i18nAttr: { title: { key: 'editTimeSeries:header.goToDocument', options: { documentId: documentId } } }"></a>
        </div>
        <i class="icon-arrow-right margin-left margin-right"></i>
        <div class="btn-group-label" data-bind="i18nAttr: { 'data-label': 'editTimeSeries:header.timeSeriesLabel' }">
            <div class="dropdown dropdown-right">
                <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown">
                    <span data-bind="text: timeSeriesNameText"></span>
                    <span class="caret"></span>
                </button>
                <ul class="dropdown-menu" data-bind="foreach: timeSeriesList">
                    <li><a href="#" data-bind="text: $data.nameAndNumberFormatted, click: _.partial($root.currentSeriesWasChanged, $data.name())"></a></li>
                </ul>
            </div>
        </div>
        <small class="margin-left">
            <span data-bind="visible: !isRollupTimeSeries()" class="no-wrap">
                <label class="control-label" data-bind="i18n: 'editTimeSeries:header.rawData'"></label>
                <a class="raw-data-info" data-toggle="tooltip"><i class="icon-info text-info margin-left margin-left-xs"></i></a>
            </span>
            <span data-bind="visible: isRollupTimeSeries" class="no-wrap">
                <label class="control-label" data-bind="html: rollupDataHtml"></label>
                <a class="rollups-info" data-toggle="tooltip"><i class="icon-info text-info margin-left margin-left-xs"></i></a>
            </span>
        </small>
        <div class="flex-separator"></div>
        <small class="bg-warning text-warning padding padding-xs" data-bind="visible: hasMoreThanFiveRawValues()">
            <i class="icon-warning"></i>
            <span data-bind="html: moreThanFiveValuesHtml"></span>
        </small>
    </div>
    <div class="flex-horizontal flex-shrink-0">
        <div class="btn-bar toolbar">
            <div class="btn-group">
                <button class="btn btn-primary" type="button" 
                        data-bind="click: _.partial($root.createTimeSeries, false), i18nAttr: { title: { key: 'editTimeSeries:toolbar.newEntryTitle', options: { name: timeSeriesName } } }, requiredAccess: 'DatabaseReadWrite'">
                    <i class="icon-plus"></i>
                    <span data-bind="i18n: 'editTimeSeries:toolbar.newEntry'"></span>
                </button>
                <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" data-bind="requiredAccess: 'DatabaseReadWrite'">
                    <span class="caret"></span>
                    <span class="sr-only" data-bind="i18n: 'editTimeSeries:toolbar.toggleDropdown'"></span>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <a href="#" data-bind="click: _.partial($root.createTimeSeries, true)">
                            <i class="icon-plus"></i> <span data-bind="i18n: 'editTimeSeries:toolbar.addTimeSeries'"></span>
                        </a>
                    </li>
                </ul>
            </div>
            <button class="btn btn-danger" type="button" data-bind="click: deleteTimeSeries, enable: canDeleteSelected, requiredAccess: 'DatabaseReadWrite'">
                <i class="icon-trash"></i>
                <span data-bind="text: deleteButtonText"></span>
            </button>
        </div>
        <div class="flex-separator"></div>
        <div class="btn-bar toolbar">
            <div class="btn-group">
                <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.timezoneTitle' }">
                    <i class="icon-clock"></i>
                    <span data-bind="i18n: 'editTimeSeries:toolbar.timezone'"></span>
                    <strong data-bind="text: displayTimezoneLabel"></strong>
                    <span class="caret margin-left margin-left-xs"></span>
                </button>
                <ul class="dropdown-menu">
                    <li data-bind="css: { active: displayTimezone() === 'utc' }, click: _.partial($root.setDisplayTimezone, 'utc')">
                        <a href="#" data-bind="i18n: { key: 'editTimeSeries:zone', options: { context: 'utc' } }, i18nAttr: { title: 'editTimeSeries:toolbar.utcTitle' }"></a>
                    </li>
                    <li data-bind="css: { active: displayTimezone() === 'local' }, click: _.partial($root.setDisplayTimezone, 'local')">
                        <a href="#" data-bind="i18n: { key: 'editTimeSeries:zone', options: { context: 'local' } }, i18nAttr: { title: 'editTimeSeries:toolbar.localTitle' }"></a>
                    </li>
                </ul>
            </div>
            <!-- ko if: hasFilter -->
            <div data-bind="react: filterBadgeView"></div>
            <!-- /ko -->
            <button data-bind="click: openFilterDialog, attr: { class: 'btn btn-default' + (hasFilter() ? ' active' : '') }">
                <i class="glyphicon glyphicon-filter"></i>
                <span class="margin-left margin-left-xs" data-bind="i18n: 'editTimeSeries:toolbar.filter'"></span>
            </button>
            <div class="btn-group">
                <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" data-bind="enable: itemsSoFar()">
                    <i class="icon-graph"></i>
                    <span data-bind="i18n: 'editTimeSeries:toolbar.plot'"></span>
                    <span class="caret"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-right">
                    <li data-bind="click: plotTimeSeries">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotRawTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotRaw'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1s')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.secondsTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.seconds'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1m')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.minutesTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.minutes'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1h')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.hoursTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.hours'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1d')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.daysTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.days'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1mon')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.monthsTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.months'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1quarter')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.quartersTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.quarters'"></span>
                        </a>
                    </li>
                    <li data-bind="click: _.partial(plotGroupedTimeSeries, '1year')">
                        <a href="#" data-bind="i18nAttr: { title: 'editTimeSeries:toolbar.plotGrouped.yearsTitle' }">
                            <span data-bind="i18n: 'editTimeSeries:toolbar.plotGrouped.years'"></span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="flex-grow">
        <div class="scroll-stretch">
            <div class="panel">
                <virtual-grid class="resizable" params="controller: gridController, emptyTemplate: 'empty-time-series-template'"></virtual-grid>
            </div>
        </div>
    </div>
    <div data-bind="if: filterTimeSeriesModalView()">
        <div class="bs5" data-bind="react: filterTimeSeriesModalView"></div>
    </div>
    <div data-bind="if: deleteRangeModalView()">
        <div class="bs5" data-bind="react: deleteRangeModalView"></div>
    </div>
</div>

<script type="text/html" id="empty-time-series-template">
    <span data-bind="i18n: 'editTimeSeries:grid.empty'"></span>
</script>

<div class="tooltip json-preview lg js-time-series-tooltip" style="opacity: 0">
</div>
