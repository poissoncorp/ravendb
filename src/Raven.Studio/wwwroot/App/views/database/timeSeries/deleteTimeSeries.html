<div class="modal-dialog prevent-close modal-lg" role="document">
    <form class="flex-form" data-bind="submit: deleteItems" autocomplete="off">
        <div class="modal-content" tabindex="-1">
            <div class="modal-header">
                <button type="button" class="close" data-bind="click: cancel" aria-hidden="true">
                    <i class="icon-cancel"></i>
                </button>
                <h4 class="modal-title" data-bind="i18n: 'editTimeSeries:deleteDialog.title'"></h4>
            </div>
            <div class="modal-body">
                <div class="padding padding-sm">
                    <div data-bind="visible: criteria.mode === 'all', html: deletingAllHtml"></div>
                    <div data-bind="visible: criteria.mode === 'selection', html: deletingSelectionHtml"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-bind="click: cancel, i18n: 'common:cancel'"></button>
                <button type="submit" class="btn btn-primary" data-bind="css: { 'btn-spinner': spinners.delete }, disable: spinners.delete">
                    <i class="icon-trash"></i>
                    <span data-bind="i18n: 'common:delete'"></span>
                </button>
            </div>
        </div>
    </form>
</div>
