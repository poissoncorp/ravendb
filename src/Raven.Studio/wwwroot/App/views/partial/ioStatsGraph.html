<div>
    <div class="main-colors" style="display: none">
        <div class="color-definitions">
            <div class="axis"></div>
            <div class="axisText"></div>
            <div class="gaps"></div>
            <div class="trackBackground"></div>
            <div class="trackNameBg"></div>
            <div class="trackNameFg"></div>
            <div class="openedTrackArrow"></div>
            <div class="closedTrackArrow"></div>
            <div class="text"></div>
        </div>
    </div>
    <div class="event-colors" style="display: none">
        <div class="color-definitions">
            <div class="compression" data-property="Compression">
                <div class="low"></div>
                <div class="high"></div>
            </div>
            <div class="dataFlush" data-property="DataFlush">
                <div class="low"></div>
                <div class="high"></div>
            </div>
            <div class="dataSync" data-property="DataSync">
                <div class="low"></div>
                <div class="high"></div>
            </div>
            <div class="journalWrite" data-property="JournalWrite">
                <div class="low"></div>
                <div class="high"></div>
            </div>
        </div>
    </div>
    <div class="flex-vertical absolute-fill">
        <div class="flex-horizontal margin-bottom margin-bottom-sm">
            <div class="form-inline">
                <span data-bind="visible: supportsIndexes">
                    <input type="text" accesskey="/" class="form-control" data-bind="textInput: searchText, enable: hasIndexes, i18nAttr: { placeholder: 'ioStatsGraph:filterPlaceholder', title: 'ioStatsGraph:filterTitle' }" />
                    <button class="btn btn-default" data-bind="click: expandIndexes, enable: indexesVisible, visible: !isIndexesExpanded(), i18nAttr: { title: 'ioStatsGraph:expandTitle' }"><i class="icon-expand"></i> <span data-bind="i18n: 'ioStatsGraph:expand'"></span></button>
                    <button class="btn btn-default" data-bind="click: collapseIndexes, enable: indexesVisible, visible: isIndexesExpanded, i18nAttr: { title: 'ioStatsGraph:collapseTitle' }"><i class="icon-collapse"></i> <span data-bind="i18n: 'ioStatsGraph:collapse'"></span></button>
                </span>
                <button class="btn btn-default" data-bind="click: exportAsJson, enable: hasAnyData, visible: !isImport(), i18nAttr: { title: 'ioStatsGraph:exportTitle' }">
                    <i class="icon-export"></i><span data-bind="i18n: 'ioStatsGraph:export'"></span>
                </button>
                <label for="importFilePicker" class="btn btn-default">
                    <i class="icon-import"></i><span data-bind="i18n: 'ioStatsGraph:import'"></span>
                </label>
                <span class="input-group file-input" data-bind="i18nAttr: { title: 'ioStatsGraph:importTitle' }">
                    <input type="file" id="importFilePicker" data-bind="event: { change: _.partial(fileSelected, $element) }" tabindex="-1" accept=".json" style="width: 10px">
                </span>
            </div>
            <div class="flex-separator"></div>
            <div data-bind="visible: hasAnyData, if: hasAnyData">
                <div id="IOMetricsLegend">
                    <div class="legend-container" data-bind="template: { name: 'legend-template', data: { type: 'Compression', textKey: 'ioStatsGraph:legend.compression' }}">
                    </div>
                    <div class="legend-container" data-bind="template: { name: 'legend-template', data: { type: 'JournalWrite', textKey: 'ioStatsGraph:legend.journalWrite' }}">
                    </div>
                    <div class="legend-container" data-bind="template: { name: 'legend-template', data: { type: 'DataFlush', textKey: 'ioStatsGraph:legend.dataFlush' }}">
                    </div>
                    <div class="legend-container" data-bind="template: { name: 'legend-template', data: { type: 'DataSync', textKey: 'ioStatsGraph:legend.dataSync' }}">
                    </div>
                </div>
            </div>
        </div>
        <div class="flex-horizontal flex-shrink-0">
            <div data-bind="visible: liveViewClient() && !bufferIsFull()">
                <small data-bind="i18n: { key: 'ioStatsGraph:bufferUsage', options: { usage: bufferUsage() } }"></small>
            </div>
            <div data-bind="visible: bufferIsFull">
                <small data-bind="i18n: 'ioStatsGraph:bufferFull'"></small>
            </div>
            <div class="flex-separator"></div>
            <button class="btn btn-default btn-sm margin-right margin-right-sm" data-bind="click: clearBrush, visible: clearSelectionVisible">
                <span data-bind="i18n: 'ioStatsGraph:clearSelection'"></span>
            </button>
            <button class="btn btn-sm btn-default" data-bind="click: closeImport, visible: isImport, i18nAttr: { title: 'ioStatsGraph:closeImportTitle' }">
                <i class="icon-cancel"></i><span data-bind="i18n: { key: 'ioStatsGraph:closeImport', options: { fileName: importFileName() } }"></span>
            </button>
            <div class="btn-group" data-bind="visible: !isImport()">
                <button class="btn btn-sm btn-info btn-checkable" data-bind="click: toggleScroll, css: { active: autoScroll }">
                    <i class="icon-logs"></i> <span data-bind="i18n: 'ioStatsGraph:monitoring'"></span>
                </button>
                <button class="btn btn-sm btn-danger" data-bind="click: clearGraphWithConfirm">
                    <i class="icon-cancel"></i><span data-bind="i18n: 'ioStatsGraph:clearGraph'"></span>
                </button>
            </div>
        </div>
        <div class="flex-grow dynamic-container">
            <div class="row" data-bind="visible: !hasAnyData()">
                <div class="col-sm-8 col-sm-offset-2 col-lg-6 col-lg-offset-3">
                    <div data-bind="visible: !loading()">
                        <i class="icon-xl icon-empty-set text-muted"></i>
                        <h2 class="text-center text-muted" data-bind="i18n: 'ioStatsGraph:noData'"></h2>
                    </div>
                    <div data-bind="visible: loading()">
                        <i class="icon-xl global-spinner text-muted"></i>
                        <h2 class="text-center text-muted on-base-background" data-bind="i18n: 'ioStatsGraph:loading'"></h2>
                    </div>
                </div>
            </div>
            <div id="ioStats" style="position: relative" data-bind="visible: hasAnyData">
                <section class="metricsContainer" id="IOMetricsContainer">
                    <div class="tooltip tooltip-inner" style="opacity: 0; display: none">
                    </div>
                </section>
            </div>
        </div>
        <div class="results-error" data-bind="visible: !isConnectedToWebSocket() && !isImport()">
            <div class="help-block bg-warning text-warning">
                <span><i class="btn-spinner"></i><span class="margin-left" data-bind="i18n: 'ioStatsGraph:connecting'"></span></span>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="legend-template">
    <div class="legend-start-range">0</div>
    <div class="arrow-down" data-bind="style: { left: $parent.itemSizePositions.get(type)}, visible: $parent.itemHovered.get(type)"></div>
    <div class="legend-end-range" data-bind="text: $parent.computedItemValue($parent.legends.get(type))"></div>
    <img data-bind="attr: { src: $parent.legends.get(type)().imageStr }" />
    <div class="legend-title" data-bind="i18n: textKey"></div>
</script>
