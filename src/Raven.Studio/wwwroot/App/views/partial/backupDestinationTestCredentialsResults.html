<div class="padding bg-success small" data-bind="visible: Success">
    <div data-bind="i18n: 'backupDestinationTestCredentialsResults:connected'"></div>
</div>
<div class="padding bg-danger small" data-bind="visible: !Success">
    <span data-bind="i18n: { key: 'backupDestinationTestCredentialsResults:failed', options: { error: $parent.fullErrorDetailsVisible() ? Error : $parent.shortErrorText() } }"></span>
    <div>
        <a href="#" data-bind="click: $parent.fullErrorDetailsVisible.toggle.bind($parent.fullErrorDetailsVisible),
                               i18n: $parent.fullErrorDetailsVisible() ? 'backupDestinationTestCredentialsResults:hideDetails' : 'backupDestinationTestCredentialsResults:showDetails'"></a>
    </div>
</div>
