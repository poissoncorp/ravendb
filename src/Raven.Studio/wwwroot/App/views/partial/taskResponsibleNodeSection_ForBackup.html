<div>
    <div class="row margin-bottom small">
        <div class="col-sm-offset-4 col-lg-offset-2 col-sm-4" data-bind="visible: $root.possibleMentors().length === 0">
            <div class="text-warning bg-warning padding padding-xs">
                <div class="flex-horizontal">
                    <small>
                        <i class="icon-warning"></i>
                    </small>
                    <small class="margin-left margin-left-sm" data-bind="i18n: 'taskResponsibleNodeSectionForBackup:noNodesAvailable'"></small>
                </div>
            </div>
        </div>
    </div>

    <div data-bind="validationElement: mentorNode, collapse: manualChooseMentor">
        <div class="row" data-bind="css: { 'margin-bottom-xs': mentorNode() }">
            <label class="control-label col-sm-4 col-lg-2" data-bind="i18n: 'taskResponsibleNodeSectionForBackup:responsibleNode'"></label>
            <div class="col-sm-4 flex-horizontal">
                <div class="dropdown btn-block">
                    <button class="btn btn-block dropdown-toggle text-left" data-toggle="dropdown">
                        <span data-bind="i18n: { key: mentorNode() ? 'taskResponsibleNodeSectionForBackup:node' : 'taskResponsibleNodeSectionForBackup:selectNode', options: { nodeTag: mentorNode() } }"></span>
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" data-bind="foreach: $root.possibleMentors">
                        <li><a href="#" data-bind="i18n: { key: 'taskResponsibleNodeSectionForBackup:node', options: { nodeTag: $data } }, click: $parent.mentorNode.bind($parent.mentorNode, $data)"></a></li>
                    </ul>
                    <span class="help-block" data-bind="validationMessage: mentorNode"></span>
                </div>
            </div>
        </div>
        <div class="row margin-bottom small">
            <div class="col-sm-offset-4 col-lg-offset-2 col-sm-4" data-bind="visible: mentorNode">
                <div class="toggle" data-placement="right" data-toggle="tooltip" data-animation="true" data-bind="i18nAttr: { title: 'taskResponsibleNodeSectionForBackup:pinNodeTitle' }">
                <input id="pinMentorNode" type="checkbox" data-bind="checked: pinMentorNode">
                <label for="pinMentorNode" data-bind="i18n: 'taskResponsibleNodeSectionForBackup:pinNode'"></label>
            </div>
            </div>
        </div>
        <div class="row margin-bottom small">
            <div class="col-sm-offset-4 col-lg-offset-2 col-sm-4" data-bind="visible: mentorNode">
                <div data-bind="compose: $root.pinResponsibleNodeTextScriptView"></div>
            </div>
        </div>
    </div>    
</div>
