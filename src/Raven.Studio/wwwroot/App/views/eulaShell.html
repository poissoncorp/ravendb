<div class="container">
    <div class="flex-horizontal">
        <div>
            <i class="icon-raven text-primary icon-lg"></i>
        </div>
        <div class="padding">
            <h2 class="margin-none"> <strong data-bind="i18n: 'eulaShell:title'"></strong></h2>
        </div>
        
    </div>
    <div class="content-container-wrapper">
        <div id="page-host-root" class="content-container eula-host">
            <div id="page-host" class="page-host" data-bind="router: { cacheViews: false }"></div>
        </div>
    </div>

</div>


<footer class="bs3 status-footer">
    <div class="footer-right">
        <div class="footer-item">
            <div data-bind="i18nAttr: { title: 'eulaShell:studioVersion' }">
                <i class="icon-client"></i> <span data-bind="text: $root.constructor.clientVersion"></span>
            </div>
        </div>
        <div class="footer-item">
            <div data-bind="i18nAttr: { title: 'eulaShell:serverVersion' }">
                <i class="icon-server"></i> <span data-bind="text: $root.constructor.buildInfo.serverBuildVersion() ? $root.constructor.buildInfo.serverBuildVersion().FullVersion : ''"></span>
            </div>
        </div>
    </div>
</footer>
