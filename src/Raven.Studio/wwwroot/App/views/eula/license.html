<h3 class="text-uppercase" data-bind="i18n: 'eulaLicense:title'"></h3>

<div class="panel padding padding-lg text-center">
    <pre data-bind="text: eula">
    </pre>
</div>

<div class="navigation margin-top flex-horizontal">
    <div class="text-warning text-uppercase" data-bind="i18n: 'eulaLicense:forbiddenWithoutAccepting'"></div>
    <div class="flex-separator"></div>
    <button class="btn btn-primary btn-lg" data-bind="enable: canAccept() && !spinners.accept(), click: accept, css: { 'btn-spinner' : spinners.accept } ">
        <i class="icon-check"></i>
        <span data-bind="i18n: 'eulaLicense:accept'"></span>
    </button>
</div>
